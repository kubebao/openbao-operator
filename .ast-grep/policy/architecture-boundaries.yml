modulePath: github.com/kubebao/openbao-operator

layerCoverage:
  root: internal
  layers:
    controller:
      - controller
    app:
      - app
    service:
      - service/configuration
      - service/bootstrap
      - service/backup
      - service/certs
      - service/identity
      - service/init
      - service/networking
      - service/opslifecycle
      - service/provisioner
      - service/restore
      - service/upgrade
      - service/workload
      - service/workloadidentity
    adapter:
      - adapter/auth
      - adapter/cluster
      - adapter/config
      - adapter/kube
      - adapter/openbao
      - adapter/probe
      - adapter/raft
      - adapter/revision
      - adapter/security
      - adapter/storage
      - adapter/storageenv
    port:
      - port
    platform:
      - platform/admission
      - platform/constants
      - platform/cryptopolicy
      - platform/entrypoint
      - platform/errors
      - platform/hardenedcontract
      - platform/kubernetestls
      - platform/logging
      - platform/observability
      - platform/openbaotls
      - platform/predicates
      - platform/reconcile
      - platform/resourceapply
      - platform/resourceidentity
      - platform/resourceownership
      - platform/semver
      - platform/statusapply
      - platform/statuspatch
      - platform/testutil

controllerCoverage:
  root: internal/controller

serviceImportRoots:
  - internal/service/configuration
  - internal/service/bootstrap
  - internal/service/backup
  - internal/service/certs
  - internal/service/identity
  - internal/service/init
  - internal/service/networking
  - internal/service/opslifecycle
  - internal/service/provisioner
  - internal/service/restore
  - internal/service/upgrade
  - internal/service/upgrade/bluegreen
  - internal/service/upgrade/core
  - internal/service/upgrade/raftops
  - internal/service/upgrade/rolling
  - internal/service/upgrade/snapshot
  - internal/service/workload
  - internal/service/workloadidentity

adapterImportRoots:
  - internal/adapter/auth
  - internal/adapter/cluster
  - internal/adapter/config
  - internal/adapter/kube
  - internal/adapter/openbao
  - internal/adapter/probe
  - internal/adapter/raft
  - internal/adapter/revision
  - internal/adapter/security
  - internal/adapter/storage
  - internal/adapter/storageenv

controllerBoundaries:
  - name: openbaocluster
    displayName: OpenBaoCluster
    files:
      - internal/controller/openbaocluster/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/service/upgrade
      - internal/adapter/revision
      - internal/platform/logging
    appFacadeRoot: internal/app/openbaocluster
    allowServiceImports: []
    allowAdapterImports: []
  - name: openbaorestore
    displayName: OpenBaoRestore
    files:
      - internal/controller/openbaorestore/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/service/upgrade
      - internal/adapter/revision
      - internal/platform/logging
    appFacadeRoot: internal/app/openbaorestore
    allowServiceImports: []
    allowAdapterImports: []
  - name: provisioner
    displayName: Provisioner
    files:
      - internal/controller/provisioner/**/*.go
    ignores:
      - "**/*_test.go"
    disallowImports:
      - internal/service/upgrade
      - internal/adapter/revision
      - internal/platform/logging
    appFacadeRoot: internal/app/provisioner
    allowServiceImports: []
    allowAdapterImports: []

serviceBoundaries:
  - name: configuration
    displayName: Configuration
    packageRoot: internal/service/configuration
    files:
      - internal/service/configuration/**/*.go
    ignores:
      - "**/*_test.go"
    allowServiceImports: []
    allowAdapterImports:
      - internal/adapter/config
  - name: bootstrap
    displayName: Bootstrap
    packageRoot: internal/service/bootstrap
    files:
      - internal/service/bootstrap/**/*.go
    ignores:
      - "**/*_test.go"
    allowServiceImports:
      - internal/service/configuration
    allowAdapterImports:
      - internal/adapter/auth
      - internal/adapter/config
  - name: backup
    displayName: Backup
    packageRoot: internal/service/backup
    files:
      - internal/service/backup/**/*.go
    ignores:
      - "**/*_test.go"
    allowServiceImports:
      - internal/service/opslifecycle
      - internal/service/workloadidentity
    allowAdapterImports:
      - internal/adapter/auth
      - internal/adapter/kube
      - internal/adapter/security
      - internal/adapter/storage
      - internal/adapter/storageenv
  - name: certs
    displayName: Certs
    packageRoot: internal/service/certs
    files:
      - internal/service/certs/**/*.go
    ignores:
      - "**/*_test.go"
    allowServiceImports: []
    allowAdapterImports:
