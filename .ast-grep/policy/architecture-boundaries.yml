      - internal/app/openbaocluster/adminops/**/*.go
      - internal/app/openbaocluster/adminopsstatus/**/*.go
      - internal/app/openbaocluster/deletionops/**/*.go
      - internal/app/openbaocluster/statusops/**/*.go
    allowServiceImports:
      - internal/service/bootstrap
      - internal/service/certs
      - internal/service/configuration
      - internal/service/identity
      - internal/service/networking
      - internal/service/upgrade
      - internal/service/workload
      - internal/service/workloadidentity
  - name: openbaocluster-adminops
    displayName: OpenBaoCluster AdminOps
    files:
      - internal/app/openbaocluster/adminops/**/*.go
    ignores:
      - "**/*_test.go"
    allowServiceImports:
      - internal/service/backup
      - internal/service/configuration
      - internal/service/networking
      - internal/service/upgrade
      - internal/service/upgrade/bluegreen
      - internal/service/upgrade/rolling
      - internal/service/workload
  - name: openbaocluster-statusops
    displayName: OpenBaoCluster StatusOps
    files:
