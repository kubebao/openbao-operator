name: Docs build
description: Build and validate the canonical Hugo documentation site without Node.js dependencies.

runs:
  using: composite
  steps:
    - name: Test documentation publisher
      shell: bash
      run: bash hack/docs/test-publish-gh-pages.sh

    - name: Install pinned Hugo
      shell: bash
      run: |
        set -euo pipefail
        install_dir="${RUNNER_TEMP}/hugo-bin"
        bash hack/docs/install-hugo.sh "${install_dir}"
        echo "${install_dir}" >> "${GITHUB_PATH}"

    - name: Build and validate documentation
      shell: bash
      run: make docs-build
