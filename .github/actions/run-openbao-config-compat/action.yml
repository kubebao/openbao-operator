name: Run OpenBao config compatibility
description: Validate generated HCL fixtures against upstream OpenBao releases and optionally report schema drift.

inputs:
  versions:
    description: Space-delimited OpenBao versions to validate.
    required: false
    default: ""
  report-schema-drift:
    description: Whether to report upstream OpenBao schema drift across the version range.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate HCL fixtures against upstream OpenBao parser
      shell: bash
      env:
        REPORT_SCHEMA_DRIFT: ${{ inputs.report-schema-drift }}
        VERSIONS: ${{ inputs.versions }}
      run: |
        set -euo pipefail
        read -r -a versions <<< "${VERSIONS}"
        bash hack/ci/openbao-config-compat.sh "${versions[@]}"

    - name: Upload configuration compatibility evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: openbao-config-compatibility
        path: dist/test/openbao-config-compat/
        if-no-files-found: warn
        retention-days: 7
