version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /
      - /test/e2e/images/openbao-softhsm
      - /test/e2e/images/pykmip-server
    schedule:
      interval: weekly
      day: wednesday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /test/e2e/images/pykmip-server
    schedule:
      interval: weekly
      day: wednesday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      pykmip-fixture:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /hack/ci/release-please
    schedule:
      interval: weekly
      day: thursday
      time: "03:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
