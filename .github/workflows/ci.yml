name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for concurrency grouping and PR-associated reruns.
        required: false
        type: string
      force_full_e2e:
        description: Run the full PR E2E suite for the selected ref.
        required: false
        default: false
        type: boolean
      force_backup_e2e:
        description: Run the backup/restore PR E2E shard set.
        required: false
        default: false
        type: boolean
      force_upgrade_e2e:
        description: Run the upgrade PR E2E shard set.
        required: false
        default: false
        type: boolean
      force_hardened_e2e:
        description: Run the hardened/security PR E2E shard set.
        required: false
        default: false
        type: boolean
      force_seal_e2e:
        description: Run the HSM/KMIP/PKCS#11 PR E2E lane.
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: &runner ubuntu-24.04
    outputs:
      expected_checks: ${{ steps.plan.outputs.expected_checks }}
      manual_e2e_requested: ${{ steps.diff.outputs.manual_e2e_requested }}
      manual_full_e2e: ${{ steps.diff.outputs.manual_full_e2e }}
      manual_backup_e2e: ${{ steps.diff.outputs.manual_backup_e2e }}
      manual_upgrade_e2e: ${{ steps.diff.outputs.manual_upgrade_e2e }}
      manual_hardened_e2e: ${{ steps.diff.outputs.manual_hardened_e2e }}
      manual_seal_e2e: ${{ steps.diff.outputs.manual_seal_e2e }}
      chart: ${{ steps.diff.outputs.chart }}
      workflow: ${{ steps.diff.outputs.workflow }}
      toolchain: ${{ steps.diff.outputs.toolchain }}
      docs: ${{ steps.diff.outputs.docs }}
      go_quality: ${{ steps.diff.outputs.go_quality }}
      api_contract: ${{ steps.diff.outputs.api_contract }}
      go_toolchain: ${{ steps.diff.outputs.go_toolchain }}
      go_tests: ${{ steps.diff.outputs.go_tests }}
      config_compat: ${{ steps.diff.outputs.config_compat }}
      security_scan: ${{ steps.diff.outputs.security_scan }}
      security_image: ${{ steps.diff.outputs.security_image }}
      fuzz: ${{ steps.diff.outputs.fuzz }}
      e2e: ${{ steps.diff.outputs.e2e }}
      operator_upgrade_e2e: ${{ steps.diff.outputs.operator_upgrade_e2e }}
      e2e_backup: ${{ steps.diff.outputs.e2e_backup }}
      e2e_upgrade: ${{ steps.diff.outputs.e2e_upgrade }}
      e2e_hardened: ${{ steps.diff.outputs.e2e_hardened }}
      e2e_seal: ${{ steps.diff.outputs.e2e_seal }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect chart changes
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_E2E_REQUESTED: ${{ (inputs.force_full_e2e || inputs.force_backup_e2e || inputs.force_upgrade_e2e || inputs.force_hardened_e2e || inputs.force_seal_e2e) && 'true' || 'false' }}
          MANUAL_FULL_E2E: ${{ inputs.force_full_e2e && 'true' || 'false' }}
          MANUAL_BACKUP_E2E: ${{ inputs.force_backup_e2e && 'true' || 'false' }}
          MANUAL_UPGRADE_E2E: ${{ inputs.force_upgrade_e2e && 'true' || 'false' }}
          MANUAL_HARDENED_E2E: ${{ inputs.force_hardened_e2e && 'true' || 'false' }}
          MANUAL_SEAL_E2E: ${{ inputs.force_seal_e2e && 'true' || 'false' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail

          head_sha="${GITHUB_SHA}"
          base_sha=""

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            {
              echo "manual_e2e_requested=${MANUAL_E2E_REQUESTED}"
              echo "manual_full_e2e=${MANUAL_FULL_E2E}"
              echo "manual_backup_e2e=${MANUAL_BACKUP_E2E}"
              echo "manual_upgrade_e2e=${MANUAL_UPGRADE_E2E}"
              echo "manual_hardened_e2e=${MANUAL_HARDENED_E2E}"
              echo "manual_seal_e2e=${MANUAL_SEAL_E2E}"
              for key in chart workflow toolchain docs go_quality api_contract go_toolchain go_tests config_compat security_scan security_image fuzz e2e operator_upgrade_e2e e2e_backup e2e_upgrade e2e_hardened e2e_seal; do
                echo "${key}=false"
              done
            } >> "${GITHUB_OUTPUT}"
            echo "::notice::workflow_dispatch run: skipping diff-based routing and using manual inputs."
            exit 0
          fi

          {
            echo "manual_e2e_requested=false"
            echo "manual_full_e2e=false"
            echo "manual_backup_e2e=false"
            echo "manual_upgrade_e2e=false"
            echo "manual_hardened_e2e=false"
            echo "manual_seal_e2e=false"
          } >> "${GITHUB_OUTPUT}"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            base_sha="${PUSH_BEFORE_SHA}"
          else
            echo "Unsupported event: ${EVENT_NAME}" >&2
            exit 1
          fi

          # A failed diff must not become an empty change list.
          git cat-file -e "${head_sha}^{commit}"
          if [[ "${EVENT_NAME}" == "push" && "${base_sha}" =~ ^0+$ ]]; then
            changed="$(git ls-tree -r --name-only "${head_sha}")"
          else
            if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${base_sha}"
              git cat-file -e "${base_sha}^{commit}"
            fi
            # Include both paths of a rename in routing.
            changed="$(git diff --no-renames --name-only "${base_sha}" "${head_sha}")"
          fi
          changed_matches() {
            local result=0
            grep -qE "$1" <<< "${changed}" || result=$?
            if (( result > 1 )); then exit "${result}"; fi
            return "${result}"
          }

          changed_matches_file() {
            local result=0
            grep -qE -f "$1" <<< "${changed}" || result=$?
            if (( result > 1 )); then exit "${result}"; fi
            return "${result}"
          }

          if changed_matches '^(charts/openbao-operator/|config/(crd|policy|rbac)/|hack/helm(chart|values)/|hack/tools/edge_chart/|hack/ci/(test-edge-chart|test-publish-edge-chart|publish-edge-chart|helm-e2e-smoke)\.sh$|hack/dev/tool-versions\.env$)'; then
            echo "chart=true" >> "${GITHUB_OUTPUT}"
          else
            echo "chart=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches_file 'hack/ci/e2e-execution-paths.txt' || changed_matches '^(\.github/(workflows|actions|scripts)/|hack/tools/ci_(checks|report)/|hack/ci/test_e2e_execution\.py$|hack/dev/tool-versions\.env$|hack/ci/)' || changed_matches_file 'hack/ci/e2e-selection-paths.txt'; then
            echo "workflow=true" >> "${GITHUB_OUTPUT}"
          else
            echo "workflow=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches '^(devenv\.(nix|yaml|lock)$|\.hugo-version$|go\.mod$|hack/dev/(install-ast-grep|verify-devenv)\.sh$|hack/dev/tool-versions\.env$|Makefile|mk/)'; then
            echo "toolchain=true" >> "${GITHUB_OUTPUT}"
          else
            echo "toolchain=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches '^(\.hugo-version$|website/|release-notes/|hack/docs/|CHANGELOG\.md|README\.md|CONTRIBUTING\.md|\.github/actions/docs-build/)'; then
            echo "docs=true" >> "${GITHUB_OUTPUT}"
          else
            echo "docs=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches '^(internal/|cmd/|api/|config/|test/|website/generated/api-reference\.md|go\.(mod|sum)$|vendor/|Makefile|mk/|hack/(ci/|perfcheck/|dev/install-ast-grep\.sh|tools/|helm(chart|values)/|boilerplate\.go\.txt)|\.golangci\.yml)'; then
            echo "go_quality=true" >> "${GITHUB_OUTPUT}"
          else
            echo "go_quality=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches '^(api/|config/crd/|hack/tools/(api_inventory|crd_compatibility)/|test/manifests/apicontract/|go\.(mod|sum)$|vendor/|Makefile$|mk/|\.github/(workflows/(ci|release)\.yml|actions/setup-repo-tools/))'; then
            echo "api_contract=true" >> "${GITHUB_OUTPUT}"
          else
            echo "api_contract=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches '^(Dockerfile(\..*)?|go\.mod$|Makefile|mk/|hack/ci/verify-go-toolchain-sync\.sh|\.github/workflows/ci\.yml)'; then
            echo "go_toolchain=true" >> "${GITHUB_OUTPUT}"
          else
            echo "go_toolchain=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches '^(internal/|cmd/|api/|config/|go\.(mod|sum)$|vendor/|Makefile|mk/|hack/(perfcheck/|tools/|helm(chart|values)/)|test/(integration/|unit/|perf/))'; then
            echo "go_tests=true" >> "${GITHUB_OUTPUT}"
          else
            echo "go_tests=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches '^(api/|internal/adapter/config/|internal/port/openbao/|internal/service/infra/|internal/app/openbaocluster/|internal/controller/openbaocluster/|go\.(mod|sum)$|vendor/|Makefile$|mk/|hack/ci/openbao-config-compat(\.sh$|/)|hack/tools/openbao/|test/manifests/apicontract/config_compat_workflows_test\.go$|\.github/(workflows/(ci|nightly)\.yml$|actions/(run-openbao-config-compat|setup-repo-tools)/))'; then
            echo "config_compat=true" >> "${GITHUB_OUTPUT}"
          else
            echo "config_compat=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches '^(internal/|cmd/|api/|config/|charts/|Dockerfile(\..*)?$|hack/(ci/|tools/)|hack/dev/tool-versions\.env$|go\.(mod|sum)$|vendor/|website/assets/js/|\.trivyignore|\.trivy\.yaml|Makefile|mk/)'; then
            echo "security_scan=true" >> "${GITHUB_OUTPUT}"
          else
            echo "security_scan=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches '^(internal/|cmd/|go\.(mod|sum)$|vendor/|Dockerfile(\..*)?$|\.dockerignore|hack/dev/tool-versions\.env$|Makefile|mk/|\.github/workflows/ci\.yml)'; then
            echo "security_image=true" >> "${GITHUB_OUTPUT}"
          else
            echo "security_image=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches '^(internal/|cmd/|go\.(mod|sum)$|hack/ci/fuzz\.sh|mk/|\.github/workflows/(ci|nightly)\.yml|Makefile)'; then
            echo "fuzz=true" >> "${GITHUB_OUTPUT}"
          else
            echo "fuzz=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches_file 'hack/ci/e2e-execution-paths.txt' || changed_matches '^(internal/|cmd/|api/|test/e2e/|Dockerfile(\..*)?$|hack/ci/|hack/dev/tool-versions\.env$|go\.(mod|sum)$|vendor/|Makefile|mk/)' || changed_matches_file 'hack/ci/e2e-selection-paths.txt'; then
            echo "e2e=true" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches '^(api/stability/v1alpha1\.yaml|charts/openbao-operator/|release-notes/|test/e2e/suites\.yaml|test/fixtures/(api-migration|operator-upgrade)/|Dockerfile(\.init)?$|hack/ci/operator-upgrade-e2e\.sh|hack/dev/tool-versions\.env$|Makefile|mk/)'; then
            echo "operator_upgrade_e2e=true" >> "${GITHUB_OUTPUT}"
          else
            echo "operator_upgrade_e2e=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches '^(internal/service/backup/|internal/service/restore/|internal/adapter/(storage|storageenv)/|cmd/bao-backup/|test/e2e/(e2e_suite_test\.go|framework/.*|helpers/.*|backup_restore_test\.go|restore_minimal_test\.go|suites\.yaml)|hack/tools/e2e_(manifest|plan)/|go\.(mod|sum)$|vendor/|Dockerfile\.backup$|Makefile|mk/)' || changed_matches_file 'hack/ci/e2e-lifecycle-paths.txt' || changed_matches_file 'hack/ci/e2e-execution-paths.txt' || changed_matches_file 'hack/ci/e2e-selection-paths.txt'; then
            echo "e2e_backup=true" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e_backup=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches '^(internal/service/upgrade/|cmd/bao-upgrade/|test/e2e/(e2e_suite_test\.go|framework/.*|helpers/.*|Upgrade_Strategies_test\.go|Upgrade_Target_Drift_test\.go|Upgrade_Operation_Lock_test\.go)|Makefile|mk/)' || changed_matches_file 'hack/ci/e2e-lifecycle-paths.txt' || changed_matches_file 'hack/ci/e2e-execution-paths.txt' || changed_matches_file 'hack/ci/e2e-selection-paths.txt'; then
            echo "e2e_upgrade=true" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e_upgrade=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches '^(internal/adapter/security/|internal/platform/admission/|internal/service/provisioner/|cmd/provisioner/|config/policy/|internal/controller/|cmd/controller/|test/e2e/(e2e_suite_test\.go|framework/.*|helpers/.*|Cluster_Profile_Hardened_test\.go|Cluster_TLS_ACME_test\.go|GitOps_Contract_test\.go|hardened_signed_suite\.go)|Makefile|mk/)' || changed_matches_file 'hack/ci/e2e-execution-paths.txt' || changed_matches_file 'hack/ci/e2e-selection-paths.txt'; then
            echo "e2e_hardened=true" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e_hardened=false" >> "${GITHUB_OUTPUT}"
          fi

          if changed_matches_file 'hack/ci/e2e-seal-paths.txt' || changed_matches_file 'hack/ci/e2e-execution-paths.txt' || changed_matches_file 'hack/ci/e2e-selection-paths.txt'; then
            echo "e2e_seal=true" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e_seal=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Record required job expectations
        id: plan
        env:
          GOFLAGS: -mod=vendor
          ROUTING_JSON: ${{ toJSON(steps.diff.outputs) }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci-routing
          printf '%s\n' "${ROUTING_JSON}" > artifacts/ci-routing/routing.json
          go build -o artifacts/ci-routing/ ./hack/tools/ci_checks ./hack/tools/ci_report
          artifacts/ci-routing/ci_checks plan \
            --event "${GITHUB_EVENT_PATH}" --event-name "${GITHUB_EVENT_NAME}" \
            --ref "${GITHUB_REF}" --repository "${GITHUB_REPOSITORY}" --sha "${GITHUB_SHA}" \
            --routing artifacts/ci-routing/routing.json \
            --plan artifacts/ci-routing/expected-checks.json --github-output "${GITHUB_OUTPUT}"
          {
            echo '## Required job expectations'
            echo '```json'
            cat artifacts/ci-routing/expected-checks.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload routing record and CI tools
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-routing
          path: artifacts/ci-routing/
          overwrite: true
          retention-days: 7

  security:
    name: Security (vulncheck + Semgrep + Trivy FS)
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['security']
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Run vulncheck
        env:
          GOFLAGS: -mod=vendor
        run: make vulncheck

      - name: Run Semgrep
        run: make semgrep-ci

      - name: Install Trivy (safe pinned release)
        uses: ./.github/actions/setup-trivy

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-files: config/rbac/provisioner_minimal_role.yaml,charts/openbao-operator/templates/rbac/provisioner-clusterroles.yaml,config/rbac/single_tenant_clusterrole.yaml,config/overlays/single-tenant/single_tenant_clusterrole.yaml,config/overlays/single-tenant-custom-identity/single_tenant_clusterrole.yaml,dist/install.yaml
          skip-dirs: test/manifests,vendor,bin
          trivy-config: .trivy.yaml

  dependency-licenses:
    name: Dependency Licenses
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['dependency-licenses']
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Verify shipped dependency licenses
        run: make license-check

  security-image:
    name: Security (Trivy built image ${{ matrix.image_name }})
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['security-image']
    runs-on: *runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: manager
            build_target: docker-build
            image_ref: local/openbao-operator-pr-scan:${{ github.sha }}
          - image_name: config-init
            build_target: docker-build-init
            image_ref: local/openbao-init-pr-scan:${{ github.sha }}
          - image_name: backup-executor
            build_target: docker-build-backup
            image_ref: local/openbao-backup-pr-scan:${{ github.sha }}
          - image_name: upgrade-executor
            build_target: docker-build-upgrade
            image_ref: local/openbao-upgrade-pr-scan:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Docker Hub cache
        uses: ./.github/actions/setup-docker-mirror

      - name: Build image
        run: make ${{ matrix.build_target }} IMG="${{ matrix.image_ref }}"

      - name: Install Trivy (safe pinned release)
        uses: ./.github/actions/setup-trivy

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ matrix.image_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  workflow-lint:
    name: Workflow Lint
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['workflow-lint']
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Run actionlint
        run: make verify-workflows

  devenv-contract:
    name: Devenv Contract (advisory)
    needs: changes
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.toolchain == 'true'
    runs-on: *runner
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Configure project and devenv binary caches
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: dc-tec-openbao-operator
          extraPullNames: devenv
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Install devenv from the pinned package set
        shell: bash
        run: |
          set -euo pipefail
          nixpkgs_url="$(awk '/^  nixpkgs:/{getline; sub(/^    url: /, ""); print; exit}' devenv.yaml)"
          nix profile add "${nixpkgs_url}#devenv"

      - name: Verify the devenv contract
        shell: bash
        run: |
          set -euo pipefail
          base_started_at="${SECONDS}"
          devenv test
          base_elapsed_seconds="$((SECONDS - base_started_at))"
          base_profile_path="$(devenv shell --quiet -- printenv DEVENV_PROFILE)"
          base_closure_size="$(nix path-info -Sh "${base_profile_path}" | awk '{print $2, $3}')"

          editor_started_at="${SECONDS}"
          devenv --profile editor test
          editor_elapsed_seconds="$((SECONDS - editor_started_at))"
          editor_profile_path="$(devenv --profile editor shell --quiet -- printenv DEVENV_PROFILE)"
          editor_closure_size="$(nix path-info -Sh "${editor_profile_path}" | awk '{print $2, $3}')"

          {
            echo "### Devenv shell contracts"
            echo
            echo "| Profile | Contract duration | Runtime closure |"
            echo "| --- | ---: | ---: |"
            echo "| Base | ${base_elapsed_seconds}s | ${base_closure_size} |"
            echo "| Editor | ${editor_elapsed_seconds}s | ${editor_closure_size} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  lint:
    name: Lint
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['lint']
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Run linter
        run: make lint-ci

  verify-fmt:
    name: Verify Formatting
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['verify-fmt']
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Verify gofmt
        run: make verify-fmt

  tidy-check:
    name: Verify go.mod/go.sum
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['tidy-check']
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Verify tidy
        run: make verify-tidy

  go-toolchain-sync:
    name: Verify Go Toolchain Sync
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['go-toolchain-sync']
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Go toolchain sync
        run: make verify-go-toolchain-sync

  verify-vendor:
    name: Verify vendor/
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['verify-vendor']
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Verify vendor tree
        run: make verify-vendor

  verify-generated:
    name: Verify Generated Artifacts
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['verify-generated']
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Verify generated files
        run: make verify-generated

  api-contract:
    name: API Contract
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['api-contract']
    runs-on: *runner
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Test API contract enforcement
        run: go test -count=1 ./hack/tools/api_inventory ./hack/tools/crd_compatibility ./test/manifests/apicontract

      - name: Verify API contract
        run: make verify-api-contract

  test-unit:
    name: Unit Tests
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['test-unit']
    runs-on: *runner
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Docker Hub cache
        uses: ./.github/actions/setup-docker-mirror

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Run unit tests
        run: make test

      - name: Verify policy authorization and repair against OpenBao 2.6.4
        run: make test-policy-reconciliation-openbao

      - name: Verify policy authorization and repair against OpenBao 2.7.1
        env:
          POLICY_TEST_OPENBAO_IMAGE: openbao/openbao:2.7.1
        run: make test-policy-reconciliation-openbao

      - name: Verify hybrid PQ TLS key exchange against OpenBao 2.7.1
        run: make test-tls-key-exchange-openbao

  test-integration:
    name: Envtest Integration
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['test-integration']
    runs-on: *runner
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Docker Hub cache
        uses: ./.github/actions/setup-docker-mirror

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Run unit, integration, and cluster-independent E2E support tests with coverage gate
        run: make test-ci

      - name: Verify controller JWT isolation against OpenBao 2.6.4
        run: make test-controller-jwt-openbao

      - name: Verify controller JWT isolation against OpenBao 2.7.1
        env:
          OPENBAO_JWT_TEST_IMAGE: openbao/openbao:2.7.1
        run: make test-controller-jwt-openbao

  fuzz:
    name: Fuzz Smoke
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['fuzz']
    runs-on: *runner
    env:
      GOFLAGS: -mod=vendor
      FUZZ_ARTIFACT_DIR: dist/fuzz
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Run fuzz smoke sweep
        run: make fuzz

      - name: Upload fuzz artifacts (failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: |
            dist/fuzz/
            **/testdata/fuzz/**/*
          if-no-files-found: ignore
          retention-days: 7

  openbao-config-compat:
    name: OpenBao Config Compatibility (2.6 migration and 2.7 current)
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['openbao-config-compat']
    runs-on: *runner
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Docker Hub cache
        uses: ./.github/actions/setup-docker-mirror

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Run OpenBao config compatibility
        uses: ./.github/actions/run-openbao-config-compat

  docs:
    name: Docs Build
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['docs']
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build docs
        uses: ./.github/actions/docs-build

  helm:
    name: Helm Chart
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['helm']
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Verify Helm chart synced inputs
        env:
          GOFLAGS: -mod=vendor
        run: make verify-helm

      - name: Setup Helm
        uses: ./.github/actions/setup-helm

      - name: Lint
        run: helm lint charts/openbao-operator --namespace openbao-operator-system

      - name: Template
        run: helm template openbao-operator charts/openbao-operator --namespace openbao-operator-system --include-crds > /dev/null

      - name: Test edge chart packaging
        run: make verify-edge-chart

      - name: Verify OpenShift templating (SCC-compatible)
        run: bash hack/ci/verify-openshift-helm.sh

  helm-e2e-smoke:
    name: Helm E2E Smoke (kind)
    runs-on: *runner
    timeout-minutes: 20
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['helm-e2e-smoke']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Docker Hub cache
        uses: ./.github/actions/setup-docker-mirror

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Setup Helm
        uses: ./.github/actions/setup-helm

      - name: Setup Kubernetes CLI tools
        uses: ./.github/actions/setup-kubernetes-tools
        with:
          install-dir: bin/

      - name: Run Helm E2E smoke
        env:
          GOFLAGS: -mod=vendor
        run: make helm-e2e-smoke

  build-artifacts:
    name: Build Artifacts
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['build-artifacts']
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Build Linux Binaries
        env:
          GOFLAGS: -mod=vendor
        run: make build-linux

      - name: Upload Binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-binaries
          path: bin/linux_amd64/
          retention-days: 1

  build-e2e-images:
    name: Build E2E Images Once
    runs-on: *runner
    needs: [changes, build-artifacts]
    if: fromJSON(needs.changes.outputs.expected_checks)['build-e2e-images'] && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      BUILD_SEAL_FIXTURES: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.changes.outputs.manual_full_e2e == 'true' || needs.changes.outputs.manual_seal_e2e == 'true' || needs.changes.outputs.e2e_seal == 'true' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full-e2e')) }}
    permissions:
      contents: read
      packages: write
    outputs:
      manager_ref: ${{ steps.refs.outputs.manager_ref }}
      config_init_ref: ${{ steps.refs.outputs.config_init_ref }}
      backup_executor_ref: ${{ steps.refs.outputs.backup_executor_ref }}
      upgrade_executor_ref: ${{ steps.refs.outputs.upgrade_executor_ref }}
      openbao_softhsm_ref: ${{ steps.refs.outputs.openbao_softhsm_ref }}
      pykmip_server_ref: ${{ steps.refs.outputs.pykmip_server_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Docker Hub cache
        uses: ./.github/actions/setup-docker-mirror

      - name: Download Binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: operator-binaries
          path: bin/linux_amd64

      - name: Prepare Binaries
        run: chmod +x bin/linux_amd64/*

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.31.1
          buildkitd-config: .github/actions/setup-docker-mirror/buildkitd.toml

      - name: Compute E2E image tag
        id: tag
        run: |
          set -euo pipefail
          echo "value=e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Compute E2E image repositories
        id: image-repos
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            prefix="ci-e2e"
          else
            prefix="pr-e2e"
          fi

          {
            echo "manager_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER}/${prefix}-openbao-operator"
            echo "config_init_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER}/${prefix}-openbao-init"
            echo "backup_executor_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER}/${prefix}-openbao-backup"
            echo "upgrade_executor_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER}/${prefix}-openbao-upgrade"
            echo "openbao_softhsm_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER}/${prefix}-openbao-softhsm"
            echo "pykmip_server_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER}/${prefix}-pykmip-server"
          } >> "${GITHUB_OUTPUT}"

      - name: Build operator image
        id: build-manager
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.manager
          build-args: |
            BINARY=bin/linux_amd64/manager
            TARGET=/manager
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image-repos.outputs.manager_repo }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ github.event_name == 'push' && 'main-e2e' || 'pr-e2e' }}-openbao-operator
          cache-to: type=gha,mode=max,scope=${{ github.event_name == 'push' && 'main-e2e' || 'pr-e2e' }}-openbao-operator

      - name: Build init image
        id: build-init
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.init
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image-repos.outputs.config_init_repo }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ github.event_name == 'push' && 'main-e2e' || 'pr-e2e' }}-openbao-init
          cache-to: type=gha,mode=max,scope=${{ github.event_name == 'push' && 'main-e2e' || 'pr-e2e' }}-openbao-init

      - name: Build backup image
        id: build-backup
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.backup
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image-repos.outputs.backup_executor_repo }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ github.event_name == 'push' && 'main-e2e' || 'pr-e2e' }}-openbao-backup
          cache-to: type=gha,mode=max,scope=${{ github.event_name == 'push' && 'main-e2e' || 'pr-e2e' }}-openbao-backup

      - name: Build upgrade image
        id: build-upgrade
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.upgrade
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image-repos.outputs.upgrade_executor_repo }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ github.event_name == 'push' && 'main-e2e' || 'pr-e2e' }}-openbao-upgrade
          cache-to: type=gha,mode=max,scope=${{ github.event_name == 'push' && 'main-e2e' || 'pr-e2e' }}-openbao-upgrade

      - name: Build SoftHSM-enabled OpenBao fixture image
        if: env.BUILD_SEAL_FIXTURES == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: test/e2e/images/openbao-softhsm
          file: test/e2e/images/openbao-softhsm/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image-repos.outputs.openbao_softhsm_repo }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ github.event_name == 'push' && 'main-e2e' || 'pr-e2e' }}-openbao-softhsm
          cache-to: type=gha,mode=max,scope=${{ github.event_name == 'push' && 'main-e2e' || 'pr-e2e' }}-openbao-softhsm

      - name: Build PyKMIP fixture image
        if: env.BUILD_SEAL_FIXTURES == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: test/e2e/images/pykmip-server
          file: test/e2e/images/pykmip-server/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image-repos.outputs.pykmip_server_repo }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=${{ github.event_name == 'push' && 'main-e2e' || 'pr-e2e' }}-pykmip-server
          cache-to: type=gha,mode=max,scope=${{ github.event_name == 'push' && 'main-e2e' || 'pr-e2e' }}-pykmip-server

      - name: Publish image refs
        id: refs
        run: |
          set -euo pipefail
          {
            echo "manager_ref=${{ steps.image-repos.outputs.manager_repo }}:${{ steps.tag.outputs.value }}"
            echo "config_init_ref=${{ steps.image-repos.outputs.config_init_repo }}:${{ steps.tag.outputs.value }}"
            echo "backup_executor_ref=${{ steps.image-repos.outputs.backup_executor_repo }}:${{ steps.tag.outputs.value }}"
            echo "upgrade_executor_ref=${{ steps.image-repos.outputs.upgrade_executor_repo }}:${{ steps.tag.outputs.value }}"
            if [[ "${BUILD_SEAL_FIXTURES}" == "true" ]]; then
              echo "openbao_softhsm_ref=${{ steps.image-repos.outputs.openbao_softhsm_repo }}:${{ steps.tag.outputs.value }}"
              echo "pykmip_server_ref=${{ steps.image-repos.outputs.pykmip_server_repo }}:${{ steps.tag.outputs.value }}"
            fi
          } >> "${GITHUB_OUTPUT}"

  build-e2e-image-artifacts:
    name: Build Fork E2E Image Artifacts
    runs-on: *runner
    needs: [changes, build-artifacts]
    if: fromJSON(needs.changes.outputs.expected_checks)['build-e2e-image-artifacts'] && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    env:
      BUILD_SEAL_FIXTURES: ${{ needs.changes.outputs.e2e_seal == 'true' || contains(github.event.pull_request.labels.*.name, 'ci:full-e2e') }}
    outputs:
      manager_ref: ${{ steps.build.outputs.manager_ref }}
      config_init_ref: ${{ steps.build.outputs.config_init_ref }}
      backup_executor_ref: ${{ steps.build.outputs.backup_executor_ref }}
      upgrade_executor_ref: ${{ steps.build.outputs.upgrade_executor_ref }}
      openbao_softhsm_ref: ${{ steps.build.outputs.openbao_softhsm_ref }}
      pykmip_server_ref: ${{ steps.build.outputs.pykmip_server_ref }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
      build_attempt: ${{ steps.build.outputs.build_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Docker Hub cache
        uses: ./.github/actions/setup-docker-mirror

      - name: Download Binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: operator-binaries
          path: bin/linux_amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.31.1
          buildkitd-config: .github/actions/setup-docker-mirror/buildkitd.toml

      - name: Build and verify image artifacts
        id: build
        run: |
          set -euo pipefail
          chmod +x bin/linux_amd64/*
          python3 hack/ci/e2e-images.py build "${RUNNER_TEMP}/e2e-image-artifacts" "${GITHUB_SHA}"

      - name: Upload fork E2E images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/e2e-image-artifacts/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  operator-upgrade-e2e:
    name: Operator Upgrade E2E
    runs-on: *runner
    needs: [changes, build-e2e-images]
    if: fromJSON(needs.changes.outputs.expected_checks)['operator-upgrade-e2e']
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Docker Hub cache
        uses: ./.github/actions/setup-docker-mirror

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Setup Helm 3 compatibility client
        id: helm3
        uses: ./.github/actions/setup-helm
        with:
          version-key: HELM3_COMPAT_VERSION

      - name: Setup Helm 4
        id: helm4
        uses: ./.github/actions/setup-helm

      - name: Setup Kubernetes CLI tools
        uses: ./.github/actions/setup-kubernetes-tools
        with:
          install-dir: bin/

      - name: Login to GHCR (pull)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade previous stable operator to CI candidate
        env:
          HELM: ${{ steps.helm4.outputs.helm-path }}
          HELM_INSTALL: ${{ steps.helm3.outputs.helm-path }}
          OPERATOR_UPGRADE_E2E_MANAGER_SOURCE: ${{ needs.build-e2e-images.outputs.manager_ref }}
          OPERATOR_UPGRADE_E2E_INIT_SOURCE: ${{ needs.build-e2e-images.outputs.config_init_ref }}
        run: make test-e2e-operator-upgrade

  fork-operator-upgrade-e2e:
    name: Fork Operator Upgrade E2E
    runs-on: *runner
    needs: [changes, build-e2e-image-artifacts]
    if: fromJSON(needs.changes.outputs.expected_checks)['fork-operator-upgrade-e2e']
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Docker Hub cache
        uses: ./.github/actions/setup-docker-mirror

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Setup Helm 3 compatibility client
        id: helm3
        uses: ./.github/actions/setup-helm
        with:
          version-key: HELM3_COMPAT_VERSION

      - name: Setup Helm 4
        id: helm4
        uses: ./.github/actions/setup-helm

      - name: Setup Kubernetes CLI tools
        uses: ./.github/actions/setup-kubernetes-tools
        with:
          install-dir: bin/

      - name: Load fork E2E images
        uses: ./.github/actions/load-e2e-image-artifacts
        with:
          artifact-name: ${{ needs.build-e2e-image-artifacts.outputs.artifact_name }}
          build-attempt: ${{ needs.build-e2e-image-artifacts.outputs.build_attempt }}

      - name: Upgrade previous stable operator to CI candidate
        env:
          OPERATOR_UPGRADE_E2E_IMAGE_TRANSPORT: artifact
          HELM: ${{ steps.helm4.outputs.helm-path }}
          HELM_INSTALL: ${{ steps.helm3.outputs.helm-path }}
          OPERATOR_UPGRADE_E2E_MANAGER_SOURCE: ${{ needs.build-e2e-image-artifacts.outputs.manager_ref }}
          OPERATOR_UPGRADE_E2E_INIT_SOURCE: ${{ needs.build-e2e-image-artifacts.outputs.config_init_ref }}
        run: make test-e2e-operator-upgrade

  e2e-matrix:
    name: Plan E2E Matrix
    runs-on: *runner
    needs: changes
    if: fromJSON(needs.changes.outputs.expected_checks)['e2e-matrix']
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download CI routing plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-routing
          path: artifacts/ci-routing

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Verify E2E scenario catalog and ownership
        run: make verify-e2e-manifest

      - name: Generate E2E matrix
        id: plan
        env:
          GOFLAGS: -mod=vendor
        run: |
          set -euo pipefail
          matrix="$(go run ./hack/tools/e2e_plan \
            --manifest test/e2e/suites.yaml --format github-matrix \
            --ci-plan artifacts/ci-routing/expected-checks.json --sha "${GITHUB_SHA}")"
          mkdir -p artifacts/e2e-plan
          printf '%s\n' "${matrix}" > artifacts/e2e-plan/matrix.json
          printf 'matrix=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"
          {
            echo "## E2E Matrix"
            echo
            echo '```json'
            echo "${matrix}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload E2E execution plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-plan
          path: artifacts/e2e-plan/
          overwrite: true
          retention-days: 7

      - name: Compile E2E executables once
        env:
          GOFLAGS: -mod=vendor
          E2E_BINARY_DIR: ${{ runner.temp }}/e2e-binaries
          E2E_SOURCE_SHA: ${{ github.sha }}
        run: make build-e2e-binaries

      - name: Upload E2E binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-binaries
          path: ${{ runner.temp }}/e2e-binaries/
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  e2e:
    needs: [changes, e2e-matrix, build-e2e-images]
    if: fromJSON(needs.changes.outputs.expected_checks)['e2e']
    name: E2E (${{ matrix.name }})
    runs-on: *runner
    permissions:
      contents: read
      packages: read
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run planned E2E lane
        uses: ./.github/actions/run-e2e-lane
        with:
          lane: ${{ toJSON(matrix) }}
          manager-image: ${{ needs.build-e2e-images.outputs.manager_ref }}
          config-init-image: ${{ needs.build-e2e-images.outputs.config_init_ref }}
          backup-executor-image: ${{ needs.build-e2e-images.outputs.backup_executor_ref }}
          upgrade-executor-image: ${{ needs.build-e2e-images.outputs.upgrade_executor_ref }}
          openbao-image: ${{ matrix.id == 'hsm' && needs.build-e2e-images.outputs.openbao_softhsm_ref || matrix.openbao_image }}
          kmip-server-image: ${{ matrix.id == 'hsm' && needs.build-e2e-images.outputs.pykmip_server_ref || '' }}
          configure-docker-mirror: "true"
          report-dir: artifacts/e2e-reports/ci/${{ matrix.id }}
          artifact-name: e2e-artifacts-ci-${{ matrix.id }}-${{ github.run_attempt }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  fork-e2e:
    needs: [changes, e2e-matrix, build-e2e-image-artifacts]
    if: fromJSON(needs.changes.outputs.expected_checks)['fork-e2e']
    name: Fork E2E (${{ matrix.name }})
    runs-on: *runner
    permissions:
      contents: read
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run planned E2E lane
        uses: ./.github/actions/run-e2e-lane
        with:
          lane: ${{ toJSON(matrix) }}
          manager-image: ${{ needs.build-e2e-image-artifacts.outputs.manager_ref }}
          config-init-image: ${{ needs.build-e2e-image-artifacts.outputs.config_init_ref }}
          backup-executor-image: ${{ needs.build-e2e-image-artifacts.outputs.backup_executor_ref }}
          upgrade-executor-image: ${{ needs.build-e2e-image-artifacts.outputs.upgrade_executor_ref }}
          openbao-image: ${{ matrix.id == 'hsm' && needs.build-e2e-image-artifacts.outputs.openbao_softhsm_ref || matrix.openbao_image }}
          kmip-server-image: ${{ matrix.id == 'hsm' && needs.build-e2e-image-artifacts.outputs.pykmip_server_ref || '' }}
          configure-docker-mirror: "true"
          report-dir: artifacts/e2e-reports/ci/${{ matrix.id }}
          artifact-name: e2e-artifacts-ci-${{ matrix.id }}-${{ github.run_attempt }}
          image-transport: artifact
          image-artifact: ${{ needs.build-e2e-image-artifacts.outputs.artifact_name }}
          image-build-attempt: ${{ needs.build-e2e-image-artifacts.outputs.build_attempt }}

  ci-required:
    name: CI Required
    runs-on: *runner
    if: always()
    needs:
      - changes
      - security
      - security-image
      - dependency-licenses
      - workflow-lint
      - lint
      - verify-fmt
      - tidy-check
      - go-toolchain-sync
      - verify-vendor
      - verify-generated
      - api-contract
      - test-unit
      - test-integration
      - fuzz
      - openbao-config-compat
      - docs
      - helm
      - helm-e2e-smoke
      - build-artifacts
      - build-e2e-images
      - build-e2e-image-artifacts
      - operator-upgrade-e2e
      - fork-operator-upgrade-e2e
      - e2e-matrix
      - e2e
      - fork-e2e
    steps:
      - name: Require a successful routing record
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          test "${CHANGES_RESULT}" = success || {
            echo "Change detection and expectation planning must succeed." >&2
            exit 1
          }

      - name: Download routing record and CI tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-routing
          path: artifacts/ci-routing

      - name: Validate required CI graph
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "${NEEDS_JSON}" > artifacts/ci-routing/needs.json
          chmod +x artifacts/ci-routing/ci_checks
          artifacts/ci-routing/ci_checks check \
            --plan artifacts/ci-routing/expected-checks.json \
            --needs artifacts/ci-routing/needs.json --sha "${GITHUB_SHA}"

  prepare-edge-candidate:
    name: Prepare Edge Candidate
    runs-on: *runner
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      version: ${{ steps.vars.outputs.version }}
      chart_version: ${{ steps.vars.outputs.chart_version }}
      build_tag: ${{ steps.vars.outputs.build_tag }}
      repro_build_tag: ${{ steps.vars.outputs.repro_build_tag }}
      source_date_epoch: ${{ steps.vars.outputs.source_date_epoch }}
      manager_image: ${{ steps.vars.outputs.manager_image }}
      config_init_image: ${{ steps.vars.outputs.config_init_image }}
      backup_executor_image: ${{ steps.vars.outputs.backup_executor_image }}
      upgrade_executor_image: ${{ steps.vars.outputs.upgrade_executor_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compute edge variables
        id: vars
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          build_tag="edge-build-${sha}"
          repro_build_tag="edge-repro-${sha}"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          version="edge-${short_sha}"

          chart_file="charts/openbao-operator/Chart.yaml"
          chart_version="$(sed -nE 's/^version:[[:space:]]*"?([^"#[:space:]]+)"?[[:space:]]*(#.*)?$/\1/p' "${chart_file}" | head -n1)"
          if [[ -z "${chart_version}" ]]; then
            echo "failed to parse chart version from ${chart_file}" >&2
            exit 1
          fi

          chart_base="${chart_version%%[-+]*}"
          chart_version="${chart_base}-edge.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.g${short_sha}"

          owner="${GITHUB_REPOSITORY_OWNER}"
          {
            echo "sha=${sha}"
            echo "short_sha=${short_sha}"
            echo "version=${version}"
            echo "chart_version=${chart_version}"
            echo "build_tag=${build_tag}"
            echo "repro_build_tag=${repro_build_tag}"
            echo "source_date_epoch=${source_date_epoch}"
            echo "manager_image=ghcr.io/${owner}/openbao-operator"
            echo "config_init_image=ghcr.io/${owner}/openbao-init"
            echo "backup_executor_image=ghcr.io/${owner}/openbao-backup"
            echo "upgrade_executor_image=ghcr.io/${owner}/openbao-upgrade"
          } >> "${GITHUB_OUTPUT}"

  build-edge-candidate:
    name: Build + Verify Edge Candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - prepare-edge-candidate
      - security
      - workflow-lint
      - lint
      - verify-fmt
      - tidy-check
      - go-toolchain-sync
      - verify-vendor
      - verify-generated
      - api-contract
      - test-unit
      - test-integration
      - openbao-config-compat
      - docs
      - helm
      - e2e
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-channel-hardening.yml
    with:
      source_ref: refs/heads/main
      version: ${{ needs.prepare-edge-candidate.outputs.version }}
      chart_version: ${{ needs.prepare-edge-candidate.outputs.chart_version }}
      build_tag: ${{ needs.prepare-edge-candidate.outputs.build_tag }}
      repro_build_tag: ${{ needs.prepare-edge-candidate.outputs.repro_build_tag }}
      source_date_epoch: ${{ needs.prepare-edge-candidate.outputs.source_date_epoch }}
      manager_image: ${{ needs.prepare-edge-candidate.outputs.manager_image }}
      config_init_image: ${{ needs.prepare-edge-candidate.outputs.config_init_image }}
      backup_executor_image: ${{ needs.prepare-edge-candidate.outputs.backup_executor_image }}
      upgrade_executor_image: ${{ needs.prepare-edge-candidate.outputs.upgrade_executor_image }}
      byte_artifact_name: edge-byte-verified-assets

  assemble-edge-candidate-bundle:
    name: Assemble Edge Candidate Bundle
    runs-on: *runner
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare-edge-candidate, build-edge-candidate]
    permissions:
      contents: read
    steps:
      - name: Download byte-verified edge assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edge-byte-verified-assets
          path: dist/candidate

      - name: Write edge metadata
        env:
          SHA: ${{ needs.prepare-edge-candidate.outputs.sha }}
          SHORT_SHA: ${{ needs.prepare-edge-candidate.outputs.short_sha }}
          VERSION: ${{ needs.prepare-edge-candidate.outputs.version }}
          CHART_VERSION: ${{ needs.prepare-edge-candidate.outputs.chart_version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare-edge-candidate.outputs.source_date_epoch }}
          MANAGER_IMAGE: ${{ needs.prepare-edge-candidate.outputs.manager_image }}
          MANAGER_DIGEST: ${{ needs.build-edge-candidate.outputs.manager_digest }}
          CONFIG_INIT_IMAGE: ${{ needs.prepare-edge-candidate.outputs.config_init_image }}
          CONFIG_INIT_DIGEST: ${{ needs.build-edge-candidate.outputs.config_init_digest }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare-edge-candidate.outputs.backup_executor_image }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build-edge-candidate.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare-edge-candidate.outputs.upgrade_executor_image }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build-edge-candidate.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > dist/candidate/metadata.json
          import json
          import os

          data = {
              "channel": "edge",
              "source_ref": "refs/heads/main",
              "sha": os.environ["SHA"],
              "short_sha": os.environ["SHORT_SHA"],
              "version": os.environ["VERSION"],
              "chart_version": os.environ["CHART_VERSION"],
              "source_date_epoch": os.environ["SOURCE_DATE_EPOCH"],
              "build_run_id": os.environ["GITHUB_RUN_ID"],
              "build_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "artifacts": {
                  "install_yaml": "install.yaml",
                  "crds_yaml": "crds.yaml",
                  "checksums_txt": "checksums.txt",
              },
              "images": {
                  "manager": {"ref": os.environ["MANAGER_IMAGE"], "digest": os.environ["MANAGER_DIGEST"]},
                  "config_init": {"ref": os.environ["CONFIG_INIT_IMAGE"], "digest": os.environ["CONFIG_INIT_DIGEST"]},
                  "backup_executor": {"ref": os.environ["BACKUP_EXECUTOR_IMAGE"], "digest": os.environ["BACKUP_EXECUTOR_DIGEST"]},
                  "upgrade_executor": {"ref": os.environ["UPGRADE_EXECUTOR_IMAGE"], "digest": os.environ["UPGRADE_EXECUTOR_DIGEST"]},
              },
          }

          print(json.dumps(data, indent=2, sort_keys=True))
          PY

      - name: Validate edge candidate bundle contents
        env:
          CHART_VERSION: ${{ needs.prepare-edge-candidate.outputs.chart_version }}
        run: |
          set -euo pipefail
          for path in \
            dist/candidate/install.yaml \
            dist/candidate/crds.yaml \
            dist/candidate/checksums.txt \
            "dist/candidate/openbao-operator-${CHART_VERSION}.tgz" \
            dist/candidate/metadata.json; do
            test -f "${path}" || { echo "missing required edge candidate file: ${path}" >&2; exit 1; }
          done

      - name: Upload edge candidate bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edge-candidate-bundle
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 7

  ci-measurement:
    name: CI Measurement (advisory)
    runs-on: *runner
    if: always()
    needs: [ci-required, assemble-edge-candidate-bundle, devenv-contract]
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - name: Collect this attempt's run and job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci-measurements
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            > artifacts/ci-measurements/run.json
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            | jq '{jobs: [.[] | .jobs[]]}' > artifacts/ci-measurements/jobs.json

      - name: Download routing record and CI tools
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-routing
          path: artifacts/ci-routing

      - name: Download E2E reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-artifacts-*-${{ github.run_attempt }}
          path: artifacts/e2e-measurements

      - name: Summarize CI and specification timings
        run: |
          set -euo pipefail
          chmod +x artifacts/ci-routing/ci_report
          artifacts/ci-routing/ci_report \
            --run artifacts/ci-measurements/run.json --jobs artifacts/ci-measurements/jobs.json \
            --plan artifacts/ci-routing/expected-checks.json --e2e-dir artifacts/e2e-measurements \
            --json-out artifacts/ci-measurements/summary.json \
            --markdown-out artifacts/ci-measurements/summary.md
          cat artifacts/ci-measurements/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload CI measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-measurements-${{ github.run_attempt }}
          path: artifacts/ci-measurements/
          retention-days: 30
