name: GHCR Housekeeping

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Optional mode override: dry-run or enforce"
        required: false
        type: string
      max_delete_per_package:
        description: "Optional safety brake override for this run (>0)"
        required: false
        type: string
      max_delete_total:
        description: "Optional global deletion budget override for this run (>0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ghcr-housekeeping
  cancel-in-progress: false

jobs:
  build:
    name: Build GHCR housekeeping tool
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build tool and collect policy
        env:
          GOFLAGS: -mod=vendor
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p artifacts/ghcr-housekeeping
          go build -trimpath -o artifacts/ghcr-housekeeping/ghcr-housekeeping ./hack/tools/ghcr_housekeeping
          cp hack/tools/ghcr_housekeeping/policy.json artifacts/ghcr-housekeeping/policy.json

      - name: Upload housekeeping tool and policy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghcr-housekeeping-tool
          path: artifacts/ghcr-housekeeping/
          if-no-files-found: error
          overwrite: true

  housekeeping:
    name: Cleanup GHCR image package versions
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Download housekeeping tool and policy
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ghcr-housekeeping-tool
          path: artifacts/ghcr-housekeeping/

      - name: Resolve housekeeping configuration
        id: cfg
        env:
          MODE_INPUT: ${{ github.event.inputs.mode }}
          MODE_VAR: ${{ vars.GHCR_HOUSEKEEPING_MODE }}
          MAX_INPUT: ${{ github.event.inputs.max_delete_per_package }}
          MAX_VAR: ${{ vars.GHCR_HOUSEKEEPING_MAX_DELETE_PER_PACKAGE }}
          MAX_TOTAL_INPUT: ${{ github.event.inputs.max_delete_total }}
          MAX_TOTAL_VAR: ${{ vars.GHCR_HOUSEKEEPING_MAX_DELETE_TOTAL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          normalize() {
            local value="${1:-}"
            value="$(echo "${value}" | tr '[:upper:]' '[:lower:]' | xargs)"
            echo "${value}"
          }

          mode="$(normalize "${MODE_INPUT:-}")"
          if [[ -z "${mode}" ]]; then
            mode="$(normalize "${MODE_VAR:-}")"
          fi
          if [[ -z "${mode}" ]]; then
            mode="dry-run"
          fi
          case "${mode}" in
            dry-run|enforce) ;;
            *)
              echo "invalid mode '${mode}'. expected dry-run or enforce." >&2
              exit 1
              ;;
          esac

          max_delete="100"
          if [[ -n "${MAX_INPUT:-}" ]]; then
            if ! [[ "${MAX_INPUT}" =~ ^[0-9]+$ ]] || [[ "${MAX_INPUT}" -le 0 ]]; then
              echo "max_delete_per_package must be a positive integer; got '${MAX_INPUT}'" >&2
              exit 1
            fi
            max_delete="${MAX_INPUT}"
          elif [[ -n "${MAX_VAR:-}" ]]; then
            if ! [[ "${MAX_VAR}" =~ ^[0-9]+$ ]] || [[ "${MAX_VAR}" -le 0 ]]; then
              echo "GHCR_HOUSEKEEPING_MAX_DELETE_PER_PACKAGE must be a positive integer; got '${MAX_VAR}'" >&2
              exit 1
            fi
            max_delete="${MAX_VAR}"
          fi

          max_delete_total="100"
          if [[ -n "${MAX_TOTAL_INPUT:-}" ]]; then
            if ! [[ "${MAX_TOTAL_INPUT}" =~ ^[0-9]+$ ]] || [[ "${MAX_TOTAL_INPUT}" -le 0 ]]; then
              echo "max_delete_total must be a positive integer; got '${MAX_TOTAL_INPUT}'" >&2
              exit 1
            fi
            max_delete_total="${MAX_TOTAL_INPUT}"
          elif [[ -n "${MAX_TOTAL_VAR:-}" ]]; then
            if ! [[ "${MAX_TOTAL_VAR}" =~ ^[0-9]+$ ]] || [[ "${MAX_TOTAL_VAR}" -le 0 ]]; then
              echo "GHCR_HOUSEKEEPING_MAX_DELETE_TOTAL must be a positive integer; got '${MAX_TOTAL_VAR}'" >&2
              exit 1
            fi
            max_delete_total="${MAX_TOTAL_VAR}"
          fi

          {
            echo "mode=${mode}"
            echo "max_delete_per_package=${max_delete}"
            echo "max_delete_total=${max_delete_total}"
          } >> "${GITHUB_OUTPUT}"

          owner="${GITHUB_REPOSITORY_OWNER}"
          owner_kind="user"
          if owner_type="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/users/${owner}" | jq -r '.type // empty')"; then
            case "${owner_type}" in
              Organization) owner_kind="org" ;;
              User) owner_kind="user" ;;
              *)
                echo "::warning::Unable to classify owner type '${owner_type}', defaulting owner-kind=user"
                ;;
            esac
          else
            echo "::warning::Owner type lookup failed, defaulting owner-kind=user"
          fi

          echo "owner=${owner}" >> "${GITHUB_OUTPUT}"
          echo "owner_kind=${owner_kind}" >> "${GITHUB_OUTPUT}"

      - name: Run GHCR housekeeping tool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          chmod 0755 artifacts/ghcr-housekeeping/ghcr-housekeeping
          artifacts/ghcr-housekeeping/ghcr-housekeeping \
            --owner "${{ steps.cfg.outputs.owner }}" \
            --owner-kind "${{ steps.cfg.outputs.owner_kind }}" \
            --registry-user "${GITHUB_ACTOR}" \
            --mode "${{ steps.cfg.outputs.mode }}" \
            --policy-file artifacts/ghcr-housekeeping/policy.json \
            --max-delete-per-package "${{ steps.cfg.outputs.max_delete_per_package }}" \
            --max-delete-total "${{ steps.cfg.outputs.max_delete_total }}" \
            --report-json dist/housekeeping-report.json

      - name: Upload housekeeping report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghcr-housekeeping-report
          path: dist/housekeeping-report.json
          if-no-files-found: warn
          retention-days: 14
