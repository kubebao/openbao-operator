name: Nightly

on:
  schedule:
    - cron: "17 2 * * 1-6"
    - cron: "37 2 * * 0"
  workflow_dispatch:
    inputs:
      e2e_profile:
        description: E2E profile to run.
        required: false
        default: daily
        type: choice
        options:
          - daily
          - weekly-full
          - release-gate
      e2e_lane:
        description: Optional E2E lane filter for manual dispatch.
        required: false
        default: all
        type: choice
        options:
          - all
          - core
          - security
          - backup-restore
          - restore-tests
          - upgrade-rolling
          - upgrade-bluegreen-core
          - upgrade-bluegreen-verification
          - upgrade-bluegreen-recovery
          - upgrade-gateway
          - hardened
      e2e_kubernetes:
        description: Optional Kubernetes version filter for manual dispatch.
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security (vulncheck + Semgrep + Trivy FS)
    runs-on: &runner ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Run vulncheck
        env:
          GOFLAGS: -mod=vendor
        run: make vulncheck

      - name: Run Semgrep
        run: make semgrep-ci

      - name: Install Trivy (safe pinned release)
        uses: ./.github/actions/setup-trivy

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          skip-files: config/rbac/provisioner_minimal_role.yaml,charts/openbao-operator/templates/rbac/provisioner-clusterroles.yaml,config/rbac/single_tenant_clusterrole.yaml,config/overlays/single-tenant/single_tenant_clusterrole.yaml,config/overlays/single-tenant-custom-identity/single_tenant_clusterrole.yaml,dist/install.yaml
          skip-dirs: test/manifests,vendor,bin
          trivy-config: .trivy.yaml

  openbao-config-compat:
    name: OpenBao Config Compatibility
    runs-on: *runner
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Run OpenBao config compatibility
        uses: ./.github/actions/run-openbao-config-compat
        with:
          report-schema-drift: "true"

  fuzz:
    name: Fuzz Nightly
    runs-on: *runner
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=vendor
      FUZZ_ARTIFACT_DIR: dist/fuzz
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Run extended fuzz sweep
        run: make fuzz-long

      - name: Upload fuzz artifacts (failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-nightly-artifacts
          path: |
            dist/fuzz/
            **/testdata/fuzz/**/*
          if-no-files-found: ignore
          retention-days: 7

  build-artifacts:
    name: Build Artifacts
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Build Linux Binaries
        env:
          GOFLAGS: -mod=vendor
        run: make build-linux

      - name: Upload Binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-binaries
          path: bin/linux_amd64/
          retention-days: 1

  build-e2e-images:
    name: Build E2E Images Once
    runs-on: *runner
    needs: build-artifacts
    permissions:
      contents: read
      packages: write
    outputs:
      manager_ref: ${{ steps.refs.outputs.manager_ref }}
      config_init_ref: ${{ steps.refs.outputs.config_init_ref }}
      backup_executor_ref: ${{ steps.refs.outputs.backup_executor_ref }}
      upgrade_executor_ref: ${{ steps.refs.outputs.upgrade_executor_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: operator-binaries
          path: bin/linux_amd64

      - name: Prepare Binaries
        run: chmod +x bin/linux_amd64/*

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.31.1

      - name: Compute E2E image tag
        id: tag
        run: |
          set -euo pipefail
          echo "value=nightly-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Compute E2E image repositories
        id: image-repos
        run: |
          set -euo pipefail
          {
            echo "manager_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER}/nightly-e2e-openbao-operator"
            echo "config_init_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER}/nightly-e2e-openbao-init"
            echo "backup_executor_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER}/nightly-e2e-openbao-backup"
            echo "upgrade_executor_repo=ghcr.io/${GITHUB_REPOSITORY_OWNER}/nightly-e2e-openbao-upgrade"
          } >> "${GITHUB_OUTPUT}"

      - name: Build operator image
        id: build-manager
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.manager
          build-args: |
            BINARY=bin/linux_amd64/manager
            TARGET=/manager
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image-repos.outputs.manager_repo }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=nightly-e2e-openbao-operator
          cache-to: type=gha,mode=max,scope=nightly-e2e-openbao-operator

      - name: Build init image
        id: build-init
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.init
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image-repos.outputs.config_init_repo }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=nightly-e2e-openbao-init
          cache-to: type=gha,mode=max,scope=nightly-e2e-openbao-init

      - name: Build backup image
        id: build-backup
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.backup
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image-repos.outputs.backup_executor_repo }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=nightly-e2e-openbao-backup
          cache-to: type=gha,mode=max,scope=nightly-e2e-openbao-backup

      - name: Build upgrade image
        id: build-upgrade
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: hack/ci/Dockerfile.fast.upgrade
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image-repos.outputs.upgrade_executor_repo }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=nightly-e2e-openbao-upgrade
          cache-to: type=gha,mode=max,scope=nightly-e2e-openbao-upgrade

      - name: Publish image refs
        id: refs
        run: |
          set -euo pipefail
          {
            echo "manager_ref=${{ steps.image-repos.outputs.manager_repo }}:${{ steps.tag.outputs.value }}"
            echo "config_init_ref=${{ steps.image-repos.outputs.config_init_repo }}:${{ steps.tag.outputs.value }}"
            echo "backup_executor_ref=${{ steps.image-repos.outputs.backup_executor_repo }}:${{ steps.tag.outputs.value }}"
            echo "upgrade_executor_ref=${{ steps.image-repos.outputs.upgrade_executor_repo }}:${{ steps.tag.outputs.value }}"
          } >> "${GITHUB_OUTPUT}"

  e2e-matrix:
    name: Plan E2E Matrix
    runs-on: *runner
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      profile: ${{ steps.profile.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine E2E profile
        id: profile
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          REQUESTED_PROFILE: ${{ inputs.e2e_profile || 'daily' }}
        run: |
          set -euo pipefail
          profile="${REQUESTED_PROFILE}"
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            case "${EVENT_SCHEDULE}" in
              "37 2 * * 0")
                profile="weekly-full"
                ;;
              *)
                profile="daily"
                ;;
            esac
          fi
          week_number="$(date -u +%V)"
          compatibility_rotation_index="$((10#${week_number}))"
          echo "value=${profile}" >> "${GITHUB_OUTPUT}"
          echo "compatibility_rotation_index=${compatibility_rotation_index}" >> "${GITHUB_OUTPUT}"
          echo "::notice::Nightly E2E profile: ${profile}"
          echo "::notice::Compatibility rotation index: ${compatibility_rotation_index} (ISO week ${week_number})"

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Generate E2E matrix
        id: plan
        env:
          GOFLAGS: -mod=vendor
          E2E_PROFILE: ${{ steps.profile.outputs.value }}
          E2E_LANE: ${{ inputs.e2e_lane || 'all' }}
          E2E_KUBERNETES: ${{ inputs.e2e_kubernetes || 'all' }}
          E2E_COMPATIBILITY_ROTATION_INDEX: ${{ steps.profile.outputs.compatibility_rotation_index }}
        run: |
          set -euo pipefail
          args=(
            --manifest test/e2e/suites.yaml
            --format github-nightly-matrix
            --profile "${E2E_PROFILE}"
            --compatibility-rotation-index "${E2E_COMPATIBILITY_ROTATION_INDEX}"
          )
          if [[ "${E2E_LANE}" != "all" ]]; then
            args+=(--lane "${E2E_LANE}")
          fi
          if [[ "${E2E_KUBERNETES}" != "all" ]]; then
            args+=(--kubernetes "${E2E_KUBERNETES}")
          fi
          matrix="$(go run ./hack/tools/e2e_plan "${args[@]}")"
          printf 'matrix=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Nightly E2E Matrix"
            echo
            echo "Profile: \`${E2E_PROFILE}\`"
            echo "Lane filter: \`${E2E_LANE}\`"
            echo "Kubernetes filter: \`${E2E_KUBERNETES}\`"
            echo "Compatibility rotation index: \`${E2E_COMPATIBILITY_ROTATION_INDEX}\`"
            echo
            echo '```json'
            echo "${matrix}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  e2e:
    name: E2E (${{ matrix.name }}, kind ${{ matrix.k8s }})
    runs-on: *runner
    needs: [e2e-matrix, build-artifacts, build-e2e-images]
    permissions:
      contents: read
      packages: read
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-matrix.outputs.matrix) }}
    env:
      KIND_NODE_IMAGE: ${{ matrix.kind_node_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Setup Kubernetes CLI tools
        uses: ./.github/actions/setup-kubernetes-tools
        with:
          install-dir: bin/

      - name: Login to GHCR (pull)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare E2E lane
        id: prepare-e2e-lane
        uses: ./.github/actions/prepare-e2e-lane
        with:
          kind-node-image: ${{ matrix.kind_node_image }}
          kind-cluster: kind
          manager-image: ${{ needs.build-e2e-images.outputs.manager_ref }}
          config-init-image: ${{ needs.build-e2e-images.outputs.config_init_ref }}
          backup-executor-image: ${{ needs.build-e2e-images.outputs.backup_executor_ref }}
          upgrade-executor-image: ${{ needs.build-e2e-images.outputs.upgrade_executor_ref }}
          hardened-upgrade-executor-image: ${{ matrix.hardened_upgrade_executor_image }}
          load-backup-executor-image: ${{ matrix.load_backup_executor_image }}
          load-upgrade-executor-image: ${{ matrix.load_upgrade_executor_image }}
          preload-storage-emulators: ${{ matrix.preload_storage_emulators }}
          preload-rustfs-image: ${{ matrix.preload_rustfs_image }}
          preload-fake-gcs-image: ${{ matrix.preload_fake_gcs_image }}
          preload-azurite-image: ${{ matrix.preload_azurite_image }}
          rustfs-image: ${{ matrix.rustfs_image }}
          fake-gcs-image: ${{ matrix.fake_gcs_image }}
          azurite-image: ${{ matrix.azurite_image }}
          report-dir: artifacts/e2e-reports/${{ matrix.profile }}/kind-${{ matrix.k8s }}/${{ matrix.id }}-${{ matrix.coverage }}
          artifact-name: e2e-artifacts-${{ matrix.profile }}-kind-${{ matrix.k8s }}-${{ matrix.id }}-${{ matrix.coverage }}

      - name: Run full E2E
        env:
          GOFLAGS: -mod=vendor
          OPENBAO_REQUEUE_STANDARD: 10s
          KIND_CLUSTER: kind
          E2E_PARALLEL_NODES: ${{ matrix.parallel_nodes }}
          E2E_TIMEOUT: ${{ matrix.e2e_timeout }}
          E2E_FAIL_ON_EMPTY: "true"
          E2E_POLL_PROGRESS_AFTER: "10m"
          E2E_LABEL_FILTER: ${{ matrix.label_filter }}
          E2E_SKIP_IMAGE_BUILD: "true"
          E2E_INSTALL_CSI_HOSTPATH: ${{ matrix.install_csi_hostpath }}
          E2E_ENABLE_HARDENED_SIGNED_SUITE: ${{ matrix.hardened_signed }}
          E2E_OPERATOR_IMAGE: ${{ needs.build-e2e-images.outputs.manager_ref }}
          E2E_OPENBAO_IMAGE: ${{ matrix.openbao_image }}
          E2E_RUSTFS_IMAGE: ${{ steps.prepare-e2e-lane.outputs['rustfs-image'] }}
          E2E_FAKE_GCS_IMAGE: ${{ steps.prepare-e2e-lane.outputs['fake-gcs-image'] }}
          E2E_AZURITE_IMAGE: ${{ steps.prepare-e2e-lane.outputs['azurite-image'] }}
          E2E_CONFIG_INIT_IMAGE: ${{ needs.build-e2e-images.outputs.config_init_ref }}
          E2E_HARDENED_CONFIG_INIT_IMAGE: ${{ matrix.hardened_init_image }}
          E2E_HARDENED_UPGRADE_EXECUTOR_IMAGE: ${{ matrix.hardened_upgrade_executor_image }}
          E2E_BACKUP_EXECUTOR_IMAGE: ${{ needs.build-e2e-images.outputs.backup_executor_ref }}
          E2E_UPGRADE_EXECUTOR_IMAGE: ${{ matrix.hardened_upgrade_executor_image != '' && matrix.hardened_upgrade_executor_image || needs.build-e2e-images.outputs.upgrade_executor_ref }}
          E2E_LOAD_BACKUP_EXECUTOR_IMAGE: ${{ matrix.load_backup_executor_image }}
          E2E_LOAD_UPGRADE_EXECUTOR_IMAGE: ${{ matrix.load_upgrade_executor_image }}
          E2E_PRELOAD_UPGRADE_IMAGES: ${{ matrix.preload_upgrade_images }}
          E2E_PRELOAD_HARDENED_ASSETS: ${{ matrix.preload_hardened_assets }}
        run: make test-e2e-ci

      - name: Summarize E2E report
        if: always()
        env:
          E2E_LABEL_FILTER: ${{ matrix.label_filter }}
          GOFLAGS: -mod=vendor
          KIND_NODE_IMAGE: ${{ matrix.kind_node_image }}
        run: |
          set -euo pipefail
          if [[ -z "${E2E_JSON_REPORT:-}" ]] || [[ ! -s "${E2E_JSON_REPORT}" ]]; then
            {
              echo "## E2E Report Summary"
              echo
              echo "No Ginkgo JSON report was produced for ${{ matrix.name }} on kind ${{ matrix.k8s }}."
            } > "${E2E_SUMMARY_REPORT:-e2e-summary.md}"
          else
            report_status=0
            go run ./hack/tools/e2e_report \
              --json-report "${E2E_JSON_REPORT}" \
              --manifest test/e2e/suites.yaml \
              --fail-on-selected-skips \
              --markdown-out "${E2E_SUMMARY_REPORT}" \
              --json-out "${E2E_SUMMARY_JSON}" \
              --lane "${{ matrix.name }} (${{ matrix.profile }} / ${{ matrix.coverage }})" \
              --selector "${E2E_LABEL_FILTER}" \
              --kubernetes-version "${KIND_NODE_IMAGE}" \
              --openbao-version "${{ matrix.openbao_image }}" || report_status=$?
          fi
          cat "${E2E_SUMMARY_REPORT}" >> "${GITHUB_STEP_SUMMARY}"
          exit "${report_status:-0}"

      - name: Collect E2E artifacts (failure)
        if: failure()
        run: bash hack/ci/collect-e2e-artifacts.sh

      - name: Upload E2E artifacts
        if: always() && env.E2E_ARTIFACT_NAME != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.E2E_ARTIFACT_NAME }}
          path: artifacts/
          retention-days: 7

  operator-upgrade-e2e:
    name: Operator Upgrade E2E
    runs-on: *runner
    needs: build-e2e-images
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Setup Helm 3 compatibility client
        id: helm3
        uses: ./.github/actions/setup-helm
        with:
          version-key: HELM3_COMPAT_VERSION

      - name: Setup Helm 4
        id: helm4
        uses: ./.github/actions/setup-helm

      - name: Setup Kubernetes CLI tools
        uses: ./.github/actions/setup-kubernetes-tools
        with:
          install-dir: bin/

      - name: Login to GHCR (pull)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade previous stable operator to nightly candidate
        env:
          HELM: ${{ steps.helm4.outputs.helm-path }}
          HELM_INSTALL: ${{ steps.helm3.outputs.helm-path }}
          OPERATOR_UPGRADE_E2E_MANAGER_SOURCE: ${{ needs.build-e2e-images.outputs.manager_ref }}
          OPERATOR_UPGRADE_E2E_INIT_SOURCE: ${{ needs.build-e2e-images.outputs.config_init_ref }}
        run: make test-e2e-operator-upgrade

  docs:
    name: Docs Build
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build docs
        uses: ./.github/actions/docs-build

  helm:
    name: Helm Chart
    runs-on: *runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Verify Helm chart synced inputs
        env:
          GOFLAGS: -mod=vendor
        run: make verify-helm

      - name: Setup Helm
        uses: ./.github/actions/setup-helm

      - name: Lint
        run: helm lint charts/openbao-operator --namespace openbao-operator-system

      - name: Template
        run: helm template openbao-operator charts/openbao-operator --namespace openbao-operator-system --include-crds > /dev/null

  prepare-nightly-candidate:
    name: Prepare Nightly Candidate
    runs-on: *runner
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      date_utc: ${{ steps.vars.outputs.date_utc }}
      version: ${{ steps.vars.outputs.version }}
      chart_version: ${{ steps.vars.outputs.chart_version }}
      build_tag: ${{ steps.vars.outputs.build_tag }}
      repro_build_tag: ${{ steps.vars.outputs.repro_build_tag }}
      source_date_epoch: ${{ steps.vars.outputs.source_date_epoch }}
      manager_image: ${{ steps.vars.outputs.manager_image }}
      config_init_image: ${{ steps.vars.outputs.config_init_image }}
      backup_executor_image: ${{ steps.vars.outputs.backup_executor_image }}
      upgrade_executor_image: ${{ steps.vars.outputs.upgrade_executor_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute nightly variables
        id: vars
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          date_utc="$(date -u +%Y%m%d)"
          version="nightly-${date_utc}-${short_sha}"
          build_tag="nightly-build-${sha}"
          repro_build_tag="nightly-repro-${sha}"
          source_date_epoch="$(git show -s --format=%ct HEAD)"

          chart_file="charts/openbao-operator/Chart.yaml"
          chart_version="$(sed -nE 's/^version:[[:space:]]*"?([^"#[:space:]]+)"?[[:space:]]*(#.*)?$/\1/p' "${chart_file}" | head -n1)"
          if [[ -z "${chart_version}" ]]; then
            echo "failed to parse chart version from ${chart_file}" >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER}"
          {
            echo "sha=${sha}"
            echo "short_sha=${short_sha}"
            echo "date_utc=${date_utc}"
            echo "version=${version}"
            echo "chart_version=${chart_version}"
            echo "build_tag=${build_tag}"
            echo "repro_build_tag=${repro_build_tag}"
            echo "source_date_epoch=${source_date_epoch}"
            echo "manager_image=ghcr.io/${owner}/openbao-operator"
            echo "config_init_image=ghcr.io/${owner}/openbao-init"
            echo "backup_executor_image=ghcr.io/${owner}/openbao-backup"
            echo "upgrade_executor_image=ghcr.io/${owner}/openbao-upgrade"
          } >> "${GITHUB_OUTPUT}"

  build-nightly-candidate:
    name: Build + Verify Nightly Candidate
    needs:
      - prepare-nightly-candidate
      - security
      - openbao-config-compat
      - docs
      - helm
      - e2e
      - operator-upgrade-e2e
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-channel-hardening.yml
    with:
      ref: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      version: ${{ needs.prepare-nightly-candidate.outputs.version }}
      chart_version: ${{ needs.prepare-nightly-candidate.outputs.chart_version }}
      build_tag: ${{ needs.prepare-nightly-candidate.outputs.build_tag }}
      repro_build_tag: ${{ needs.prepare-nightly-candidate.outputs.repro_build_tag }}
      source_date_epoch: ${{ needs.prepare-nightly-candidate.outputs.source_date_epoch }}
      manager_image: ${{ needs.prepare-nightly-candidate.outputs.manager_image }}
      config_init_image: ${{ needs.prepare-nightly-candidate.outputs.config_init_image }}
      backup_executor_image: ${{ needs.prepare-nightly-candidate.outputs.backup_executor_image }}
      upgrade_executor_image: ${{ needs.prepare-nightly-candidate.outputs.upgrade_executor_image }}
      byte_artifact_name: nightly-byte-verified-assets

  assemble-nightly-candidate-bundle:
    name: Assemble Nightly Candidate Bundle
    runs-on: *runner
    needs: [prepare-nightly-candidate, build-nightly-candidate]
    permissions:
      contents: read
    steps:
      - name: Download byte-verified nightly assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-byte-verified-assets
          path: dist/candidate

      - name: Write nightly metadata
        env:
          SOURCE_REF: ${{ github.ref }}
          SHA: ${{ needs.prepare-nightly-candidate.outputs.sha }}
          SHORT_SHA: ${{ needs.prepare-nightly-candidate.outputs.short_sha }}
          DATE_UTC: ${{ needs.prepare-nightly-candidate.outputs.date_utc }}
          VERSION: ${{ needs.prepare-nightly-candidate.outputs.version }}
          CHART_VERSION: ${{ needs.prepare-nightly-candidate.outputs.chart_version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare-nightly-candidate.outputs.source_date_epoch }}
          MANAGER_IMAGE: ${{ needs.prepare-nightly-candidate.outputs.manager_image }}
          MANAGER_DIGEST: ${{ needs.build-nightly-candidate.outputs.manager_digest }}
          CONFIG_INIT_IMAGE: ${{ needs.prepare-nightly-candidate.outputs.config_init_image }}
          CONFIG_INIT_DIGEST: ${{ needs.build-nightly-candidate.outputs.config_init_digest }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare-nightly-candidate.outputs.backup_executor_image }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build-nightly-candidate.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare-nightly-candidate.outputs.upgrade_executor_image }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build-nightly-candidate.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > dist/candidate/metadata.json
          import json
          import os

          data = {
              "channel": "nightly",
              "source_ref": os.environ["SOURCE_REF"],
              "sha": os.environ["SHA"],
              "short_sha": os.environ["SHORT_SHA"],
              "date_utc": os.environ["DATE_UTC"],
              "version": os.environ["VERSION"],
              "chart_version": os.environ["CHART_VERSION"],
              "source_date_epoch": os.environ["SOURCE_DATE_EPOCH"],
              "build_run_id": os.environ["GITHUB_RUN_ID"],
              "build_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "artifacts": {
                  "install_yaml": "install.yaml",
                  "crds_yaml": "crds.yaml",
                  "checksums_txt": "checksums.txt",
              },
              "images": {
                  "manager": {"ref": os.environ["MANAGER_IMAGE"], "digest": os.environ["MANAGER_DIGEST"]},
                  "config_init": {"ref": os.environ["CONFIG_INIT_IMAGE"], "digest": os.environ["CONFIG_INIT_DIGEST"]},
                  "backup_executor": {"ref": os.environ["BACKUP_EXECUTOR_IMAGE"], "digest": os.environ["BACKUP_EXECUTOR_DIGEST"]},
                  "upgrade_executor": {"ref": os.environ["UPGRADE_EXECUTOR_IMAGE"], "digest": os.environ["UPGRADE_EXECUTOR_DIGEST"]},
              },
          }

          print(json.dumps(data, indent=2, sort_keys=True))
          PY

      - name: Validate nightly candidate bundle contents
        run: |
          set -euo pipefail
          for path in \
            dist/candidate/install.yaml \
            dist/candidate/crds.yaml \
            dist/candidate/checksums.txt \
            dist/candidate/metadata.json; do
            test -f "${path}" || { echo "missing required nightly candidate file: ${path}" >&2; exit 1; }
          done

      - name: Upload nightly candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-candidate-bundle
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 7
