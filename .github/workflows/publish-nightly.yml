name: Publish Nightly

on:
  workflow_run:
    workflows: ["Nightly"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-nightly
  cancel-in-progress: true

jobs:
  load-candidate:
    name: Load Nightly Candidate Bundle
    runs-on: &runner ubuntu-24.04
    if: >-
      ${{
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'schedule' &&
          github.event.workflow_run.head_branch == 'main' &&
          !github.event.workflow_run.repository.fork
        }}
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      date_utc: ${{ steps.meta.outputs.date_utc }}
      version: ${{ steps.meta.outputs.version }}
      chart_version: ${{ steps.meta.outputs.chart_version }}
      source_date_epoch: ${{ steps.meta.outputs.source_date_epoch }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      manager_image: ${{ steps.meta.outputs.manager_image }}
      manager_digest: ${{ steps.meta.outputs.manager_digest }}
      config_init_image: ${{ steps.meta.outputs.config_init_image }}
      config_init_digest: ${{ steps.meta.outputs.config_init_digest }}
      backup_executor_image: ${{ steps.meta.outputs.backup_executor_image }}
      backup_executor_digest: ${{ steps.meta.outputs.backup_executor_digest }}
      upgrade_executor_image: ${{ steps.meta.outputs.upgrade_executor_image }}
      upgrade_executor_digest: ${{ steps.meta.outputs.upgrade_executor_digest }}
    steps:
      - name: Download nightly candidate bundle from triggering run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p dist/upstream dist/candidate
          # Filter by name so unrelated artifacts cannot hide the bundle on a later API page.
          artifacts_json="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/artifacts?name=nightly-candidate-bundle")"
          ARTIFACTS_JSON="${artifacts_json}" ARTIFACT_NAME="nightly-candidate-bundle" python3 - <<'PY'
          import json
          import os
          import sys

          data = json.loads(os.environ["ARTIFACTS_JSON"])
          names = [artifact["name"] for artifact in data.get("artifacts", [])]
          wanted = os.environ["ARTIFACT_NAME"]
          if wanted in names:
              sys.exit(0)
          available = ", ".join(names) if names else "<none>"
          print(f"expected upstream artifact '{wanted}' not found; available artifacts: {available}", file=sys.stderr)
          sys.exit(1)
          PY
          gh run download "${RUN_ID}" -n nightly-candidate-bundle -D dist/upstream
          artifact_dir="$(dirname "$(find dist/upstream -type f -name metadata.json -print -quit)")"
          if [[ -z "${artifact_dir}" || ! -f "${artifact_dir}/metadata.json" ]]; then
            echo "nightly candidate bundle metadata.json not found in upstream artifact" >&2
            exit 1
          fi
          cp -a "${artifact_dir}/." dist/candidate/

      - name: Validate nightly candidate metadata
        env:
          EXPECTED_CHANNEL: nightly
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_SOURCE_REF: refs/heads/main
          EXPECTED_BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_MANAGER_IMAGE: ghcr.io/${{ github.repository_owner }}/openbao-operator
          EXPECTED_CONFIG_INIT_IMAGE: ghcr.io/${{ github.repository_owner }}/openbao-init
          EXPECTED_BACKUP_EXECUTOR_IMAGE: ghcr.io/${{ github.repository_owner }}/openbao-backup
          EXPECTED_UPGRADE_EXECUTOR_IMAGE: ghcr.io/${{ github.repository_owner }}/openbao-upgrade
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          data = json.loads(Path("dist/candidate/metadata.json").read_text(encoding="utf-8"))
          images = data.get("images", {})

          checks = [
              ("channel", data.get("channel"), os.environ["EXPECTED_CHANNEL"]),
              ("sha", data.get("sha"), os.environ["EXPECTED_SHA"]),
              ("source_ref", data.get("source_ref"), os.environ["EXPECTED_SOURCE_REF"]),
              ("build_run_id", str(data.get("build_run_id", "")), os.environ["EXPECTED_BUILD_RUN_ID"]),
              ("images.manager.ref", images.get("manager", {}).get("ref"), os.environ["EXPECTED_MANAGER_IMAGE"]),
              ("images.config_init.ref", images.get("config_init", {}).get("ref"), os.environ["EXPECTED_CONFIG_INIT_IMAGE"]),
              ("images.backup_executor.ref", images.get("backup_executor", {}).get("ref"), os.environ["EXPECTED_BACKUP_EXECUTOR_IMAGE"]),
              ("images.upgrade_executor.ref", images.get("upgrade_executor", {}).get("ref"), os.environ["EXPECTED_UPGRADE_EXECUTOR_IMAGE"]),
          ]

          errors = []
          for label, actual, expected in checks:
              if actual != expected:
                  errors.append(f"nightly candidate metadata mismatch for {label}: expected {expected!r}, got {actual!r}")

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Export metadata outputs
        id: meta
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          from pathlib import Path

          data = json.loads(Path("dist/candidate/metadata.json").read_text(encoding="utf-8"))
          images = data["images"]
          pairs = {
              "sha": data["sha"],
              "short_sha": data["short_sha"],
              "date_utc": data["date_utc"],
              "version": data["version"],
              "chart_version": data["chart_version"],
              "source_date_epoch": data["source_date_epoch"],
              "source_ref": data["source_ref"],
              "manager_image": images["manager"]["ref"],
              "manager_digest": images["manager"]["digest"],
              "config_init_image": images["config_init"]["ref"],
              "config_init_digest": images["config_init"]["digest"],
              "backup_executor_image": images["backup_executor"]["ref"],
              "backup_executor_digest": images["backup_executor"]["digest"],
              "upgrade_executor_image": images["upgrade_executor"]["ref"],
              "upgrade_executor_digest": images["upgrade_executor"]["digest"],
          }
          for key, value in pairs.items():
              print(f"{key}={value}")
          PY

      - name: Upload local nightly candidate bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-candidate-bundle
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 7

  promote:
    name: Promote Nightly Tags
    runs-on: *runner
    needs: load-candidate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.load-candidate.outputs.version }}
      DATE_TAG: nightly-${{ needs.load-candidate.outputs.date_utc }}
      SOURCE_REF: ${{ needs.load-candidate.outputs.source_ref }}
      MANAGER_IMAGE: ${{ needs.load-candidate.outputs.manager_image }}
      CONFIG_INIT_IMAGE: ${{ needs.load-candidate.outputs.config_init_image }}
      BACKUP_EXECUTOR_IMAGE: ${{ needs.load-candidate.outputs.backup_executor_image }}
      UPGRADE_EXECUTOR_IMAGE: ${{ needs.load-candidate.outputs.upgrade_executor_image }}
      MANAGER_DIGEST: ${{ needs.load-candidate.outputs.manager_digest }}
      CONFIG_INIT_DIGEST: ${{ needs.load-candidate.outputs.config_init_digest }}
      BACKUP_EXECUTOR_DIGEST: ${{ needs.load-candidate.outputs.backup_executor_digest }}
      UPGRADE_EXECUTOR_DIGEST: ${{ needs.load-candidate.outputs.upgrade_executor_digest }}
    steps:
      - name: Checkout trusted workflow helper sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .github-workflow-src
          fetch-depth: 1

      - name: Download nightly candidate bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-candidate-bundle
          path: dist

      - name: Verify upstream image attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash .github-workflow-src/hack/ci/verify-image-attestations.sh

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.31.1

      - name: Promote nightly tags (no rebuild)
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${MANAGER_IMAGE}:${VERSION}" "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          docker buildx imagetools create -t "${CONFIG_INIT_IMAGE}:${VERSION}" "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          docker buildx imagetools create -t "${BACKUP_EXECUTOR_IMAGE}:${VERSION}" "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          docker buildx imagetools create -t "${UPGRADE_EXECUTOR_IMAGE}:${VERSION}" "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

          docker buildx imagetools create -t "${MANAGER_IMAGE}:${DATE_TAG}" "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          docker buildx imagetools create -t "${CONFIG_INIT_IMAGE}:${DATE_TAG}" "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          docker buildx imagetools create -t "${BACKUP_EXECUTOR_IMAGE}:${DATE_TAG}" "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          docker buildx imagetools create -t "${UPGRADE_EXECUTOR_IMAGE}:${DATE_TAG}" "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

          docker buildx imagetools create -t "${MANAGER_IMAGE}:nightly" "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          docker buildx imagetools create -t "${CONFIG_INIT_IMAGE}:nightly" "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          docker buildx imagetools create -t "${BACKUP_EXECUTOR_IMAGE}:nightly" "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          docker buildx imagetools create -t "${UPGRADE_EXECUTOR_IMAGE}:nightly" "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.4

      - name: Sign images (keyless)
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=true "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

      - name: Verify signatures (keyless)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="https://github.com/${REPO}/.github/workflows/publish-nightly.yml@refs/heads/main"

          verify_signed() {
            local image_ref="$1"
            local attempts=5
            local delay=3
            local i

            for i in $(seq 1 "${attempts}"); do
              if cosign verify --new-bundle-format=true --certificate-identity "${identity}" --certificate-oidc-issuer "${issuer}" "${image_ref}" >/dev/null; then
                return 0
              fi
              if [[ "${i}" -eq "${attempts}" ]]; then
                return 1
              fi
              sleep "${delay}"
            done
          }

          verify_signed "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          verify_signed "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          verify_signed "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          verify_signed "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

      - name: Attest nightly checksums provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt

      - name: Sign nightly checksums (keyless, bundle format)
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --new-bundle-format=true \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt

      - name: Verify nightly checksums signature (bundle format)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --new-bundle-format=true \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/publish-nightly.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt >/dev/null

      - name: Verify nightly checksums attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.load-candidate.outputs.version }}
          SOURCE_REF: ${{ needs.load-candidate.outputs.source_ref }}
          OWNER: ${{ github.repository_owner }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-nightly.yml
          VERIFY_CHART: "false"
        run: bash .github-workflow-src/hack/ci/verify-release-artifact-attestations.sh

      - name: Setup Go (for provenance tooling)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github-workflow-src/go.mod
          check-latest: true
          cache: false

      - name: Generate nightly provenance index
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          CHANNEL: nightly
          VERSION: ${{ needs.load-candidate.outputs.version }}
          SHA: ${{ needs.load-candidate.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_REF: ${{ needs.load-candidate.outputs.source_ref }}
          SOURCE_DATE_EPOCH: ${{ needs.load-candidate.outputs.source_date_epoch }}
          CHECKSUMS_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/publish-nightly.yml
          MANAGER_IMAGE: ${{ needs.load-candidate.outputs.manager_image }}
          MANAGER_DIGEST: ${{ needs.load-candidate.outputs.manager_digest }}
          CONFIG_INIT_IMAGE: ${{ needs.load-candidate.outputs.config_init_image }}
          CONFIG_INIT_DIGEST: ${{ needs.load-candidate.outputs.config_init_digest }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.load-candidate.outputs.backup_executor_image }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.load-candidate.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.load-candidate.outputs.upgrade_executor_image }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.load-candidate.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail
          (
            cd .github-workflow-src
            INDEX_PATH=../dist/provenance-index.json \
            CHECKSUMS_PATH=../dist/checksums.txt \
            CHECKSUMS_BUNDLE_PATH=../dist/checksums.txt.bundle \
            INSTALL_PATH=../dist/install.yaml \
            CRDS_PATH=../dist/crds.yaml \
            bash hack/ci/generate-channel-provenance-index.sh
          )

      - name: Upload nightly publish artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-manifests
          path: |
            dist/install.yaml
            dist/crds.yaml
            dist/checksums.txt
            dist/checksums.txt.bundle
            dist/provenance-index.json
          if-no-files-found: error
          retention-days: 7

  publish-pages:
    name: Publish Nightly Manifests (GitHub Pages)
    runs-on: *runner
    needs: [load-candidate, promote]
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SHA: ${{ needs.load-candidate.outputs.sha }}
      VERSION: ${{ needs.load-candidate.outputs.version }}
      DATE_UTC: ${{ needs.load-candidate.outputs.date_utc }}
      MANAGER_IMAGE: ${{ needs.load-candidate.outputs.manager_image }}
      CONFIG_INIT_IMAGE: ${{ needs.load-candidate.outputs.config_init_image }}
      BACKUP_EXECUTOR_IMAGE: ${{ needs.load-candidate.outputs.backup_executor_image }}
      UPGRADE_EXECUTOR_IMAGE: ${{ needs.load-candidate.outputs.upgrade_executor_image }}
      MANAGER_DIGEST: ${{ needs.load-candidate.outputs.manager_digest }}
      CONFIG_INIT_DIGEST: ${{ needs.load-candidate.outputs.config_init_digest }}
      BACKUP_EXECUTOR_DIGEST: ${{ needs.load-candidate.outputs.backup_executor_digest }}
      UPGRADE_EXECUTOR_DIGEST: ${{ needs.load-candidate.outputs.upgrade_executor_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download manifests artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-manifests
          path: dist

      - name: Publish manifests to GitHub Pages (nightly/)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages --depth=1

          worktree="$(mktemp -d)"
          git worktree add -B gh-pages "${worktree}/gh-pages" origin/gh-pages

          dest="${worktree}/gh-pages/nightly"
          mkdir -p "${dest}"

          cp dist/install.yaml "${dest}/install.yaml"
          cp dist/crds.yaml "${dest}/crds.yaml"
          cp dist/checksums.txt "${dest}/checksums.txt"
          cp dist/checksums.txt.bundle "${dest}/checksums.txt.bundle"
          cp dist/provenance-index.json "${dest}/provenance-index.json"

          generated_at="$(date -u +%FT%TZ)"
          export GENERATED_AT="${generated_at}"
          python3 - <<'PY' > "${dest}/metadata.json"
          import json, os

          data = {
              "version": os.environ["VERSION"],
              "sha": os.environ["SHA"],
              "date_utc": os.environ["DATE_UTC"],
              "generated_at": os.environ.get("GENERATED_AT"),
              "artifacts": {
                  "install_yaml": "install.yaml",
                  "crds_yaml": "crds.yaml",
                  "checksums_txt": "checksums.txt",
                  "checksums_bundle": "checksums.txt.bundle",
                  "provenance_index": "provenance-index.json",
              },
              "images": {
                  "manager": {"ref": os.environ["MANAGER_IMAGE"], "digest": os.environ["MANAGER_DIGEST"]},
                  "config_init": {"ref": os.environ["CONFIG_INIT_IMAGE"], "digest": os.environ["CONFIG_INIT_DIGEST"]},
                  "backup_executor": {"ref": os.environ["BACKUP_EXECUTOR_IMAGE"], "digest": os.environ["BACKUP_EXECUTOR_DIGEST"]},
                  "upgrade_executor": {"ref": os.environ["UPGRADE_EXECUTOR_IMAGE"], "digest": os.environ["UPGRADE_EXECUTOR_DIGEST"]},
              },
          }

          print(json.dumps(data, indent=2, sort_keys=True))
          PY

          cat > "${dest}/index.html" <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>OpenBao Operator - Nightly</title>
              <style>
                body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; line-height: 1.5; }
                code { background: #f6f8fa; padding: 0.15rem 0.35rem; border-radius: 0.25rem; }
                ul { padding-left: 1.25rem; }
              </style>
            </head>
            <body>
              <h1>OpenBao Operator Nightly</h1>
              <p>This directory is updated on successful nightly builds.</p>
              <ul>
                <li><a href="install.yaml">install.yaml</a></li>
                <li><a href="crds.yaml">crds.yaml</a></li>
                <li><a href="checksums.txt">checksums.txt</a></li>
                <li><a href="checksums.txt.bundle">checksums.txt.bundle</a></li>
                <li><a href="provenance-index.json">provenance-index.json</a></li>
                <li><a href="metadata.json">metadata.json</a></li>
              </ul>
              <p>To install: <code>kubectl apply -f install.yaml</code></p>
            </body>
          </html>
          HTML

          pushd "${worktree}/gh-pages"
          git add nightly/install.yaml nightly/crds.yaml nightly/checksums.txt nightly/checksums.txt.bundle nightly/provenance-index.json nightly/metadata.json nightly/index.html

          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git commit -m "nightly: ${VERSION} (${SHA})"
          git push origin gh-pages
          popd
