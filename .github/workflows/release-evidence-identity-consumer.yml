name: Release Evidence Identity Consumer

on:
  workflow_dispatch:
    inputs:
      controller_sha:
        description: "Expected full SHA shared by the reviewed producer and consumer on main."
        required: true
        type: string
      producer_run:
        description: "Exact completed producer run ID."
        required: true
        type: string
      producer_attempt:
        description: "Exact successful producer attempt."
        required: true
        type: string
      producer_artifact:
        description: "Exact unexpired artifact ID from that producer attempt."
        required: true
        type: string

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: release-evidence-identity-consumer
  cancel-in-progress: false

jobs:
  consume:
    name: Authenticate Identity Probe
    if: >-
      github.repository == 'kubebao/openbao-operator' && github.ref == 'refs/heads/main' &&
      github.sha == github.workflow_sha && github.workflow_sha == inputs.controller_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Install the pinned GitHub CLI
        run: bash hack/ci/install-identity-pilot-gh.sh
      - name: Authenticate the producing execution and exercise rejection controls
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
          PRODUCER_RUN: ${{ inputs.producer_run }}
          PRODUCER_ATTEMPT: ${{ inputs.producer_attempt }}
          PRODUCER_ARTIFACT: ${{ inputs.producer_artifact }}
        run: >-
          python3 hack/ci/release-identity.py consume
          --controller "${CONTROLLER_SHA}" --run "${PRODUCER_RUN}"
          --attempt "${PRODUCER_ATTEMPT}" --artifact "${PRODUCER_ARTIFACT}"
          --output dist/identity-consumer
      - name: Retain verification and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-identity-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/identity-consumer/
          if-no-files-found: warn
          retention-days: 7
