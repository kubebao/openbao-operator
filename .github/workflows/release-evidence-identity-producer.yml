name: Release Evidence Identity Producer

on:
  workflow_dispatch:
    inputs:
      controller_sha:
        description: "Expected full SHA of the reviewed controller on main."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-evidence-identity-producer
  cancel-in-progress: false

jobs:
  produce:
    name: Sign Identity Probe
    if: >-
      github.repository == 'kubebao/openbao-operator' && github.ref == 'refs/heads/main' &&
      github.sha == github.workflow_sha && github.workflow_sha == inputs.controller_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # This trusted job signs only generated identity metadata, never candidate code or operator artifacts.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Install the pinned GitHub CLI
        run: bash hack/ci/install-identity-pilot-gh.sh
      - name: Generate the identity probe
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
        run: >-
          python3 hack/ci/release-identity.py produce
          --controller "${CONTROLLER_SHA}" --output dist/identity-producer
      - name: Attest the identity probe
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/identity-producer/probe.json
          push-to-registry: false
          create-storage-record: false
      - name: Retain the signed bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "${BUNDLE_PATH}" dist/identity-producer/bundle.json
      - name: Retain the identity probe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/identity-producer/
          if-no-files-found: error
          retention-days: 7
