name: Release Please PR

on:
  push:
    branches:
      - main
      - 'release-[0-9]*.[0-9]*'
      - '!release-please--branches--*'
  workflow_dispatch:
    inputs:
      release_as:
        description: "Optional semver override for the release PR. Prefer the Prepare Release-As PR workflow for audited overrides."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-please-pr-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release-please:
    name: Open/Update Release PR
    runs-on: ubuntu-24.04
    if: ${{ !github.event.repository.fork }}
    steps:
      - name: Checkout release tooling and release-only guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect release artifact-only push
        id: release-artifact-guard
        if: ${{ github.event_name == 'push' }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            echo "skip_release_please=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "skip_release_please=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "${BEFORE_SHA}" "${AFTER_SHA}")
          if (( ${#changed_files[@]} == 0 )); then
            echo "skip_release_please=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          for file in "${changed_files[@]}"; do
            case "${file}" in
              CHANGELOG.md|.release-please-manifest.json|charts/openbao-operator/Chart.yaml) ;;
              *)
                echo "skip_release_please=false" >> "${GITHUB_OUTPUT}"
                exit 0
                ;;
            esac
          done

          echo "Push only changed release artifacts; skipping release-please."
          echo "skip_release_please=true" >> "${GITHUB_OUTPUT}"

      - name: Resolve Release-As override
        id: release-as
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.ref_name }}
          DISPATCH_RELEASE_AS: ${{ inputs.release_as || '' }}
        run: |
          set -euo pipefail

          commit_subject=""
          commit_is_empty="false"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            commit_subject="$(git show -s --format=%s "${GITHUB_SHA}")"
            if git diff --quiet "${GITHUB_SHA}^" "${GITHUB_SHA}"; then
              commit_is_empty="true"
            fi
          fi

          COMMIT_SUBJECT="${commit_subject}" \
            COMMIT_IS_EMPTY="${commit_is_empty}" \
            bash hack/ci/resolve-release-as-override.sh

      - name: Setup Node for exact-version release request
        if: ${{ steps.release-artifact-guard.outputs.skip_release_please != 'true' && steps.release-as.outputs.release_as != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install pinned release-please CLI
        if: ${{ steps.release-artifact-guard.outputs.skip_release_please != 'true' && steps.release-as.outputs.release_as != '' }}
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix hack/ci/release-please

      - name: Mint GitHub App token (openbao-operator-release-pr)
        id: app-token
        if: ${{ steps.release-artifact-guard.outputs.skip_release_please != 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPENBAO_OPERATOR_RELEASE_PR_CLIENT_ID }}
          private-key: ${{ secrets.OPENBAO_OPERATOR_RELEASE_PR_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Run release-please action (normal manifest PR)
        id: release
        if: ${{ steps.release-artifact-guard.outputs.skip_release_please != 'true' && steps.release-as.outputs.release_as == '' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      # release-please-action v5 silently ignores release-as in manifest mode.
      # The pinned wrapper also permits an exact stable promotion when the latest
      # release candidate contains all user-facing commits.
      - name: Run release-please wrapper (exact-version manifest PR)
        if: ${{ steps.release-artifact-guard.outputs.skip_release_please != 'true' && steps.release-as.outputs.release_as != '' }}
        env:
          RELEASE_AS: ${{ steps.release-as.outputs.release_as }}
          RELEASE_PLEASE_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          token_file="${RUNNER_TEMP}/release-please-token"
          umask 077
          printf '%s' "${RELEASE_PLEASE_TOKEN}" > "${token_file}"

          RELEASE_PLEASE_TOKEN_FILE="${token_file}" \
            node hack/ci/run-release-please-exact.js

      - name: Locate open release PR
        id: release-pr
        if: ${{ steps.release-artifact-guard.outputs.skip_release_please != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_AS: ${{ steps.release-as.outputs.release_as }}
          RELEASE_PR_BRANCH: release-please--branches--${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_prs="$(
            gh pr list \
              --repo "${REPO}" \
              --state open \
              --base "${TARGET_BRANCH}" \
              --head "${RELEASE_PR_BRANCH}" \
              --limit 2 \
              --json number,title
          )"
          release_pr_count="$(jq 'length' <<<"${release_prs}")"
          if (( release_pr_count > 1 )); then
            echo "expected at most one open release PR, found ${release_pr_count}" >&2
            exit 1
          fi
          if (( release_pr_count == 0 )); then
            if [[ -n "${RELEASE_AS}" ]]; then
              echo "release-please did not create the requested '${RELEASE_AS}' release PR" >&2
              exit 1
            fi
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          release_pr_number="$(jq -r '.[0].number' <<<"${release_prs}")"
          release_pr_title="$(jq -r '.[0].title' <<<"${release_prs}")"
          if [[ -n "${RELEASE_AS}" ]]; then
            expected_title="chore(${TARGET_BRANCH}): release ${RELEASE_AS}"
            if [[ "${release_pr_title}" != "${expected_title}" ]]; then
              echo "exact-version release PR title is '${release_pr_title}', expected '${expected_title}'" >&2
              exit 1
            fi
          fi

          echo "exists=true" >> "${GITHUB_OUTPUT}"
          echo "number=${release_pr_number}" >> "${GITHUB_OUTPUT}"

      - name: Check out release PR synchronization workspace
        if: ${{ steps.release-pr.outputs.exists == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync Chart metadata and changelog on release PR branch
        if: ${{ steps.release-pr.outputs.exists == 'true' }}
        env:
          OWNER: ${{ github.repository_owner }}
          RELEASE_AS: ${{ steps.release-as.outputs.release_as }}
          RELEASE_PR_BRANCH: release-please--branches--${{ github.ref_name }}
        run: |
          set -euo pipefail

          if ! git ls-remote --exit-code --heads origin "${RELEASE_PR_BRANCH}" >/dev/null 2>&1; then
            echo "Release PR branch '${RELEASE_PR_BRANCH}' not found; skipping Chart metadata sync."
            exit 0
          fi

          git fetch origin "${RELEASE_PR_BRANCH}"
          git checkout -B "${RELEASE_PR_BRANCH}" "origin/${RELEASE_PR_BRANCH}"

          chart_version="$(sed -nE 's/^version:[[:space:]]*"?([^"#[:space:]]+)"?[[:space:]]*(#.*)?$/\1/p' charts/openbao-operator/Chart.yaml | head -n1)"
          if [[ -z "${chart_version}" ]]; then
            echo "failed to parse charts/openbao-operator/Chart.yaml version" >&2
            exit 1
          fi

          if [[ -n "${RELEASE_AS}" ]]; then
            manifest_version="$(jq -er '."."' .release-please-manifest.json)"
            chart_app_version="$(sed -nE 's/^appVersion:[[:space:]]*"?([^"#[:space:]]+)"?[[:space:]]*(#.*)?$/\1/p' charts/openbao-operator/Chart.yaml | head -n1)"

            if [[ "${manifest_version}" != "${RELEASE_AS}" || "${chart_version}" != "${RELEASE_AS}" || "${chart_app_version}" != "${RELEASE_AS}" ]]; then
              echo "exact-version release PR does not match requested version '${RELEASE_AS}'" >&2
              echo "  manifest:   ${manifest_version}" >&2
              echo "  chart:      ${chart_version}" >&2
              echo "  appVersion: ${chart_app_version}" >&2
              exit 1
            fi
          fi

          CHART_DIR="charts/openbao-operator" CHART_VERSION="${chart_version}" OWNER="${OWNER}" bash hack/ci/prepare-release-chart.sh

          if git diff --quiet -- charts/openbao-operator/Chart.yaml; then
            echo "Chart metadata already in sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/openbao-operator/Chart.yaml
          git commit -s -m "chore(release): sync chart metadata and changelog"
          git push origin "HEAD:${RELEASE_PR_BRANCH}"
