name: Release PR Gate

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: release-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate Release PR Merge
    runs-on: ubuntu-24.04
    if: ${{ !github.event.repository.fork }}
    steps:
      - name: Detect release PR
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Any PR that changes the release manifest triggers a release tag after merge.
          # This avoids relying on PR author identity (release-please may run under a PAT/GitHub App).
          # Renames count with both paths.
          files_path="${RUNNER_TEMP}/release-pr-files.txt"
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > "${files_path}"
          if ! grep -qx ".release-please-manifest.json" "${files_path}"; then
            echo "Not a release PR (.release-please-manifest.json unchanged); skipping gate."
            echo "release=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "release=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout trusted gate scripts
        if: steps.detect.outputs.release == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: hack/ci

      - name: Evaluate release PR gate
        if: steps.detect.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUIRED_LABEL: release:ready
          REQUIRED_APPROVER: dc-tec
        run: |
          set -euo pipefail

          # The release PR must not change the workflows, scripts, or tests that qualify it.
          bash hack/ci/check-release-pr-files.sh < "${RUNNER_TEMP}/release-pr-files.txt"

          labels="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --paginate --jq '.[].name')"
          if ! echo "${labels}" | grep -qx "${REQUIRED_LABEL}"; then
            echo "Missing required label '${REQUIRED_LABEL}' on release PR." >&2
            echo "Add it when the PR is ready to be merged." >&2
            exit 1
          fi

          # Require the designated release manager's latest review to approve the
          # current head commit. The manager cannot review their own PR; that
          # path requires their environment approval and the same qualification.
          pr_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          head_sha="$(jq -er '.head.sha' <<<"${pr_json}")"
          author="$(jq -er '.user.login' <<<"${pr_json}")"
          if [[ "${author}" != "${REQUIRED_APPROVER}" ]]; then
            reviews="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate --jq '.[]')"
            latest_review="$(
              jq -sc \
                --arg required_approver "${REQUIRED_APPROVER}" \
                '[.[] | select(.user.login == $required_approver)]
                 | sort_by(.submitted_at // "", .id // 0)
                 | last // {}' \
                <<<"${reviews}"
            )"
            review_state="$(jq -r '.state // ""' <<<"${latest_review}")"
            review_commit="$(jq -r '.commit_id // ""' <<<"${latest_review}")"
            if [[ "${review_state}" != "APPROVED" || "${review_commit}" != "${head_sha}" ]]; then
              echo "Missing current-head approval from '${REQUIRED_APPROVER}' on release PR." >&2
              echo "Expected APPROVED review for ${head_sha}; got state='${review_state}' commit='${review_commit}'." >&2
              exit 1
            fi
          fi

          # Require the full release profile to have passed for this exact head.
          if ! run_id="$(HEAD_SHA="${head_sha}" bash hack/ci/find-release-candidate-run.sh)"; then
            echo "Reapply '${REQUIRED_LABEL}' after the Release Candidate workflow passes to re-evaluate this gate." >&2
            exit 1
          fi
          echo "Qualified by Release Candidate run ${run_id}."

          echo "Release PR gate satisfied."
