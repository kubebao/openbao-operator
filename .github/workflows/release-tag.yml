name: Release Tag

on:
  push:
    branches:
      - main
      - 'release-[0-9]*.[0-9]*'
      - '!release-please--branches--*'
    paths:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'charts/openbao-operator/Chart.yaml'
  workflow_dispatch:
    inputs:
      operation:
        description: "Create the release, or remove an unpublished failed candidate."
        required: false
        default: create
        type: choice
        options:
          - create
          - remove-unpublished
      expected_tag_object_sha:
        description: "Exact annotated tag object SHA required for removal."
        required: false
        default: ""
        type: string
      expected_commit_sha:
        description: "Exact failed release commit SHA required for removal."
        required: false
        default: ""
        type: string
      failed_run_id:
        description: "Completed failed or cancelled Release run required for removal."
        required: false
        default: ""
        type: string
      tag_target:
        description: "Commit to tag. Use branch-head for an approved unpublished release retry."
        required: false
        default: release-pr-merge
        type: choice
        options:
          - release-pr-merge
          - branch-head

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: release-please-tag-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release-tag:
    name: Manage Release Tag And Draft Release
    runs-on: ubuntu-24.04
    if: ${{ !github.event.repository.fork }}
    steps:
      - name: Mint GitHub App token (openbao-operator-release-tag)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.OPENBAO_OPERATOR_RELEASE_TAG_CLIENT_ID }}
          private-key: ${{ secrets.OPENBAO_OPERATOR_RELEASE_TAG_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Import release tag signing key
        if: github.event_name != 'workflow_dispatch' || inputs.operation != 'remove-unpublished'
        env:
          OPENBAO_OPERATOR_RELEASE_TAG_GPG_PRIVATE_KEY: ${{ secrets.OPENBAO_OPERATOR_RELEASE_TAG_GPG_PRIVATE_KEY }}
          OPENBAO_OPERATOR_RELEASE_TAG_GPG_PASSPHRASE: ${{ secrets.OPENBAO_OPERATOR_RELEASE_TAG_GPG_PASSPHRASE }}
          OPENBAO_OPERATOR_RELEASE_TAG_GPG_NAME: ${{ secrets.OPENBAO_OPERATOR_RELEASE_TAG_GPG_NAME }}
          OPENBAO_OPERATOR_RELEASE_TAG_GPG_EMAIL: ${{ secrets.OPENBAO_OPERATOR_RELEASE_TAG_GPG_EMAIL }}
        run: |
          set -euo pipefail

          for var in \
            OPENBAO_OPERATOR_RELEASE_TAG_GPG_PRIVATE_KEY \
            OPENBAO_OPERATOR_RELEASE_TAG_GPG_PASSPHRASE \
            OPENBAO_OPERATOR_RELEASE_TAG_GPG_NAME \
            OPENBAO_OPERATOR_RELEASE_TAG_GPG_EMAIL
          do
            if [[ -z "${!var}" ]]; then
              echo "${var} is required for signed release tags" >&2
              exit 1
            fi
          done

          export GNUPGHOME="${RUNNER_TEMP}/release-tag-gnupg"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"

          printf '%s' "${OPENBAO_OPERATOR_RELEASE_TAG_GPG_PRIVATE_KEY}" | gpg --batch --import

          fingerprint="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10; exit}')"
          if [[ -z "${fingerprint}" ]]; then
            echo "failed to resolve imported GPG signing key fingerprint" >&2
            exit 1
          fi

          gpg_wrapper="${RUNNER_TEMP}/gpg-loopback.sh"
          printf '%s\n' \
            "#!/usr/bin/env bash" \
            "exec gpg --batch --yes --pinentry-mode loopback --passphrase \"\${OPENBAO_OPERATOR_RELEASE_TAG_GPG_PASSPHRASE}\" \"\$@\"" \
            > "${gpg_wrapper}"
          chmod 700 "${gpg_wrapper}"

          git config --global user.name "${OPENBAO_OPERATOR_RELEASE_TAG_GPG_NAME}"
          git config --global user.email "${OPENBAO_OPERATOR_RELEASE_TAG_GPG_EMAIL}"
          git config --global user.signingkey "${fingerprint}"
          git config --global gpg.program "${gpg_wrapper}"

          {
            echo "GNUPGHOME=${GNUPGHOME}"
            echo "RELEASE_TAG_SIGNING_FINGERPRINT=${fingerprint}"
          } >> "${GITHUB_ENV}"

      - name: Create tag and draft release
        if: github.event_name != 'workflow_dispatch' || inputs.operation != 'remove-unpublished'
        env:
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.ref_name }}
          TAG_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_target || 'release-pr-merge' }}
          GH_READ_TOKEN: ${{ github.token }}
          GH_WRITE_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENBAO_OPERATOR_RELEASE_TAG_GPG_PASSPHRASE: ${{ secrets.OPENBAO_OPERATOR_RELEASE_TAG_GPG_PASSPHRASE }}
        run: bash hack/ci/create-release-tag-and-draft.sh

      - name: Remove failed unpublished release
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'remove-unpublished'
        env:
          REPO: ${{ github.repository }}
          EXPECTED_TAG_OBJECT_SHA: ${{ inputs.expected_tag_object_sha }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          GH_READ_TOKEN: ${{ github.token }}
          GH_WRITE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -er '."."' .release-please-manifest.json)" bash hack/ci/remove-unpublished-release.sh
