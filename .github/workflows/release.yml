name: Release

# Publish a release qualified before merge. The Release Candidate workflow ran
# the full release profile on the merged PR head; this workflow rebuilds the
# tagged commit and publishes only the qualified image digests and payload bytes.
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: &runner ubuntu-24.04
    permissions:
      # Needed to read draft release metadata via `gh release view`.
      # `contents: read` cannot see draft releases and causes false 404 failures.
      contents: write
      actions: read
      pull-requests: read
    outputs:
      version: ${{ steps.vars.outputs.version }}
      chart_version: ${{ steps.vars.outputs.chart_version }}
      build_tag: ${{ steps.vars.outputs.build_tag }}
      source_date_epoch: ${{ steps.candidate.outputs.source_date_epoch }}
      pr_number: ${{ steps.candidate.outputs.pr_number }}
      candidate_run_id: ${{ steps.candidate.outputs.candidate_run_id }}
      manager_image: ${{ steps.vars.outputs.manager_image }}
      config_init_image: ${{ steps.vars.outputs.config_init_image }}
      backup_executor_image: ${{ steps.vars.outputs.backup_executor_image }}
      upgrade_executor_image: ${{ steps.vars.outputs.upgrade_executor_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Compute release variables
        id: vars
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_REF_NAME}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-+].*)?$ ]]; then
            echo "version must be a semver tag (e.g., 0.1.0 or 0.1.0-rc.1)" >&2
            exit 1
          fi

          sha="$(git rev-parse HEAD)"
          build_tag="build-${sha}"

          chart_file="charts/openbao-operator/Chart.yaml"
          chart_version="$(sed -nE 's/^version:[[:space:]]*"?([^"#[:space:]]+)"?[[:space:]]*(#.*)?$/\1/p' "${chart_file}" | head -n1)"
          chart_app_version="$(sed -nE 's/^appVersion:[[:space:]]*"?([^"#[:space:]]+)"?[[:space:]]*(#.*)?$/\1/p' "${chart_file}" | head -n1)"
          if [[ -z "${chart_version}" || -z "${chart_app_version}" ]]; then
            echo "failed to parse version/appVersion from ${chart_file}" >&2
            exit 1
          fi
          if [[ "${chart_version}" != "${version}" || "${chart_app_version}" != "${version}" ]]; then
            echo "Chart.yaml version mismatch with release tag" >&2
            echo "  tag:             ${version}" >&2
            echo "  chart version:   ${chart_version}" >&2
            echo "  chart appVersion:${chart_app_version}" >&2
            echo "release-please must update Chart.yaml version and appVersion to match the release tag." >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER}"
          {
            echo "version=${version}"
            echo "chart_version=${chart_version}"
            echo "build_tag=${build_tag}"
            echo "manager_image=ghcr.io/${owner}/openbao-operator"
            echo "config_init_image=ghcr.io/${owner}/openbao-init"
            echo "backup_executor_image=ghcr.io/${owner}/openbao-backup"
            echo "upgrade_executor_image=ghcr.io/${owner}/openbao-upgrade"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve qualified release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-parse HEAD)" bash hack/ci/resolve-release-candidate.sh

      - name: Fail fast if draft GitHub Release is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.vars.outputs.version }}"
          for _ in $(seq 1 24); do
            if gh release view "${version}" >/dev/null 2>&1; then
              echo "Found GitHub Release ${version}"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Release '${version}' not found after waiting." >&2
          echo "Merge the release-please PR and allow the tag workflow to create the tag and draft release." >&2
          exit 1

  authorize:
    name: Approve Release Publication
    needs: prepare
    runs-on: *runner
    environment: release-publish
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout approval script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          sparse-checkout: hack/ci

      - name: Require release manager approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ENVIRONMENT_NAME: release-publish
        run: bash hack/ci/check-release-approval.sh

  build:
    name: Build Images
    needs: [prepare, authorize]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      build_tag: ${{ needs.prepare.outputs.build_tag }}
      ref: ${{ github.ref }}
      source_date_epoch: ${{ needs.prepare.outputs.source_date_epoch }}
      cache-scope: ${{ needs.prepare.outputs.build_tag }}
      sign_images: true

  verify-provenance:
    name: Verify Image Provenance
    runs-on: *runner
    needs: [prepare, build]
    permissions:
      contents: read
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Verify image attestations
        uses: ./.github/actions/verify-image-attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo: ${{ github.repository }}
          version: ${{ needs.prepare.outputs.version }}
          image-refs: |
            ${{ needs.prepare.outputs.manager_image }}@${{ needs.build.outputs.manager_digest }}
            ${{ needs.prepare.outputs.config_init_image }}@${{ needs.build.outputs.config_init_digest }}
            ${{ needs.prepare.outputs.backup_executor_image }}@${{ needs.build.outputs.backup_executor_digest }}
            ${{ needs.prepare.outputs.upgrade_executor_image }}@${{ needs.build.outputs.upgrade_executor_digest }}

  verify-candidate:
    name: Verify Qualified Candidate Images
    runs-on: *runner
    needs: [prepare, build]
    permissions:
      contents: read
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      # The rebuilt digests must carry the build attestations of the qualified PR.
      - name: Verify candidate build attestations
        uses: ./.github/actions/verify-image-attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo: ${{ github.repository }}
          version: ${{ needs.prepare.outputs.version }}
          source-ref: refs/pull/${{ needs.prepare.outputs.pr_number }}/merge
          image-refs: |
            ${{ needs.prepare.outputs.manager_image }}@${{ needs.build.outputs.manager_digest }}
            ${{ needs.prepare.outputs.config_init_image }}@${{ needs.build.outputs.config_init_digest }}
            ${{ needs.prepare.outputs.backup_executor_image }}@${{ needs.build.outputs.backup_executor_digest }}
            ${{ needs.prepare.outputs.upgrade_executor_image }}@${{ needs.build.outputs.upgrade_executor_digest }}

  package:
    name: Package Release Payloads
    runs-on: *runner
    needs: [prepare, build]
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Setup Helm
        uses: ./.github/actions/setup-helm

      - name: Login to GHCR (pull)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package release payloads
        uses: ./.github/actions/package-release-payloads
        with:
          output-dir: dist/release
          version: ${{ needs.prepare.outputs.version }}
          chart-version: ${{ needs.prepare.outputs.chart_version }}
          source-date-epoch: ${{ needs.prepare.outputs.source_date_epoch }}
          manager-image: ${{ needs.prepare.outputs.manager_image }}@${{ needs.build.outputs.manager_digest }}
          config-init-image: ${{ needs.prepare.outputs.config_init_image }}@${{ needs.build.outputs.config_init_digest }}
          backup-executor-image: ${{ needs.prepare.outputs.backup_executor_image }}@${{ needs.build.outputs.backup_executor_digest }}
          upgrade-executor-image: ${{ needs.prepare.outputs.upgrade_executor_image }}@${{ needs.build.outputs.upgrade_executor_digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download qualified candidate payloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ needs.prepare.outputs.candidate_run_id }}
        run: gh run download "${RUN_ID}" --repo "${REPO}" --name release-candidate --dir dist/candidate

      - name: Read qualified candidate digests
        id: qualified
        run: |
          set -euo pipefail
          for key in MANAGER_DIGEST CONFIG_INIT_DIGEST BACKUP_EXECUTOR_DIGEST UPGRADE_EXECUTOR_DIGEST; do
            value="$(sed -n "s/^${key}=//p" dist/candidate/image-digests.env)"
            if [[ ! "${value}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "qualified candidate has no valid ${key}" >&2
              exit 1
            fi
            echo "${key,,}=${value}" >> "${GITHUB_OUTPUT}"
          done

      - name: Require qualified image digests and payload bytes
        env:
          PRIMARY_DIR: dist/release
          REBUILD_DIR: dist/candidate/payloads
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          MANAGER_REBUILD_DIGEST: ${{ steps.qualified.outputs.manager_digest }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          CONFIG_INIT_REBUILD_DIGEST: ${{ steps.qualified.outputs.config_init_digest }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          BACKUP_EXECUTOR_REBUILD_DIGEST: ${{ steps.qualified.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
          UPGRADE_EXECUTOR_REBUILD_DIGEST: ${{ steps.qualified.outputs.upgrade_executor_digest }}
          REPRO_REQUIRED_FILES: >-
            install.yaml
            crds.yaml
            operator-policy-approval.hcl
            operator-policy-approval-with-backup.hcl
            checksums.txt
            openbao-operator-${{ needs.prepare.outputs.chart_version }}.tgz
            sbom-openbao-operator.spdx.json
            sbom-openbao-init.spdx.json
            sbom-openbao-backup.spdx.json
            sbom-openbao-upgrade.spdx.json
        run: bash hack/ci/verify-byte-reproducibility.sh

      - name: Write reproducibility report
        if: always()
        env:
          TAG: ${{ needs.prepare.outputs.version }}
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          CANDIDATE_RUN_ID: ${{ needs.prepare.outputs.candidate_run_id }}
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          MANAGER_CANDIDATE_DIGEST: ${{ steps.qualified.outputs.manager_digest }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          CONFIG_INIT_CANDIDATE_DIGEST: ${{ steps.qualified.outputs.config_init_digest }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          BACKUP_EXECUTOR_CANDIDATE_DIGEST: ${{ steps.qualified.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
          UPGRADE_EXECUTOR_CANDIDATE_DIGEST: ${{ steps.qualified.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          report_path="dist/reproducibility-report.md"
          : > "${report_path}"

          emit() {
            printf '%s\n' "$1" | tee -a "${report_path}" >> "${GITHUB_STEP_SUMMARY}"
          }

          compare_digest() {
            local name="$1"
            local release="$2"
            local candidate="$3"
            local mark="✅"
            if [[ -z "${release}" || "${release}" != "${candidate}" ]]; then
              mark="❌"
            fi
            emit "| ${name} | \`${release}\` | \`${candidate}\` | ${mark} |"
          }

          file_sha() {
            if [[ -f "$1" ]]; then
              sha256sum "$1" | awk '{print $1}'
            else
              echo "missing"
            fi
          }

          compare_file() {
            local rel="$1"
            local release_sha candidate_sha mark
            release_sha="$(file_sha "dist/release/${rel}")"
            candidate_sha="$(file_sha "dist/candidate/payloads/${rel}")"
            mark="✅"
            if [[ "${release_sha}" == "missing" || "${release_sha}" != "${candidate_sha}" ]]; then
              mark="❌"
            fi
            emit "| ${rel} | \`${release_sha}\` | \`${candidate_sha}\` | ${mark} |"
          }

          emit "## Reproducibility Report"
          emit ""
          emit "Tag: \`${TAG}\`"
          emit ""
          emit "Qualified candidate: PR #${PR_NUMBER}, Release Candidate run ${CANDIDATE_RUN_ID}"
          emit ""
          emit "### Image Digests"
          emit "| Image | Release digest | Qualified digest | Match |"
          emit "| :--- | :--- | :--- | :---: |"
          compare_digest "openbao-operator" "${MANAGER_DIGEST}" "${MANAGER_CANDIDATE_DIGEST}"
          compare_digest "openbao-init" "${CONFIG_INIT_DIGEST}" "${CONFIG_INIT_CANDIDATE_DIGEST}"
          compare_digest "openbao-backup" "${BACKUP_EXECUTOR_DIGEST}" "${BACKUP_EXECUTOR_CANDIDATE_DIGEST}"
          compare_digest "openbao-upgrade" "${UPGRADE_EXECUTOR_DIGEST}" "${UPGRADE_EXECUTOR_CANDIDATE_DIGEST}"
          emit ""
          emit "### Artifact Bytes"
          emit "| Artifact | Release sha256 | Qualified sha256 | Match |"
          emit "| :--- | :--- | :--- | :---: |"
          compare_file "install.yaml"
          compare_file "crds.yaml"
          compare_file "operator-policy-approval.hcl"
          compare_file "operator-policy-approval-with-backup.hcl"
          compare_file "checksums.txt"
          compare_file "openbao-operator-${CHART_VERSION}.tgz"
          compare_file "sbom-openbao-operator.spdx.json"
          compare_file "sbom-openbao-init.spdx.json"
          compare_file "sbom-openbao-backup.spdx.json"
          compare_file "sbom-openbao-upgrade.spdx.json"

      - name: Upload reproducibility report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-reproducibility-report
          path: dist/reproducibility-report.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload byte-verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-byte-verified-assets
          path: |
            dist/release/install.yaml
            dist/release/crds.yaml
            dist/release/operator-policy-approval.hcl
            dist/release/operator-policy-approval-with-backup.hcl
            dist/release/checksums.txt
            dist/release/openbao-operator-${{ needs.prepare.outputs.chart_version }}.tgz
            dist/release/sbom-openbao-operator.spdx.json
            dist/release/sbom-openbao-init.spdx.json
            dist/release/sbom-openbao-backup.spdx.json
            dist/release/sbom-openbao-upgrade.spdx.json
          if-no-files-found: error
          retention-days: 30

  promote:
    name: Promote + Publish Release
    runs-on: *runner
    needs:
      - prepare
      - authorize
      - build
      - verify-provenance
      - verify-candidate
      - package
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download byte-verified assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-byte-verified-assets
          path: dist

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.31.1

      - name: Promote tags (no rebuild)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
          CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail
          # shellcheck source=../../hack/ci/release-registry.sh
          source hack/ci/release-registry.sh
          manifest_dir="$(mktemp -d)"
          trap 'rm -rf "${manifest_dir}"' EXIT

          # A rerun may find tags from an earlier attempt. Accept only the same digest.
          promote() {
            local image="$1"
            local digest="$2"
            local existing
            if read_ghcr_manifest "${image}:${VERSION}" "${manifest_dir}/image.json"; then
              existing="sha256:$(sha256sum "${manifest_dir}/image.json" | awk '{print $1}')"
              if [[ "${existing}" != "${digest}" ]]; then
                echo "${image}:${VERSION} already points to ${existing}, expected ${digest}" >&2
                return 1
              fi
              echo "${image}:${VERSION} already points to ${digest}"
              return 0
            else
              local status=$?
              if (( status != 3 )); then
                return "${status}"
              fi
            fi
            docker buildx imagetools create -t "${image}:${VERSION}" "${image}@${digest}"
          }

          promote "${MANAGER_IMAGE}" "${MANAGER_DIGEST}"
          promote "${CONFIG_INIT_IMAGE}" "${CONFIG_INIT_DIGEST}"
          promote "${BACKUP_EXECUTOR_IMAGE}" "${BACKUP_EXECUTOR_DIGEST}"
          promote "${UPGRADE_EXECUTOR_IMAGE}" "${UPGRADE_EXECUTOR_DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.4

      - name: Sign images (keyless)
        env:
          MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
          CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=true "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

      - name: Setup Helm
        uses: ./.github/actions/setup-helm

      - name: Push Helm chart (OCI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # shellcheck source=../../hack/ci/release-registry.sh
          source hack/ci/release-registry.sh
          manifest_dir="$(mktemp -d)"
          trap 'rm -rf "${manifest_dir}"' EXIT
          helm registry login ghcr.io -u "${GITHUB_ACTOR}" -p "${GH_TOKEN}"
          chart_package="dist/openbao-operator-${CHART_VERSION}.tgz"
          if [[ ! -f "${chart_package}" ]]; then
            echo "expected chart package ${chart_package} was not found" >&2
            exit 1
          fi

          # A rerun may find the chart from an earlier attempt. Accept only the same package.
          chart_ref="ghcr.io/${OWNER}/charts/openbao-operator:${CHART_VERSION}"
          if read_ghcr_manifest "${chart_ref}" "${manifest_dir}/chart.json"; then
            published="$(jq -r '[.layers[]? | select(.mediaType == "application/vnd.cncf.helm.chart.content.v1.tar+gzip") | .digest][0] // ""' "${manifest_dir}/chart.json")"
            expected="sha256:$(sha256sum "${chart_package}" | awk '{print $1}')"
            if [[ "${published}" != "${expected}" ]]; then
              echo "${chart_ref} already contains ${published:-unknown chart content}, expected ${expected}" >&2
              exit 1
            fi
            echo "${chart_ref} already contains this chart package"
            exit 0
          else
            status=$?
            if (( status != 3 )); then
              exit "${status}"
            fi
          fi
          helm push "${chart_package}" "oci://ghcr.io/${OWNER}/charts"

      - name: Resolve Helm chart digest (OCI)
        id: chart-digest
        env:
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          chart_digest="$(docker buildx imagetools inspect "ghcr.io/${OWNER}/charts/openbao-operator:${CHART_VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "chart_digest=${chart_digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign Helm chart by digest (OCI)
        env:
          OWNER: ${{ github.repository_owner }}
          CHART_DIGEST: ${{ steps.chart-digest.outputs.chart_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=true "ghcr.io/${OWNER}/charts/openbao-operator@${CHART_DIGEST}"

      - name: Attest Helm chart provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/openbao-operator
          subject-digest: ${{ steps.chart-digest.outputs.chart_digest }}
          push-to-registry: true

      - name: Verify Helm chart signature (bundle format)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          CHART_DIGEST: ${{ steps.chart-digest.outputs.chart_digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=true \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${{ needs.prepare.outputs.version }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/${OWNER}/charts/openbao-operator@${CHART_DIGEST}" >/dev/null

      - name: Attest release checksums provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt

      - name: Sign release checksums (keyless, bundle format)
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --new-bundle-format=true \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt

      - name: Verify release checksums signature (bundle format)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --new-bundle-format=true \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${{ needs.prepare.outputs.version }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt >/dev/null

      - name: Verify chart + release-asset attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          CHART_DIGEST: ${{ steps.chart-digest.outputs.chart_digest }}
        run: bash hack/ci/verify-release-artifact-attestations.sh

      - name: Export Scorecard-compatible release signature assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Keep the existing bundle name for current consumers, and also publish
          # Scorecard-recognized names for the same signature/provenance material.
          cp dist/checksums.txt.bundle dist/checksums.txt.sigstore.json

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT

          (
            cd "${tmpdir}"
            gh attestation download "${GITHUB_WORKSPACE}/dist/checksums.txt" --repo "${REPO}"
          )

          intoto_bundle="$(find "${tmpdir}" -maxdepth 1 -type f -name '*.jsonl' | head -n1)"
          if [[ -z "${intoto_bundle}" ]]; then
            echo "failed to export checksums attestation bundle" >&2
            exit 1
          fi

          cp "${intoto_bundle}" dist/checksums.intoto.jsonl

      - name: Setup repo tools (for provenance tooling)
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Generate provenance index
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
          CHART_DIGEST: ${{ steps.chart-digest.outputs.chart_digest }}
        run: bash hack/ci/generate-provenance-index.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"

          prerelease_flag=""
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            prerelease_flag="--prerelease"
          fi

          # Source-of-truth for versioning and release notes is release-please.
          # This workflow only uploads release assets and publishes the draft release.
          if ! release_json="$(gh release view "${version}" --json isDraft)"; then
            echo "GitHub Release '${version}' not found." >&2
            echo "Merge the release-please PR and allow the tag workflow to create the tag and draft release." >&2
            exit 1
          fi

          # Published assets are immutable. A rerun after publication may only
          # confirm that the release carries the same payload checksums.
          if [[ "$(jq -r '.isDraft' <<<"${release_json}")" != "true" ]]; then
            published_dir="$(mktemp -d)"
            gh release download "${version}" --pattern checksums.txt --dir "${published_dir}"
            if ! cmp -s dist/checksums.txt "${published_dir}/checksums.txt"; then
              echo "GitHub Release '${version}' is already published with different checksums." >&2
              exit 1
            fi
            echo "GitHub Release '${version}' is already published with these checksums."
            exit 0
          fi

          assets=(
            dist/install.yaml
            dist/crds.yaml
            dist/operator-policy-approval.hcl
            dist/operator-policy-approval-with-backup.hcl
            dist/checksums.txt
            dist/checksums.txt.bundle
            dist/checksums.txt.sigstore.json
            dist/checksums.intoto.jsonl
            dist/sbom-openbao-operator.spdx.json
            dist/sbom-openbao-init.spdx.json
            dist/sbom-openbao-backup.spdx.json
            dist/sbom-openbao-upgrade.spdx.json
            dist/provenance-index.json
          )

          # Draft assets remain replaceable. Replace them so a rerun after a
          # partial upload publishes one consistent set of signatures.
          gh release upload "${version}" "${assets[@]}" --clobber

          # Ensure releases are published and marked correctly.
          if [[ -n "${prerelease_flag}" ]]; then
            gh release edit "${version}" --title "${version}" --draft=false --prerelease
          else
            gh release edit "${version}" --title "${version}" --draft=false --latest
          fi

  cleanup-release-state:
    name: Clear Release Pending State
    runs-on: *runner
    needs: [prepare, promote]
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Clear release-please pending label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
          TAG_HEAD_SHA: ${{ github.sha }}
        run: bash hack/ci/clear-release-please-pending-label.sh

  deploy-docs:
    name: Deploy Docs Site
    runs-on: *runner
    needs: [prepare, promote, cleanup-release-state]
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Build docs
        uses: ./.github/actions/docs-build

      - name: Publish docs site
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT_MESSAGE: "docs: publish release ${{ needs.prepare.outputs.version }}"
        run: |
          set -euo pipefail
          bash hack/docs/publish-gh-pages.sh website/public
