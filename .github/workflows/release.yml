name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: &runner ubuntu-24.04
    permissions:
      # Needed to read draft release metadata via `gh release view`.
      # `contents: read` cannot see draft releases and causes false 404 failures.
      contents: write
    outputs:
      version: ${{ steps.vars.outputs.version }}
      chart_version: ${{ steps.vars.outputs.chart_version }}
      build_tag: ${{ steps.vars.outputs.build_tag }}
      repro_build_tag: ${{ steps.vars.outputs.repro_build_tag }}
      source_date_epoch: ${{ steps.vars.outputs.source_date_epoch }}
      manager_image: ${{ steps.vars.outputs.manager_image }}
      config_init_image: ${{ steps.vars.outputs.config_init_image }}
      backup_executor_image: ${{ steps.vars.outputs.backup_executor_image }}
      upgrade_executor_image: ${{ steps.vars.outputs.upgrade_executor_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Compute release variables
        id: vars
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_REF_NAME}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-+].*)?$ ]]; then
            echo "version must be a semver tag (e.g., 0.1.0 or 0.1.0-rc.1)" >&2
            exit 1
          fi

          sha="$(git rev-parse HEAD)"
          build_tag="build-${sha}"
          repro_build_tag="repro-${sha}"
          source_date_epoch="$(git show -s --format=%ct HEAD)"

          chart_file="charts/openbao-operator/Chart.yaml"
          chart_version="$(sed -nE 's/^version:[[:space:]]*"?([^"#[:space:]]+)"?[[:space:]]*(#.*)?$/\1/p' "${chart_file}" | head -n1)"
          chart_app_version="$(sed -nE 's/^appVersion:[[:space:]]*"?([^"#[:space:]]+)"?[[:space:]]*(#.*)?$/\1/p' "${chart_file}" | head -n1)"
          if [[ -z "${chart_version}" || -z "${chart_app_version}" ]]; then
            echo "failed to parse version/appVersion from ${chart_file}" >&2
            exit 1
          fi
          if [[ "${chart_version}" != "${version}" || "${chart_app_version}" != "${version}" ]]; then
            echo "Chart.yaml version mismatch with release tag" >&2
            echo "  tag:             ${version}" >&2
            echo "  chart version:   ${chart_version}" >&2
            echo "  chart appVersion:${chart_app_version}" >&2
            echo "release-please must update Chart.yaml version and appVersion to match the release tag." >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER}"
          {
            echo "version=${version}"
            echo "chart_version=${chart_version}"
            echo "build_tag=${build_tag}"
            echo "repro_build_tag=${repro_build_tag}"
            echo "source_date_epoch=${source_date_epoch}"
            echo "manager_image=ghcr.io/${owner}/openbao-operator"
            echo "config_init_image=ghcr.io/${owner}/openbao-init"
            echo "backup_executor_image=ghcr.io/${owner}/openbao-backup"
            echo "upgrade_executor_image=ghcr.io/${owner}/openbao-upgrade"
          } >> "${GITHUB_OUTPUT}"

      - name: Fail fast if draft GitHub Release is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.vars.outputs.version }}"
          for _ in $(seq 1 24); do
            if gh release view "${version}" >/dev/null 2>&1; then
              echo "Found GitHub Release ${version}"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Release '${version}' not found after waiting." >&2
          echo "Merge the release-please PR and allow the tag workflow to create the tag and draft release." >&2
          exit 1

  api-contract:
    name: API Contract Gate
    runs-on: *runner
    needs: prepare
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Test API contract enforcement
        run: go test -count=1 ./hack/tools/api_inventory ./hack/tools/crd_compatibility ./test/manifests/apicontract

      - name: Verify generated files
        run: make verify-generated

      - name: Verify API contract
        env:
          CRD_COMPAT_TARGET: ${{ needs.prepare.outputs.version }}
        run: make verify-api-contract

  build:
    name: Build Images
    needs: [prepare, api-contract]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      build_tag: ${{ needs.prepare.outputs.build_tag }}
      ref: ${{ github.ref }}
      source_date_epoch: ${{ needs.prepare.outputs.source_date_epoch }}
      cache-scope: ${{ needs.prepare.outputs.build_tag }}
      sign_images: true

  rebuild:
    name: Independent Rebuild Images
    needs: [prepare, api-contract]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      build_tag: ${{ needs.prepare.outputs.repro_build_tag }}
      ref: ${{ github.ref }}
      source_date_epoch: ${{ needs.prepare.outputs.source_date_epoch }}
      cache-scope: ${{ needs.prepare.outputs.repro_build_tag }}

  security-govulncheck:
    name: Security Gate (vulncheck + Semgrep)
    runs-on: *runner
    needs: prepare
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Run vulncheck
        env:
          GOFLAGS: -mod=vendor
        run: make vulncheck

      - name: Run Semgrep
        run: make semgrep-ci

  security-images:
    name: Security Gate (Trivy image ${{ matrix.image_name }})
    runs-on: *runner
    needs: [prepare, build]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: manager
            image_ref: ${{ needs.prepare.outputs.manager_image }}:${{ needs.prepare.outputs.build_tag }}
          - image_name: config-init
            image_ref: ${{ needs.prepare.outputs.config_init_image }}:${{ needs.prepare.outputs.build_tag }}
          - image_name: backup-executor
            image_ref: ${{ needs.prepare.outputs.backup_executor_image }}:${{ needs.prepare.outputs.build_tag }}
          - image_name: upgrade-executor
            image_ref: ${{ needs.prepare.outputs.upgrade_executor_image }}:${{ needs.prepare.outputs.build_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Login to GHCR (pull)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy (safe pinned release)
        uses: ./.github/actions/setup-trivy

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ matrix.image_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  e2e-matrix:
    name: Generate Release E2E Matrix
    runs-on: *runner
    needs: prepare
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Generate release-gate E2E matrix
        id: matrix
        env:
          GOFLAGS: -mod=vendor
        run: |
          set -euo pipefail
          matrix="$(make --silent e2e-release-matrix)"
          printf 'matrix=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Release E2E Matrix"
            echo
            echo '```json'
            echo "${matrix}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  e2e:
    name: E2E Gate (${{ matrix.name }} / kind ${{ matrix.k8s }})
    runs-on: *runner
    needs: [prepare, build, e2e-matrix]
    permissions:
      contents: read
      packages: read
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.e2e-matrix.outputs.matrix) }}
    env:
      KIND_NODE_IMAGE: ${{ matrix.kind_node_image }}
      MANAGER_REF: ${{ needs.prepare.outputs.manager_image }}:${{ needs.prepare.outputs.build_tag }}
      CONFIG_INIT_REF: ${{ needs.prepare.outputs.config_init_image }}:${{ needs.prepare.outputs.build_tag }}
      BACKUP_EXECUTOR_REF: ${{ needs.prepare.outputs.backup_executor_image }}:${{ needs.prepare.outputs.build_tag }}
      UPGRADE_EXECUTOR_REF: ${{ needs.prepare.outputs.upgrade_executor_image }}:${{ needs.prepare.outputs.build_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Login to GHCR (pull)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Kubernetes CLI tools
        uses: ./.github/actions/setup-kubernetes-tools
        with:
          install-dir: bin/

      - name: Prepare E2E lane
        id: prepare-e2e-lane
        uses: ./.github/actions/prepare-e2e-lane
        with:
          kind-node-image: ${{ matrix.kind_node_image }}
          kind-cluster: kind
          manager-image: ${{ env.MANAGER_REF }}
          config-init-image: ${{ env.CONFIG_INIT_REF }}
          backup-executor-image: ${{ env.BACKUP_EXECUTOR_REF }}
          upgrade-executor-image: ${{ env.UPGRADE_EXECUTOR_REF }}
          hardened-upgrade-executor-image: ${{ env.UPGRADE_EXECUTOR_REF }}
          load-backup-executor-image: ${{ matrix.load_backup_executor_image }}
          load-upgrade-executor-image: ${{ matrix.load_upgrade_executor_image }}
          preload-storage-emulators: ${{ matrix.preload_storage_emulators }}
          preload-rustfs-image: ${{ matrix.preload_rustfs_image }}
          preload-fake-gcs-image: ${{ matrix.preload_fake_gcs_image }}
          preload-azurite-image: ${{ matrix.preload_azurite_image }}
          rustfs-image: ${{ matrix.rustfs_image }}
          fake-gcs-image: ${{ matrix.fake_gcs_image }}
          azurite-image: ${{ matrix.azurite_image }}
          report-dir: artifacts/e2e-reports/release-gate/kind-${{ matrix.k8s }}/${{ matrix.id }}-${{ matrix.coverage }}
          artifact-name: e2e-artifacts-release-gate-kind-${{ matrix.k8s }}-${{ matrix.id }}-${{ matrix.coverage }}

      - name: Run E2E
        env:
          GOFLAGS: -mod=vendor
          OPENBAO_REQUEUE_STANDARD: 10s
          E2E_TIMEOUT: ${{ matrix.e2e_timeout }}
          E2E_PARALLEL_NODES: ${{ matrix.parallel_nodes }}
          E2E_FAIL_ON_EMPTY: "true"
          E2E_POLL_PROGRESS_AFTER: "10m"
          E2E_LABEL_FILTER: ${{ matrix.label_filter }}
          E2E_SKIP_IMAGE_BUILD: "true"
          E2E_INSTALL_CSI_HOSTPATH: ${{ matrix.install_csi_hostpath }}
          E2E_ENABLE_HARDENED_SIGNED_SUITE: ${{ matrix.hardened_signed }}

          OPERATOR_VERSION: ${{ needs.prepare.outputs.build_tag }}

          E2E_OPERATOR_IMAGE: ${{ env.MANAGER_REF }}
          E2E_OPENBAO_IMAGE: ${{ matrix.openbao_image }}
          E2E_RUSTFS_IMAGE: ${{ steps.prepare-e2e-lane.outputs['rustfs-image'] }}
          E2E_FAKE_GCS_IMAGE: ${{ steps.prepare-e2e-lane.outputs['fake-gcs-image'] }}
          E2E_AZURITE_IMAGE: ${{ steps.prepare-e2e-lane.outputs['azurite-image'] }}
          E2E_CONFIG_INIT_IMAGE: ${{ env.CONFIG_INIT_REF }}
          E2E_HARDENED_CONFIG_INIT_IMAGE: ${{ env.CONFIG_INIT_REF }}
          E2E_BACKUP_EXECUTOR_IMAGE: ${{ env.BACKUP_EXECUTOR_REF }}
          E2E_UPGRADE_EXECUTOR_IMAGE: ${{ env.UPGRADE_EXECUTOR_REF }}
          E2E_HARDENED_UPGRADE_EXECUTOR_IMAGE: ${{ env.UPGRADE_EXECUTOR_REF }}
          E2E_LOAD_BACKUP_EXECUTOR_IMAGE: ${{ matrix.load_backup_executor_image }}
          E2E_LOAD_UPGRADE_EXECUTOR_IMAGE: ${{ matrix.load_upgrade_executor_image }}
          E2E_PRELOAD_UPGRADE_IMAGES: ${{ matrix.preload_upgrade_images }}
          E2E_PRELOAD_HARDENED_ASSETS: ${{ matrix.preload_hardened_assets }}
          KIND_CLUSTER: kind
        run: make test-e2e-ci

      - name: Summarize E2E report
        if: always()
        env:
          E2E_LABEL_FILTER: ${{ matrix.label_filter }}
          GOFLAGS: -mod=vendor
          KIND_NODE_IMAGE: ${{ matrix.kind_node_image }}
        run: |
          set -euo pipefail
          if [[ -z "${E2E_JSON_REPORT:-}" ]] || [[ ! -s "${E2E_JSON_REPORT}" ]]; then
            {
              echo "## E2E Report Summary"
              echo
              echo "No Ginkgo JSON report was produced for ${{ matrix.name }} on kind ${{ matrix.k8s }}."
            } > "${E2E_SUMMARY_REPORT:-e2e-summary.md}"
          else
            report_status=0
            go run ./hack/tools/e2e_report \
              --json-report "${E2E_JSON_REPORT}" \
              --manifest test/e2e/suites.yaml \
              --fail-on-selected-skips \
              --markdown-out "${E2E_SUMMARY_REPORT}" \
              --json-out "${E2E_SUMMARY_JSON}" \
              --lane "${{ matrix.name }} (${{ matrix.profile }} / ${{ matrix.coverage }})" \
              --selector "${E2E_LABEL_FILTER}" \
              --kubernetes-version "${KIND_NODE_IMAGE}" \
              --openbao-version "${{ matrix.openbao_image }}" || report_status=$?
          fi
          cat "${E2E_SUMMARY_REPORT}" >> "${GITHUB_STEP_SUMMARY}"
          exit "${report_status:-0}"

      - name: Collect E2E artifacts (failure)
        if: failure()
        run: bash hack/ci/collect-e2e-artifacts.sh

      - name: Upload E2E artifacts
        if: always() && env.E2E_ARTIFACT_NAME != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.E2E_ARTIFACT_NAME }}
          path: artifacts/
          retention-days: 7

  operator-upgrade-e2e:
    name: Operator Upgrade E2E
    runs-on: *runner
    needs: [prepare, build]
    permissions:
      contents: read
      packages: read
    timeout-minutes: 45
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Setup Helm 3 compatibility client
        id: helm3
        uses: ./.github/actions/setup-helm
        with:
          version-key: HELM3_COMPAT_VERSION

      - name: Setup Helm 4
        id: helm4
        uses: ./.github/actions/setup-helm

      - name: Setup Kubernetes CLI tools
        uses: ./.github/actions/setup-kubernetes-tools
        with:
          install-dir: bin/

      - name: Login to GHCR (pull)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade previous stable operator to release candidate
        env:
          HELM: ${{ steps.helm4.outputs.helm-path }}
          HELM_INSTALL: ${{ steps.helm3.outputs.helm-path }}
          OPERATOR_UPGRADE_E2E_TARGET_VERSION: ${{ needs.prepare.outputs.version }}
          OPERATOR_UPGRADE_E2E_TARGET_RELEASE: ${{ needs.prepare.outputs.version }}
          OPERATOR_UPGRADE_E2E_MANAGER_SOURCE: >-
            ${{ needs.prepare.outputs.manager_image }}:${{ needs.prepare.outputs.build_tag }}
          OPERATOR_UPGRADE_E2E_INIT_SOURCE: >-
            ${{ needs.prepare.outputs.config_init_image }}:${{ needs.prepare.outputs.build_tag }}
          OPERATOR_UPGRADE_E2E_HARDENED_INIT_IMAGE: >-
            ${{ needs.prepare.outputs.config_init_image }}@${{ needs.build.outputs.config_init_digest }}
        run: make test-e2e-operator-upgrade

  verify-provenance:
    name: Verify Image Provenance
    runs-on: *runner
    needs: [prepare, build]
    permissions:
      contents: read
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Verify image attestations
        uses: ./.github/actions/verify-image-attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo: ${{ github.repository }}
          version: ${{ needs.prepare.outputs.version }}
          image-refs: |
            ${{ needs.prepare.outputs.manager_image }}@${{ needs.build.outputs.manager_digest }}
            ${{ needs.prepare.outputs.config_init_image }}@${{ needs.build.outputs.config_init_digest }}
            ${{ needs.prepare.outputs.backup_executor_image }}@${{ needs.build.outputs.backup_executor_digest }}
            ${{ needs.prepare.outputs.upgrade_executor_image }}@${{ needs.build.outputs.upgrade_executor_digest }}

  verify-byte-reproducibility:
    name: Verify Byte Reproducibility
    runs-on: *runner
    needs: [prepare, build, rebuild]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Setup Helm
        uses: ./.github/actions/setup-helm

      - name: Login to GHCR (pull)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare output directories
        run: |
          set -euo pipefail
          mkdir -p dist/primary dist/rebuild

      - name: Generate primary manifests
        uses: ./.github/actions/generate-channel-manifests
        with:
          image: ${{ needs.prepare.outputs.manager_image }}@${{ needs.build.outputs.manager_digest }}
          operator-version: ${{ needs.prepare.outputs.version }}
          output-dir: dist/primary

      - name: Generate rebuild manifests
        uses: ./.github/actions/generate-channel-manifests
        with:
          image: ${{ needs.prepare.outputs.manager_image }}@${{ needs.rebuild.outputs.manager_digest }}
          operator-version: ${{ needs.prepare.outputs.version }}
          output-dir: dist/rebuild

      - name: Generate policy approval assets
        run: |
          set -euo pipefail
          go run ./hack/tools/operator_policy_approval --output-dir dist/primary
          go run ./hack/tools/operator_policy_approval --output-dir dist/rebuild

      - name: Package Helm chart (primary)
        env:
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          OWNER: ${{ github.repository_owner }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          cp -a charts/openbao-operator "${work_dir}/openbao-operator"
          CHART_DIR="${work_dir}/openbao-operator" CHART_VERSION="${CHART_VERSION}" OWNER="${OWNER}" PRESERVE_CHANGE_METADATA=true bash hack/ci/prepare-release-chart.sh
          find "${work_dir}/openbao-operator" -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +
          helm lint "${work_dir}/openbao-operator"
          helm package "${work_dir}/openbao-operator" -d dist/primary
          test -f "dist/primary/openbao-operator-${CHART_VERSION}.tgz"

      - name: Package Helm chart (rebuild)
        env:
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          OWNER: ${{ github.repository_owner }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          cp -a charts/openbao-operator "${work_dir}/openbao-operator"
          CHART_DIR="${work_dir}/openbao-operator" CHART_VERSION="${CHART_VERSION}" OWNER="${OWNER}" PRESERVE_CHANGE_METADATA=true bash hack/ci/prepare-release-chart.sh
          find "${work_dir}/openbao-operator" -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +
          helm package "${work_dir}/openbao-operator" -d dist/rebuild
          test -f "dist/rebuild/openbao-operator-${CHART_VERSION}.tgz"

      - name: Generate SBOM (primary) - manager
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ needs.prepare.outputs.manager_image }}@${{ needs.build.outputs.manager_digest }}
          format: spdx-json
          output-file: dist/primary/sbom-openbao-operator.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (primary) - config-init
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ needs.prepare.outputs.config_init_image }}@${{ needs.build.outputs.config_init_digest }}
          format: spdx-json
          output-file: dist/primary/sbom-openbao-init.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (primary) - backup
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ needs.prepare.outputs.backup_executor_image }}@${{ needs.build.outputs.backup_executor_digest }}
          format: spdx-json
          output-file: dist/primary/sbom-openbao-backup.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (primary) - upgrade
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ needs.prepare.outputs.upgrade_executor_image }}@${{ needs.build.outputs.upgrade_executor_digest }}
          format: spdx-json
          output-file: dist/primary/sbom-openbao-upgrade.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (rebuild) - manager
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ needs.prepare.outputs.manager_image }}@${{ needs.rebuild.outputs.manager_digest }}
          format: spdx-json
          output-file: dist/rebuild/sbom-openbao-operator.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (rebuild) - config-init
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ needs.prepare.outputs.config_init_image }}@${{ needs.rebuild.outputs.config_init_digest }}
          format: spdx-json
          output-file: dist/rebuild/sbom-openbao-init.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (rebuild) - backup
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ needs.prepare.outputs.backup_executor_image }}@${{ needs.rebuild.outputs.backup_executor_digest }}
          format: spdx-json
          output-file: dist/rebuild/sbom-openbao-backup.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (rebuild) - upgrade
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ needs.prepare.outputs.upgrade_executor_image }}@${{ needs.rebuild.outputs.upgrade_executor_digest }}
          format: spdx-json
          output-file: dist/rebuild/sbom-openbao-upgrade.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize SBOM JSON (deterministic)
        env:
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          bash hack/ci/normalize-spdx-json.sh \
            dist/primary/sbom-openbao-operator.spdx.json \
            dist/primary/sbom-openbao-init.spdx.json \
            dist/primary/sbom-openbao-backup.spdx.json \
            dist/primary/sbom-openbao-upgrade.spdx.json \
            dist/rebuild/sbom-openbao-operator.spdx.json \
            dist/rebuild/sbom-openbao-init.spdx.json \
            dist/rebuild/sbom-openbao-backup.spdx.json \
            dist/rebuild/sbom-openbao-upgrade.spdx.json

      - name: Generate deterministic checksums
        run: |
          set -euo pipefail
          generate_checksums() {
            local dir="$1"
            local -a sboms=()
            local sbom_names=()
            local sbom_path
            mapfile -t sboms < <(find "${dir}" -maxdepth 1 -type f -name 'sbom-*.spdx.json' | LC_ALL=C sort)
            for sbom_path in "${sboms[@]}"; do
              sbom_names+=("$(basename "${sbom_path}")")
            done
            (
              cd "${dir}"
              sha256sum install.yaml crds.yaml operator-policy-approval.hcl operator-policy-approval-with-backup.hcl "${sbom_names[@]}" > checksums.txt
            )
          }
          generate_checksums dist/primary
          generate_checksums dist/rebuild

      - name: Verify byte reproducibility
        env:
          PRIMARY_DIR: dist/primary
          REBUILD_DIR: dist/rebuild
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          MANAGER_REBUILD_DIGEST: ${{ needs.rebuild.outputs.manager_digest }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          CONFIG_INIT_REBUILD_DIGEST: ${{ needs.rebuild.outputs.config_init_digest }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          BACKUP_EXECUTOR_REBUILD_DIGEST: ${{ needs.rebuild.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
          UPGRADE_EXECUTOR_REBUILD_DIGEST: ${{ needs.rebuild.outputs.upgrade_executor_digest }}
          REPRO_REQUIRED_FILES: >-
            install.yaml
            crds.yaml
            operator-policy-approval.hcl
            operator-policy-approval-with-backup.hcl
            checksums.txt
            openbao-operator-${{ needs.prepare.outputs.chart_version }}.tgz
            sbom-openbao-operator.spdx.json
            sbom-openbao-init.spdx.json
            sbom-openbao-backup.spdx.json
            sbom-openbao-upgrade.spdx.json
        run: bash hack/ci/verify-byte-reproducibility.sh

      - name: Write reproducibility report
        env:
          TAG: ${{ needs.prepare.outputs.version }}
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          MANAGER_REBUILD_DIGEST: ${{ needs.rebuild.outputs.manager_digest }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          CONFIG_INIT_REBUILD_DIGEST: ${{ needs.rebuild.outputs.config_init_digest }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          BACKUP_EXECUTOR_REBUILD_DIGEST: ${{ needs.rebuild.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
          UPGRADE_EXECUTOR_REBUILD_DIGEST: ${{ needs.rebuild.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail
          report_path="dist/reproducibility-report.md"
          : > "${report_path}"

          emit() {
            printf '%s\n' "$1" | tee -a "${report_path}" >> "${GITHUB_STEP_SUMMARY}"
          }

          compare_digest() {
            local name="$1"
            local primary="$2"
            local rebuild="$3"
            local mark="✅"
            if [[ "${primary}" != "${rebuild}" ]]; then
              mark="❌"
            fi
            emit "| ${name} | \`${primary}\` | \`${rebuild}\` | ${mark} |"
          }

          compare_file() {
            local rel="$1"
            local primary_path="dist/primary/${rel}"
            local rebuild_path="dist/rebuild/${rel}"
            local primary_sha rebuild_sha mark
            primary_sha="$(sha256sum "${primary_path}" | awk '{print $1}')"
            rebuild_sha="$(sha256sum "${rebuild_path}" | awk '{print $1}')"
            mark="✅"
            if [[ "${primary_sha}" != "${rebuild_sha}" ]]; then
              mark="❌"
            fi
            emit "| ${rel} | \`${primary_sha}\` | \`${rebuild_sha}\` | ${mark} |"
          }

          emit "## Reproducibility Report"
          emit ""
          emit "Tag: \`${TAG}\`"
          emit ""
          emit "### Image Digests"
          emit "| Image | Primary digest | Rebuild digest | Match |"
          emit "| :--- | :--- | :--- | :---: |"
          compare_digest "openbao-operator" "${MANAGER_DIGEST}" "${MANAGER_REBUILD_DIGEST}"
          compare_digest "openbao-init" "${CONFIG_INIT_DIGEST}" "${CONFIG_INIT_REBUILD_DIGEST}"
          compare_digest "openbao-backup" "${BACKUP_EXECUTOR_DIGEST}" "${BACKUP_EXECUTOR_REBUILD_DIGEST}"
          compare_digest "openbao-upgrade" "${UPGRADE_EXECUTOR_DIGEST}" "${UPGRADE_EXECUTOR_REBUILD_DIGEST}"
          emit ""
          emit "### Artifact Bytes"
          emit "| Artifact | Primary sha256 | Rebuild sha256 | Match |"
          emit "| :--- | :--- | :--- | :---: |"
          compare_file "install.yaml"
          compare_file "crds.yaml"
          compare_file "operator-policy-approval.hcl"
          compare_file "operator-policy-approval-with-backup.hcl"
          compare_file "checksums.txt"
          compare_file "openbao-operator-${CHART_VERSION}.tgz"
          compare_file "sbom-openbao-operator.spdx.json"
          compare_file "sbom-openbao-init.spdx.json"
          compare_file "sbom-openbao-backup.spdx.json"
          compare_file "sbom-openbao-upgrade.spdx.json"

      - name: Upload byte-verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-byte-verified-assets
          path: |
            dist/primary/install.yaml
            dist/primary/crds.yaml
            dist/primary/operator-policy-approval.hcl
            dist/primary/operator-policy-approval-with-backup.hcl
            dist/primary/checksums.txt
            dist/primary/openbao-operator-${{ needs.prepare.outputs.chart_version }}.tgz
            dist/primary/sbom-openbao-operator.spdx.json
            dist/primary/sbom-openbao-init.spdx.json
            dist/primary/sbom-openbao-backup.spdx.json
            dist/primary/sbom-openbao-upgrade.spdx.json
          retention-days: 30

      - name: Upload rebuild validation assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rebuild-validation-assets
          path: |
            dist/rebuild/install.yaml
            dist/rebuild/crds.yaml
            dist/rebuild/operator-policy-approval.hcl
            dist/rebuild/operator-policy-approval-with-backup.hcl
            dist/rebuild/checksums.txt
            dist/rebuild/openbao-operator-${{ needs.prepare.outputs.chart_version }}.tgz
            dist/rebuild/sbom-openbao-operator.spdx.json
            dist/rebuild/sbom-openbao-init.spdx.json
            dist/rebuild/sbom-openbao-backup.spdx.json
            dist/rebuild/sbom-openbao-upgrade.spdx.json
          retention-days: 30

      - name: Upload reproducibility report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reproducibility-report
          path: dist/reproducibility-report.md
          retention-days: 30

  promote:
    name: Promote + Publish Release
    runs-on: *runner
    needs:
      - prepare
      - build
      - api-contract
      - security-govulncheck
      - security-images
      - e2e
      - operator-upgrade-e2e
      - verify-provenance
      - verify-byte-reproducibility
    environment:
      name: release-publish
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download byte-verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-byte-verified-assets
          path: dist

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.31.1

      - name: Promote tags (no rebuild)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
          CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${MANAGER_IMAGE}:${VERSION}" "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          docker buildx imagetools create -t "${CONFIG_INIT_IMAGE}:${VERSION}" "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          docker buildx imagetools create -t "${BACKUP_EXECUTOR_IMAGE}:${VERSION}" "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          docker buildx imagetools create -t "${UPGRADE_EXECUTOR_IMAGE}:${VERSION}" "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.4

      - name: Sign images (keyless)
        env:
          MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
          CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=true "${MANAGER_IMAGE}@${MANAGER_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${CONFIG_INIT_IMAGE}@${CONFIG_INIT_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${BACKUP_EXECUTOR_IMAGE}@${BACKUP_EXECUTOR_DIGEST}"
          cosign sign --yes --new-bundle-format=true "${UPGRADE_EXECUTOR_IMAGE}@${UPGRADE_EXECUTOR_DIGEST}"

      - name: Setup Helm
        uses: ./.github/actions/setup-helm

      - name: Push Helm chart (OCI)
        env:
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          helm registry login ghcr.io -u "${GITHUB_ACTOR}" -p "${{ secrets.GITHUB_TOKEN }}"
          chart_package="dist/openbao-operator-${CHART_VERSION}.tgz"
          if [[ ! -f "${chart_package}" ]]; then
            echo "expected chart package ${chart_package} was not found" >&2
            exit 1
          fi
          helm push "${chart_package}" "oci://ghcr.io/${OWNER}/charts"

      - name: Resolve Helm chart digest (OCI)
        id: chart-digest
        env:
          CHART_VERSION: ${{ needs.prepare.outputs.chart_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          chart_digest="$(docker buildx imagetools inspect "ghcr.io/${OWNER}/charts/openbao-operator:${CHART_VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "chart_digest=${chart_digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign Helm chart by digest (OCI)
        env:
          OWNER: ${{ github.repository_owner }}
          CHART_DIGEST: ${{ steps.chart-digest.outputs.chart_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --new-bundle-format=true "ghcr.io/${OWNER}/charts/openbao-operator@${CHART_DIGEST}"

      - name: Attest Helm chart provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/openbao-operator
          subject-digest: ${{ steps.chart-digest.outputs.chart_digest }}
          push-to-registry: true

      - name: Verify Helm chart signature (bundle format)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          CHART_DIGEST: ${{ steps.chart-digest.outputs.chart_digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=true \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${{ needs.prepare.outputs.version }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/${OWNER}/charts/openbao-operator@${CHART_DIGEST}" >/dev/null

      - name: Attest release checksums provenance (GitHub)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt

      - name: Sign release checksums (keyless, bundle format)
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --new-bundle-format=true \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt

      - name: Verify release checksums signature (bundle format)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --new-bundle-format=true \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${{ needs.prepare.outputs.version }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt >/dev/null

      - name: Verify chart + release-asset attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          CHART_DIGEST: ${{ steps.chart-digest.outputs.chart_digest }}
        run: bash hack/ci/verify-release-artifact-attestations.sh

      - name: Export Scorecard-compatible release signature assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Keep the existing bundle name for current consumers, and also publish
          # Scorecard-recognized names for the same signature/provenance material.
          cp dist/checksums.txt.bundle dist/checksums.txt.sigstore.json

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT

          (
            cd "${tmpdir}"
            gh attestation download "${GITHUB_WORKSPACE}/dist/checksums.txt" --repo "${REPO}"
          )

          intoto_bundle="$(find "${tmpdir}" -maxdepth 1 -type f -name '*.jsonl' | head -n1)"
          if [[ -z "${intoto_bundle}" ]]; then
            echo "failed to export checksums attestation bundle" >&2
            exit 1
          fi

          cp "${intoto_bundle}" dist/checksums.intoto.jsonl

      - name: Setup repo tools (for provenance tooling)
        uses: ./.github/actions/setup-repo-tools
        with:
          cache-tools: false

      - name: Generate provenance index
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          MANAGER_IMAGE: ${{ needs.prepare.outputs.manager_image }}
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          CONFIG_INIT_IMAGE: ${{ needs.prepare.outputs.config_init_image }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          BACKUP_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.backup_executor_image }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_IMAGE: ${{ needs.prepare.outputs.upgrade_executor_image }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
          CHART_DIGEST: ${{ steps.chart-digest.outputs.chart_digest }}
        run: bash hack/ci/generate-provenance-index.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"

          prerelease_flag=""
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            prerelease_flag="--prerelease"
          fi

          # Source-of-truth for versioning and release notes is release-please.
          # This workflow only uploads release assets and publishes the draft release.
          if ! gh release view "${version}" >/dev/null 2>&1; then
            echo "GitHub Release '${version}' not found." >&2
            echo "Merge the release-please PR and allow the tag workflow to create the tag and draft release." >&2
            exit 1
          fi

          assets=(
            dist/install.yaml
            dist/crds.yaml
            dist/operator-policy-approval.hcl
            dist/operator-policy-approval-with-backup.hcl
            dist/checksums.txt
            dist/checksums.txt.bundle
            dist/checksums.txt.sigstore.json
            dist/checksums.intoto.jsonl
            dist/sbom-openbao-operator.spdx.json
            dist/sbom-openbao-init.spdx.json
            dist/sbom-openbao-backup.spdx.json
            dist/sbom-openbao-upgrade.spdx.json
            dist/provenance-index.json
          )

          declare -A existing_asset_sizes=()
          while IFS=$'\t' read -r name size; do
            if [[ -n "${name}" ]]; then
              existing_asset_sizes["${name}"]="${size}"
            fi
          done < <(gh release view "${version}" --json assets --jq '.assets[]? | [.name, (.size|tostring)] | @tsv')

          tmp_existing="$(mktemp -d)"
          trap 'rm -rf "${tmp_existing}"' EXIT

          to_upload=()
          for file in "${assets[@]}"; do
            name="$(basename "${file}")"
            if [[ -n "${existing_asset_sizes[${name}]-}" ]]; then
              local_size="$(stat -c%s "${file}")"
              if [[ "${local_size}" != "${existing_asset_sizes[${name}]}" ]]; then
                echo "Release asset '${name}' already exists but size differs (local=${local_size}, release=${existing_asset_sizes[${name}]})" >&2
                echo "Immutable releases cannot delete/replace assets; investigate the mismatch or create a new release." >&2
                exit 1
              fi

              gh release download "${version}" --pattern "${name}" --dir "${tmp_existing}"
              local_sha="$(sha256sum "${file}" | awk '{print $1}')"
              release_sha="$(sha256sum "${tmp_existing}/${name}" | awk '{print $1}')"
              if [[ "${local_sha}" != "${release_sha}" ]]; then
                echo "Release asset '${name}' already exists but content differs (local_sha=${local_sha}, release_sha=${release_sha})" >&2
                echo "Immutable releases cannot delete/replace assets; investigate the mismatch or create a new release." >&2
                exit 1
              fi
              continue
            fi
            to_upload+=("${file}")
          done

          if (( ${#to_upload[@]} > 0 )); then
            gh release upload "${version}" "${to_upload[@]}"
          fi

          # Ensure releases are published and marked correctly.
          if [[ -n "${prerelease_flag}" ]]; then
            gh release edit "${version}" --title "${version}" --draft=false --prerelease
          else
            gh release edit "${version}" --title "${version}" --draft=false --latest
          fi

  cleanup-release-state:
    name: Clear Release Pending State
    runs-on: *runner
    needs: [prepare, promote]
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Clear release-please pending label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
          TAG_HEAD_SHA: ${{ github.sha }}
        run: bash hack/ci/clear-release-please-pending-label.sh

  deploy-docs:
    name: Deploy Docs Site
    runs-on: *runner
    needs: [prepare, promote, cleanup-release-state]
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Build docs
        uses: ./.github/actions/docs-build

      - name: Publish docs site
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT_MESSAGE: "docs: publish release ${{ needs.prepare.outputs.version }}"
        run: |
          set -euo pipefail
          bash hack/docs/publish-gh-pages.sh website/public
