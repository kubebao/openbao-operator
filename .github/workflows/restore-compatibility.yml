name: Restore Compatibility

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Resolve stable OpenBao releases
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Resolve minimum and latest stable releases
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api repos/openbao/openbao/releases/latest --jq '.tag_name')"
          python3 - "${latest}" <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import re
          import sys

          version = sys.argv[1].removeprefix("v")
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("Latest OpenBao release must have a stable semantic version")
          if tuple(map(int, version.split("."))) < (2, 7, 0):
              raise SystemExit("Latest OpenBao release must be at least 2.7.0")
          versions = list(dict.fromkeys(["2.7.0", version]))
          print("matrix=" + json.dumps({"version": versions}))
          PY

  restore:
    name: Restore OpenBao ${{ matrix.version }}
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      GOFLAGS: -mod=vendor
      KIND_CLUSTER: restore-compatibility
      KIND_NODE_IMAGE: kindest/node:v1.36.1
      E2E_RESTORE_OPENBAO_VERSION: ${{ matrix.version }}
      E2E_LABEL_FILTER: case:restore-minimal-scheduled || case:restore-minimal-retain
      E2E_FAIL_ON_EMPTY: "true"
      E2E_TIMEOUT: 45m
      E2E_JUNIT_REPORT: dist/test/restore-compatibility/junit.xml
      E2E_JSON_REPORT: dist/test/restore-compatibility/ginkgo.json
      KUBECONFIG: ${{ github.workspace }}/.restore-compatibility.kubeconfig
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Setup Kubernetes CLI tools
        uses: ./.github/actions/setup-kubernetes-tools

      - name: Create isolated test cluster
        run: |
          mkdir -p dist/test/restore-compatibility
          make setup-test-e2e

      - name: Test scheduled restores and retained recovery
        run: make test-e2e-ci

      - name: Verify both restore scenarios passed
        if: always()
        run: |
          mkdir -p dist/test/restore-compatibility
          printf '%s\n' '["restore-minimal-scheduled","restore-minimal-retain"]' \
            > dist/test/restore-compatibility/expected-cases.json
          go run ./hack/tools/e2e_report \
            --json-report "${E2E_JSON_REPORT}" \
            --selector "${E2E_LABEL_FILTER}" \
            --expected-cases dist/test/restore-compatibility/expected-cases.json \
            --openbao-version "${E2E_RESTORE_OPENBAO_VERSION}" \
            --kubernetes-version "${KIND_NODE_IMAGE}" \
            --json-out dist/test/restore-compatibility/summary.json \
            --markdown-out dist/test/restore-compatibility/summary.md
          cat dist/test/restore-compatibility/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove test cluster
        if: always()
        run: make cleanup-test-e2e

      - name: Upload restore evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-compatibility-${{ matrix.version }}
          path: dist/test/restore-compatibility/
          retention-days: 14
