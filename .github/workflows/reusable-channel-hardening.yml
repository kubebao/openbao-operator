name: Reusable Channel Hardening

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref/SHA to checkout"
        required: true
        type: string
      source_ref:
        description: "Expected source ref for attestation verification"
        required: true
        type: string
      version:
        description: "Channel version label (e.g., edge-<sha>, nightly-YYYYMMDD-<sha>)"
        required: true
        type: string
      chart_version:
        description: "Candidate chart version (unique prerelease for edge; source version for nightly)"
        required: true
        type: string
      build_tag:
        description: "Build tag for first-pass images"
        required: true
        type: string
      repro_build_tag:
        description: "Build tag for independent rebuild images"
        required: true
        type: string
      source_date_epoch:
        description: "Commit timestamp for deterministic metadata"
        required: true
        type: string
      manager_image:
        description: "Manager image repository"
        required: true
        type: string
      config_init_image:
        description: "Config-init image repository"
        required: true
        type: string
      backup_executor_image:
        description: "Backup image repository"
        required: true
        type: string
      upgrade_executor_image:
        description: "Upgrade image repository"
        required: true
        type: string
      byte_artifact_name:
        description: "Artifact name for byte-verified primary outputs"
        required: true
        type: string
    outputs:
      manager_digest:
        description: "Digest of manager image"
        value: ${{ jobs.build.outputs.manager_digest }}
      config_init_digest:
        description: "Digest of config-init image"
        value: ${{ jobs.build.outputs.config_init_digest }}
      backup_executor_digest:
        description: "Digest of backup image"
        value: ${{ jobs.build.outputs.backup_executor_digest }}
      upgrade_executor_digest:
        description: "Digest of upgrade image"
        value: ${{ jobs.build.outputs.upgrade_executor_digest }}
      manager_rebuild_digest:
        description: "Digest of manager rebuild image"
        value: ${{ jobs.rebuild.outputs.manager_digest }}
      config_init_rebuild_digest:
        description: "Digest of config-init rebuild image"
        value: ${{ jobs.rebuild.outputs.config_init_digest }}
      backup_executor_rebuild_digest:
        description: "Digest of backup rebuild image"
        value: ${{ jobs.rebuild.outputs.backup_executor_digest }}
      upgrade_executor_rebuild_digest:
        description: "Digest of upgrade rebuild image"
        value: ${{ jobs.rebuild.outputs.upgrade_executor_digest }}

permissions:
  contents: read

jobs:
  build:
    name: Build Images
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      build_tag: ${{ inputs.build_tag }}
      ref: ${{ inputs.ref }}
      source_date_epoch: ${{ inputs.source_date_epoch }}
      cache-scope: ${{ inputs.build_tag }}

  rebuild:
    name: Independent Rebuild Images
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      build_tag: ${{ inputs.repro_build_tag }}
      ref: ${{ inputs.ref }}
      source_date_epoch: ${{ inputs.source_date_epoch }}
      cache-scope: ${{ inputs.repro_build_tag }}

  verify-provenance:
    name: Verify Image Provenance
    runs-on: &runner ubuntu-24.04
    needs: [build]
    permissions:
      contents: read
    steps:
      - name: Checkout workflow helper sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .github-workflow-src
          fetch-depth: 1

      - name: Verify image attestations
        uses: ./.github-workflow-src/.github/actions/verify-image-attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo: ${{ github.repository }}
          version: ${{ inputs.version }}
          source-ref: ${{ inputs.source_ref }}
          image-refs: |
            ${{ inputs.manager_image }}@${{ needs.build.outputs.manager_digest }}
            ${{ inputs.config_init_image }}@${{ needs.build.outputs.config_init_digest }}
            ${{ inputs.backup_executor_image }}@${{ needs.build.outputs.backup_executor_digest }}
            ${{ inputs.upgrade_executor_image }}@${{ needs.build.outputs.upgrade_executor_digest }}

  verify-byte-reproducibility:
    name: Verify Byte Reproducibility
    runs-on: *runner
    needs: [build, rebuild]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout source ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: source-under-test
          fetch-depth: 0

      - name: Checkout workflow helper sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .github-workflow-src
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source-under-test/go.mod
          check-latest: true
          cache: false

      - name: Setup Helm
        uses: ./.github-workflow-src/.github/actions/setup-helm

      - name: Login to GHCR (pull)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare output directories
        run: |
          set -euo pipefail
          mkdir -p dist/primary dist/rebuild

      - name: Generate primary manifests
        env:
          SOURCE_DIR: ${{ github.workspace }}/source-under-test
          IMAGE: ${{ inputs.manager_image }}@${{ needs.build.outputs.manager_digest }}
          OPERATOR_VERSION: ${{ inputs.version }}
          OUTPUT_DIR: ${{ github.workspace }}/dist/primary
        run: |
          set -euo pipefail
          bash .github-workflow-src/hack/ci/generate-channel-manifests.sh \
            "${SOURCE_DIR}" \
            "${IMAGE}" \
            "${OPERATOR_VERSION}" \
            "${OUTPUT_DIR}"

      - name: Generate rebuild manifests
        env:
          SOURCE_DIR: ${{ github.workspace }}/source-under-test
          IMAGE: ${{ inputs.manager_image }}@${{ needs.rebuild.outputs.manager_digest }}
          OPERATOR_VERSION: ${{ inputs.version }}
          OUTPUT_DIR: ${{ github.workspace }}/dist/rebuild
        run: |
          set -euo pipefail
          bash .github-workflow-src/hack/ci/generate-channel-manifests.sh \
            "${SOURCE_DIR}" \
            "${IMAGE}" \
            "${OPERATOR_VERSION}" \
            "${OUTPUT_DIR}"

      - name: Package Helm chart (primary)
        env:
          CHART_VERSION: ${{ inputs.chart_version }}
          OWNER: ${{ github.repository_owner }}
          SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.ref }}
          MANAGER_IMAGE: ${{ inputs.manager_image }}
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          CONFIG_INIT_IMAGE: ${{ inputs.config_init_image }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          BACKUP_EXECUTOR_IMAGE: ${{ inputs.backup_executor_image }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_IMAGE: ${{ inputs.upgrade_executor_image }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          cp -a source-under-test/charts/openbao-operator "${work_dir}/openbao-operator"
          if [[ "${VERSION}" == edge-* ]]; then
            (
              cd .github-workflow-src
              CHART_DIR="${work_dir}/openbao-operator" GOFLAGS=-mod=vendor go run ./hack/tools/edge_chart
            )
          else
            CHANGELOG_FILE="${GITHUB_WORKSPACE}/source-under-test/CHANGELOG.md" \
              CHART_DIR="${work_dir}/openbao-operator" \
              CHART_VERSION="${CHART_VERSION}" \
              OWNER="${OWNER}" \
              bash .github-workflow-src/hack/ci/prepare-release-chart.sh
          fi
          helm lint "${work_dir}/openbao-operator"
          find "${work_dir}/openbao-operator" -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +
          helm package "${work_dir}/openbao-operator" -d dist/primary
          test -f "dist/primary/openbao-operator-${CHART_VERSION}.tgz"

      - name: Package Helm chart (rebuild)
        env:
          CHART_VERSION: ${{ inputs.chart_version }}
          OWNER: ${{ github.repository_owner }}
          SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.ref }}
          MANAGER_IMAGE: ${{ inputs.manager_image }}
          MANAGER_DIGEST: ${{ needs.rebuild.outputs.manager_digest }}
          CONFIG_INIT_IMAGE: ${{ inputs.config_init_image }}
          CONFIG_INIT_DIGEST: ${{ needs.rebuild.outputs.config_init_digest }}
          BACKUP_EXECUTOR_IMAGE: ${{ inputs.backup_executor_image }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.rebuild.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_IMAGE: ${{ inputs.upgrade_executor_image }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.rebuild.outputs.upgrade_executor_digest }}
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          cp -a source-under-test/charts/openbao-operator "${work_dir}/openbao-operator"
          if [[ "${VERSION}" == edge-* ]]; then
            (
              cd .github-workflow-src
              CHART_DIR="${work_dir}/openbao-operator" GOFLAGS=-mod=vendor go run ./hack/tools/edge_chart
            )
          else
            CHANGELOG_FILE="${GITHUB_WORKSPACE}/source-under-test/CHANGELOG.md" \
              CHART_DIR="${work_dir}/openbao-operator" \
              CHART_VERSION="${CHART_VERSION}" \
              OWNER="${OWNER}" \
              bash .github-workflow-src/hack/ci/prepare-release-chart.sh
          fi
          helm lint "${work_dir}/openbao-operator"
          find "${work_dir}/openbao-operator" -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +
          helm package "${work_dir}/openbao-operator" -d dist/rebuild
          test -f "dist/rebuild/openbao-operator-${CHART_VERSION}.tgz"

      - name: Generate SBOM (primary) - manager
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.manager_image }}@${{ needs.build.outputs.manager_digest }}
          format: spdx-json
          output-file: dist/primary/sbom-openbao-operator.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (primary) - config-init
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.config_init_image }}@${{ needs.build.outputs.config_init_digest }}
          format: spdx-json
          output-file: dist/primary/sbom-openbao-init.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (primary) - backup
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.backup_executor_image }}@${{ needs.build.outputs.backup_executor_digest }}
          format: spdx-json
          output-file: dist/primary/sbom-openbao-backup.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (primary) - upgrade
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.upgrade_executor_image }}@${{ needs.build.outputs.upgrade_executor_digest }}
          format: spdx-json
          output-file: dist/primary/sbom-openbao-upgrade.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (rebuild) - manager
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.manager_image }}@${{ needs.rebuild.outputs.manager_digest }}
          format: spdx-json
          output-file: dist/rebuild/sbom-openbao-operator.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (rebuild) - config-init
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.config_init_image }}@${{ needs.rebuild.outputs.config_init_digest }}
          format: spdx-json
          output-file: dist/rebuild/sbom-openbao-init.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (rebuild) - backup
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.backup_executor_image }}@${{ needs.rebuild.outputs.backup_executor_digest }}
          format: spdx-json
          output-file: dist/rebuild/sbom-openbao-backup.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (rebuild) - upgrade
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.upgrade_executor_image }}@${{ needs.rebuild.outputs.upgrade_executor_digest }}
          format: spdx-json
          output-file: dist/rebuild/sbom-openbao-upgrade.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize SBOM JSON (deterministic)
        env:
          SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
        run: |
          set -euo pipefail
          bash .github-workflow-src/hack/ci/normalize-spdx-json.sh \
            dist/primary/sbom-openbao-operator.spdx.json \
            dist/primary/sbom-openbao-init.spdx.json \
            dist/primary/sbom-openbao-backup.spdx.json \
            dist/primary/sbom-openbao-upgrade.spdx.json \
            dist/rebuild/sbom-openbao-operator.spdx.json \
            dist/rebuild/sbom-openbao-init.spdx.json \
            dist/rebuild/sbom-openbao-backup.spdx.json \
            dist/rebuild/sbom-openbao-upgrade.spdx.json

      - name: Generate deterministic checksums
        env:
          VERSION: ${{ inputs.version }}
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          set -euo pipefail
          (
            cd dist/primary
            sha256sum install.yaml crds.yaml > checksums.txt
            if [[ "${VERSION}" == edge-* ]]; then
              sha256sum "openbao-operator-${CHART_VERSION}.tgz" >> checksums.txt
            fi
          )
          (
            cd dist/rebuild
            sha256sum install.yaml crds.yaml > checksums.txt
            if [[ "${VERSION}" == edge-* ]]; then
              sha256sum "openbao-operator-${CHART_VERSION}.tgz" >> checksums.txt
            fi
          )

      - name: Verify byte reproducibility
        env:
          PRIMARY_DIR: dist/primary
          REBUILD_DIR: dist/rebuild
          MANAGER_DIGEST: ${{ needs.build.outputs.manager_digest }}
          MANAGER_REBUILD_DIGEST: ${{ needs.rebuild.outputs.manager_digest }}
          CONFIG_INIT_DIGEST: ${{ needs.build.outputs.config_init_digest }}
          CONFIG_INIT_REBUILD_DIGEST: ${{ needs.rebuild.outputs.config_init_digest }}
          BACKUP_EXECUTOR_DIGEST: ${{ needs.build.outputs.backup_executor_digest }}
          BACKUP_EXECUTOR_REBUILD_DIGEST: ${{ needs.rebuild.outputs.backup_executor_digest }}
          UPGRADE_EXECUTOR_DIGEST: ${{ needs.build.outputs.upgrade_executor_digest }}
          UPGRADE_EXECUTOR_REBUILD_DIGEST: ${{ needs.rebuild.outputs.upgrade_executor_digest }}
          REPRO_REQUIRED_FILES: >-
            install.yaml
            crds.yaml
            checksums.txt
            openbao-operator-${{ inputs.chart_version }}.tgz
            sbom-openbao-operator.spdx.json
            sbom-openbao-init.spdx.json
            sbom-openbao-backup.spdx.json
            sbom-openbao-upgrade.spdx.json
        run: bash .github-workflow-src/hack/ci/verify-byte-reproducibility.sh

      - name: Upload byte-verified channel assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.byte_artifact_name }}
          path: |
            dist/primary/install.yaml
            dist/primary/crds.yaml
            dist/primary/checksums.txt
            dist/primary/openbao-operator-${{ inputs.chart_version }}.tgz
            dist/primary/sbom-openbao-operator.spdx.json
            dist/primary/sbom-openbao-init.spdx.json
            dist/primary/sbom-openbao-backup.spdx.json
            dist/primary/sbom-openbao-upgrade.spdx.json
          retention-days: 7

  helm-edge-smoke:
    name: Install Packaged Edge Chart
    if: startsWith(inputs.version, 'edge-')
    runs-on: *runner
    timeout-minutes: 15
    needs: [verify-byte-reproducibility, verify-provenance]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout workflow helper sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}

      - name: Setup Helm
        uses: ./.github/actions/setup-helm

      - name: Setup Kubernetes CLI tools
        uses: ./.github/actions/setup-kubernetes-tools
        with:
          install-dir: bin/

      - name: Download verified chart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.byte_artifact_name }}
          path: dist/edge-chart

      - name: Install candidate chart without image overrides
        env:
          HELM_E2E_CHART: ${{ github.workspace }}/dist/edge-chart/openbao-operator-${{ inputs.chart_version }}.tgz
        run: bash hack/ci/helm-e2e-smoke.sh
