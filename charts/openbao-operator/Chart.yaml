apiVersion: v2
name: openbao-operator
description: >-
  OpenBao Operator installs the OpenBao Kubernetes operator and its required
  cluster-scoped resources.
type: application
version: 0.6.0
appVersion: 0.6.0
icon: >-
  https://raw.githubusercontent.com/kubebao/openbao-operator/main/website/static/img/brand/kubebao-github-avatar.png
home: https://github.com/kubebao/openbao-operator
sources:
  - https://github.com/kubebao/openbao-operator
keywords:
  - openbao
  - vault
  - secrets
  - operator
  - kubernetes
maintainers:
  - name: dc-tec
    url: https://github.com/dc-tec
kubeVersion: '>=1.33.0-0'
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: 'true'
  artifacthub.io/operatorCapabilities: Full Lifecycle
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: 'true'
  artifacthub.io/changes: |
    - kind: added
      description: "auth: isolate controller JWTs by target"
    - kind: added
      description: "backup: run bounded retention with the writer workload identity"
    - kind: added
      description: "backup: schedule disposable restore tests"
    - kind: added
      description: "certs: use native TLS certificate reload on OpenBao 2.7"
    - kind: added
      description: "networking: support IPv6 and dual-stack clusters"
    - kind: added
      description: "network: manage Cilium API-server egress"
    - kind: added
      description: "policies: reconcile administrator-approved OpenBao policies"
    - kind: added
      description: "restore: guard submission and manage administrator recovery"
    - kind: added
      description: "restore: provision retained and disposable recovery targets"
    - kind: added
      description: "self-init: add Secret inputs for raw bootstrap requests"
    - kind: added
      description: "storage: add nested S3 target options"
    - kind: added
      description: "tls: configure hybrid post-quantum key exchange"
    - kind: added
      description: "unseal: select the Azure Key Vault authentication method"
    - kind: fixed
      description: "admission: accept CSI leak-protection finalizers on managed PVCs"
    - kind: fixed
      description: "admission: accept the AKS control plane for PVC binding updates"
    - kind: fixed
      description: "admission: require delegation for read-replica cloud identities"
    - kind: fixed
      description: "backup: persist the initial scheduled backup deadline"
    - kind: fixed
      description: "certs: reject malformed CA key PEM without panicking"
    - kind: fixed
      description: "ci: decouple edge chart versions from releases"
    - kind: fixed
      description: "ci: discover historical attestations from published bundles"
    - kind: fixed
      description: "ci: look up upstream artifacts by name"
    - kind: fixed
      description: "ci: repair KubeBao release qualification and retries"
    - kind: fixed
      description: "ci: separate restore lanes and pin integration tooling"
    - kind: security
      description: "ci: update vulnerable release tooling dependencies"
    - kind: fixed
      description: "client: release shared state for deleted cluster lifetimes"
    - kind: fixed
      description: "cluster: resume interrupted peer removal safely"
    - kind: fixed
      description: "config: enforce OpenBao configuration version contracts"
    - kind: fixed
      description: "config: support authorized PROXY protocol sources"
    - kind: security
      description: "deps: patch release-please Handlebars vulnerabilities"
    - kind: fixed
      description: "deps: update Go and x/net security patches"
    - kind: fixed
      description: "devenv: support Go 1.27 export data in Staticcheck"
    - kind: fixed
      description: "ownership: bind resource mutations to observed identity"
    - kind: fixed
      description: "perf: exclude helper endpoints and follow restore recovery"
    - kind: fixed
      description: "provisioner: allow restore templates without unseal credential Secrets"
    - kind: fixed
      description: "restore: bound snapshot staging and disable executor retries"
    - kind: fixed
      description: "restore: expose KMS plugin settings in target templates"
    - kind: fixed
      description: "restore: separate disposable reader identity from backups"
    - kind: security
      description: "security: bind legacy image signatures to requested digests"
    - kind: security
      description: "security: enforce key strength and TLS transport policy"
    - kind: security
      description: "security: harden verification dependencies and CI controls"
    - kind: security
      description: "security: resolve Kubernetes registry credentials by scope"
    - kind: fixed
      description: "storage: block IPv6 cloud metadata endpoints"
    - kind: fixed
      description: "storage: retain custom CA trust in backup and restore executors"
    - kind: fixed
      description: "storage: use complete Azure Blob endpoint URLs"
    - kind: fixed
      description: "storage: use credential Secret regions for S3 signing"
    - kind: fixed
      description: "tls: validate external server certificate chains"
    - kind: fixed
      description: "upgrade: prove workload identity before blue-green cleanup"
    - kind: fixed
      description: "upgrade: retry against the current rendered image target"
    - kind: fixed
      description: "upgrade: scope rolling executor jobs to durable attempts"
    - kind: fixed
      description: "wrapper: wait for graceful child termination before killing"
    - kind: changed
      description: "metrics: scope restore state updates to target clusters"
  artifacthub.io/images: |
    - name: openbao-operator
      image: ghcr.io/kubebao/openbao-operator:0.6.0
    - name: openbao-init
      image: ghcr.io/kubebao/openbao-init:0.6.0
    - name: openbao-backup
      image: ghcr.io/kubebao/openbao-backup:0.6.0
    - name: openbao-upgrade
      image: ghcr.io/kubebao/openbao-upgrade:0.6.0
  artifacthub.io/crds: |
    - kind: OpenBaoCluster
      version: v1alpha1
      name: openbaoclusters.openbao.org
      displayName: OpenBaoCluster
      description: Manages OpenBao cluster lifecycle, configuration, upgrades, and backups.
    - kind: OpenBaoTenant
      version: v1alpha1
      name: openbaotenants.openbao.org
      displayName: OpenBaoTenant
      description: Declares tenant onboarding and target namespace provisioning.
    - kind: OpenBaoRestore
      version: v1alpha1
      name: openbaorestores.openbao.org
      displayName: OpenBaoRestore
      description: Requests restore operations from snapshot backups.
  artifacthub.io/crdsExamples: |
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoCluster
      metadata:
        name: openbaocluster-sample
      spec:
        version: "2.6.4"
        replicas: 3
        profile: Development
        tls:
          enabled: true
          rotationPeriod: "720h"
        storage:
          size: "10Gi"
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoTenant
      metadata:
        name: openbaocluster-full-tenant
        namespace: openbao-operator-system
      spec:
        targetNamespace: openbaocluster-full
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoRestore
      metadata:
        name: openbaorestore-sample
      spec:
        cluster: openbaocluster-sample
        source:
          target:
            endpoint: https://s3.amazonaws.com
            bucket: openbao-backups
            region: us-east-1
            credentialsSecretRef:
              name: s3-credentials
          key: clusters/openbaocluster-sample/2025-01-01-120000.snap
  artifacthub.io/maintainers: |
    - name: dc-tec
      email: roel@decort.tech
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.kubebao.org/
    - name: Source
      url: https://github.com/kubebao/openbao-operator
    - name: Issues
      url: https://github.com/kubebao/openbao-operator/issues
    - name: Discussions
      url: https://github.com/kubebao/openbao-operator/discussions
    - name: OpenBao Docs
      url: https://openbao.org/docs/
