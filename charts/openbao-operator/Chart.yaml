apiVersion: v2
name: openbao-operator
description: >-
  OpenBao Operator installs the OpenBao Kubernetes operator and its required
  cluster-scoped resources.
type: application
version: 0.7.0-rc.2
appVersion: 0.7.0-rc.2
icon: >-
  https://raw.githubusercontent.com/kubebao/openbao-operator/main/website/static/img/brand/kubebao-github-avatar.png
home: https://github.com/kubebao/openbao-operator
sources:
  - https://github.com/kubebao/openbao-operator
keywords:
  - openbao
  - vault
  - secrets
  - operator
  - kubernetes
maintainers:
  - name: dc-tec
    url: https://github.com/dc-tec
kubeVersion: '>=1.34.0-0'
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: 'true'
  artifacthub.io/operatorCapabilities: Full Lifecycle
  artifacthub.io/prerelease: "true"
  artifacthub.io/containsSecurityUpdates: 'false'
  artifacthub.io/changes: |
    - kind: fixed
      description: "backup: preserve attempt receipts across controller restarts"
    - kind: fixed
      description: "docs: pin API fallback to the merged source"
    - kind: fixed
      description: "migration: require published 0.6.2 as migration source"
    - kind: fixed
      description: "restore: allow explicit snapshot budgets above the 8 GiB default"
    - kind: fixed
      description: "upgrade: guard legacy crossings and repair migration qualification"
    - kind: fixed
      description: "upgrade: wait for Raft catch-up between voter replacements"
    - kind: fixed
      description: "workload: allow longer OpenBao startup probe budgets"
    - kind: fixed
      description: "workload: preserve promoted handoffs and heartbeat freshness"
  artifacthub.io/images: |
    - name: openbao-operator
      image: ghcr.io/kubebao/openbao-operator:0.7.0-rc.2
    - name: openbao-init
      image: ghcr.io/kubebao/openbao-init:0.7.0-rc.2
    - name: openbao-backup
      image: ghcr.io/kubebao/openbao-backup:0.7.0-rc.2
    - name: openbao-upgrade
      image: ghcr.io/kubebao/openbao-upgrade:0.7.0-rc.2
  artifacthub.io/crds: |
    - kind: OpenBaoCluster
      version: v1alpha1
      name: openbaoclusters.kubebao.org
      displayName: OpenBaoCluster
      description: Manages OpenBao cluster lifecycle, configuration, upgrades, and backups.
    - kind: OpenBaoTenant
      version: v1alpha1
      name: openbaotenants.kubebao.org
      displayName: OpenBaoTenant
      description: Declares tenant onboarding and target namespace provisioning.
    - kind: OpenBaoRestore
      version: v1alpha1
      name: openbaorestores.kubebao.org
      displayName: OpenBaoRestore
      description: Requests restore operations from snapshot backups.
  artifacthub.io/crdsExamples: |
    - apiVersion: kubebao.org/v1alpha1
      kind: OpenBaoCluster
      metadata:
        name: openbaocluster-sample
      spec:
        version: "2.6.5"
        replicas: 3
        profile: Development
        tls:
          enabled: true
          rotationPeriod: "720h"
        storage:
          size: "10Gi"
    - apiVersion: kubebao.org/v1alpha1
      kind: OpenBaoTenant
      metadata:
        name: openbaocluster-full-tenant
        namespace: openbao-operator-system
      spec:
        targetNamespace: openbaocluster-full
    - apiVersion: kubebao.org/v1alpha1
      kind: OpenBaoRestore
      metadata:
        name: openbaorestore-sample
      spec:
        cluster: openbaocluster-sample
        source:
          target:
            endpoint: https://s3.amazonaws.com
            bucket: openbao-backups
            region: us-east-1
            credentialsSecretRef:
              name: s3-credentials
          key: clusters/openbaocluster-sample/2025-01-01-120000.snap
  artifacthub.io/maintainers: |
    - name: dc-tec
      email: roel@decort.tech
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.kubebao.org/
    - name: Source
      url: https://github.com/kubebao/openbao-operator
    - name: Issues
      url: https://github.com/kubebao/openbao-operator/issues
    - name: Discussions
      url: https://github.com/kubebao/openbao-operator/discussions
    - name: OpenBao Docs
      url: https://openbao.org/docs/
