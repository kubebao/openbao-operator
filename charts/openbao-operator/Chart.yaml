apiVersion: v2
name: openbao-operator
description: >-
  OpenBao Operator installs the OpenBao Kubernetes operator and its required
  cluster-scoped resources.
type: application
version: 0.5.1
appVersion: 0.5.1
icon: >-
  https://raw.githubusercontent.com/kubebao/openbao-operator/main/website/static/img/brand/logo.svg
home: https://github.com/kubebao/openbao-operator
sources:
  - https://github.com/kubebao/openbao-operator
keywords:
  - openbao
  - vault
  - secrets
  - operator
  - kubernetes
maintainers:
  - name: dc-tec
    url: https://github.com/dc-tec
kubeVersion: '>=1.33.0-0'
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: 'true'
  artifacthub.io/operatorCapabilities: Full Lifecycle
  artifacthub.io/prerelease: "false"
  artifacthub.io/containsSecurityUpdates: 'false'
  artifacthub.io/changes: |
    - kind: added
      description: "compat: qualify OpenBao 2.7 external seal plugins"
    - kind: fixed
      description: "api: clarify missing TLS rotation period validation"
    - kind: fixed
      description: "backup: abort partial uploads when the snapshot stream fails"
    - kind: fixed
      description: "backup: keep the newest snapshot when applying retention"
    - kind: fixed
      description: "backup: limit retention to scheduled backup keys"
    - kind: fixed
      description: "backup: preserve trigger before job creation"
    - kind: fixed
      description: "metrics: clear finalized reconciliation series"
    - kind: fixed
      description: "metrics: keep cluster phase gauges one-hot"
    - kind: fixed
      description: "readiness: require synchronized caches and fresh admission checks"
    - kind: fixed
      description: "startup: validate platform discovery and return errors"
    - kind: fixed
      description: "status: preserve restore state in final adminops patch"
    - kind: fixed
      description: "upgrade: correct peer identity, rollback retries, and rollout verification"
    - kind: fixed
      description: "upgrade: guard blue/green rollback and preserve active inputs"
    - kind: fixed
      description: "upgrade: limit blue/green abort to phases before promotion"
    - kind: fixed
      description: "upgrade: retry transient rolling partition conflicts"
    - kind: changed
      description: "kube: reuse apply responses for ownership verification"
    - kind: changed
      description: "raft: avoid redundant Autopilot configuration writes"
  # Last published release; prepare-release-chart.sh replaces this metadata for each new release.
  artifacthub.io/images: |
    - name: openbao-operator
      image: ghcr.io/dc-tec/openbao-operator:0.5.1
    - name: openbao-init
      image: ghcr.io/dc-tec/openbao-init:0.5.1
    - name: openbao-backup
      image: ghcr.io/dc-tec/openbao-backup:0.5.1
    - name: openbao-upgrade
      image: ghcr.io/dc-tec/openbao-upgrade:0.5.1
  artifacthub.io/crds: |
    - kind: OpenBaoCluster
      version: v1alpha1
      name: openbaoclusters.openbao.org
      displayName: OpenBaoCluster
      description: Manages OpenBao cluster lifecycle, configuration, upgrades, and backups.
    - kind: OpenBaoTenant
      version: v1alpha1
      name: openbaotenants.openbao.org
      displayName: OpenBaoTenant
      description: Declares tenant onboarding and target namespace provisioning.
    - kind: OpenBaoRestore
      version: v1alpha1
      name: openbaorestores.openbao.org
      displayName: OpenBaoRestore
      description: Requests restore operations from snapshot backups.
  artifacthub.io/crdsExamples: |
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoCluster
      metadata:
        name: openbaocluster-sample
      spec:
        version: "2.6.3"
        replicas: 3
        profile: Development
        tls:
          enabled: true
          rotationPeriod: "720h"
        storage:
          size: "10Gi"
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoTenant
      metadata:
        name: openbaocluster-full-tenant
        namespace: openbao-operator-system
      spec:
        targetNamespace: openbaocluster-full
    - apiVersion: openbao.org/v1alpha1
      kind: OpenBaoRestore
      metadata:
        name: openbaorestore-sample
      spec:
        cluster: openbaocluster-sample
        source:
          target:
            endpoint: https://s3.amazonaws.com
            bucket: openbao-backups
            region: us-east-1
            credentialsSecretRef:
              name: s3-credentials
          key: clusters/openbaocluster-sample/2025-01-01-120000.snap
  artifacthub.io/maintainers: |
    - name: dc-tec
      email: roel@decort.tech
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.kubebao.org/
    - name: Source
      url: https://github.com/kubebao/openbao-operator
    - name: Issues
      url: https://github.com/kubebao/openbao-operator/issues
    - name: Discussions
      url: https://github.com/kubebao/openbao-operator/discussions
    - name: OpenBao Docs
      url: https://openbao.org/docs/
