{{- if .Values.admissionPolicies.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "openbao-operator.fullname" . }}-openbao-restrict-controller-secret-writes
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
  variables:
    - name: operator_namespace
      expression: |-
        '{{ .Release.Namespace }}'
    - name: controller_serviceaccount_name
      expression: |-
        '{{ include "openbao-operator.controllerServiceAccountName" . }}'
    - name: controller_principal
      expression: |-
        'system:serviceaccount:' + variables.operator_namespace + ':' + variables.controller_serviceaccount_name
    - name: is_controller
      expression: |-
        request.userInfo.username == variables.controller_principal
    - name: secret_name
      expression: |-
        request.operation == "DELETE" ?
          ((
            oldObject != null &&
            has(oldObject.metadata) &&
            oldObject.metadata.name != ''
          ) ? oldObject.metadata.name : request.name) :
          ((
            object != null &&
            has(object.metadata) &&
            object.metadata.name != ''
          ) ? object.metadata.name : request.name)
    - name: secret_labels
      expression: |-
        request.operation == "DELETE" ?
          ((
            oldObject != null &&
            has(oldObject.metadata) &&
            has(oldObject.metadata.labels)
          ) ? oldObject.metadata.labels : {}) :
          ((
            object != null &&
            has(object.metadata) &&
            has(object.metadata.labels)
          ) ? object.metadata.labels : {})
    - name: cluster_name
      expression: |-
        ("openbao.org/cluster" in variables.secret_labels) ?
          variables.secret_labels["openbao.org/cluster"] : ""
    - name: has_required_labels
      expression: |-
        variables.cluster_name != "" && ("app.kubernetes.io/managed-by" in variables.secret_labels) && variables.secret_labels["app.kubernetes.io/managed-by"] == "openbao-operator" && (
          !("app.kubernetes.io/name" in variables.secret_labels) ||
          variables.secret_labels["app.kubernetes.io/name"] == "openbao"
        ) && (
          !("app.kubernetes.io/instance" in variables.secret_labels) ||
          variables.secret_labels["app.kubernetes.io/instance"] == variables.cluster_name
        )
    - name: has_allowed_name
      expression: |-
        variables.cluster_name != "" && variables.secret_name in [
          variables.cluster_name + "-tls-ca",
          variables.cluster_name + "-tls-server",
          variables.cluster_name + "-root-token",
          variables.cluster_name + "-unseal-key"
        ]
  validations:
    - expression: |-
        !variables.is_controller || (
          variables.has_required_labels &&
          variables.has_allowed_name
        )
      message: "The controller can only create, update, or delete operator-managed Secret objects with the fixed cluster-scoped names and labels."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "openbao-operator.fullname" . }}-openbao-restrict-controller-secret-writes-binding
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
spec:
  policyName: {{ include "openbao-operator.fullname" . }}-openbao-restrict-controller-secret-writes
  validationActions: [Deny]
  matchResources:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
{{- end }}
