{{- if .Values.admissionPolicies.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "openbao-operator.fullname" . }}-openbao-lock-managed-resource-mutations
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
  annotations:
    openbao.org/admission-policy-fingerprint: sha256:40a9dc3487c64f06948c06332195145cca5ee5554bd7e5970f385ad17b3f51cf
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets", "configmaps", "services", "serviceaccounts", "pods", "endpoints", "persistentvolumeclaims"]
      - apiGroups: ["discovery.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["endpointslices"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["jobs"]
      - apiGroups: ["policy"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["poddisruptionbudgets"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["roles", "rolebindings"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["ingresses", "networkpolicies"]
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["httproutes", "tlsroutes", "backendtlspolicies"]
      - apiGroups: ["monitoring.coreos.com"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["servicemonitors"]
  variables:
    - name: operator_namespace
      expression: >-
        '{{ .Release.Namespace }}'
    - name: controller_serviceaccount_name
      expression: >-
        '{{ include "openbao-operator.controllerServiceAccountName" . }}'
    - name: provisioner_serviceaccount_name
      expression: >-
        '{{ include "openbao-operator.provisionerServiceAccountName" . }}'
    - name: controller_principal
      expression: >-
        'system:serviceaccount:' + variables.operator_namespace + ':' + variables.controller_serviceaccount_name
    - name: provisioner_principal
      expression: >-
        'system:serviceaccount:' + variables.operator_namespace + ':' + variables.provisioner_serviceaccount_name
    - name: is_openbao_managed_by_operator
      expression: >-
        request.operation == "DELETE" ?
          (oldObject != null &&
            has(oldObject.metadata) &&
            has(oldObject.metadata.labels) &&
            ("app.kubernetes.io/managed-by" in oldObject.metadata.labels) &&
            oldObject.metadata.labels["app.kubernetes.io/managed-by"] == "openbao-operator") :
          ((object != null &&
              has(object.metadata) &&
              has(object.metadata.labels) &&
              ("app.kubernetes.io/managed-by" in object.metadata.labels) &&
              object.metadata.labels["app.kubernetes.io/managed-by"] == "openbao-operator") ||
            (oldObject != null &&
              has(oldObject.metadata) &&
              has(oldObject.metadata.labels) &&
              ("app.kubernetes.io/managed-by" in oldObject.metadata.labels) &&
              oldObject.metadata.labels["app.kubernetes.io/managed-by"] == "openbao-operator"))
    - name: has_openbao_specific_label
      expression: >-
        request.operation == "DELETE" ?
          (oldObject != null &&
            has(oldObject.metadata) &&
            has(oldObject.metadata.labels) &&
            oldObject.metadata.labels.exists(k, v, k.startsWith("openbao.org/"))) :
          ((object != null &&
              has(object.metadata) &&
              has(object.metadata.labels) &&
              object.metadata.labels.exists(k, v, k.startsWith("openbao.org/"))) ||
            (oldObject != null &&
              has(oldObject.metadata) &&
              has(oldObject.metadata.labels) &&
              oldObject.metadata.labels.exists(k, v, k.startsWith("openbao.org/"))))
    - name: is_managed
      expression: >-
        variables.is_openbao_managed_by_operator && variables.has_openbao_specific_label
    - name: is_operator_controller
      expression: >-
        request.userInfo.username == variables.controller_principal
    - name: is_operator_provisioner
      expression: >-
        request.userInfo.username == variables.provisioner_principal
    - name: is_kube_controller_manager
      expression: >-
        request.userInfo.username == "system:kube-controller-manager" ||
        request.userInfo.username == "system:serviceaccount:kube-system:kube-controller-manager"
    - name: is_kube_scheduler
      expression: >-
        request.userInfo.username == "system:kube-scheduler" ||
        request.userInfo.username == "system:serviceaccount:kube-system:kube-scheduler"
    # Azure Kubernetes Service runs its managed control plane, including the
    # scheduler and the volume controllers, as the user "aksService". Only the
    # narrowly scoped PVC binding update below accepts it.
    - name: is_aks_control_plane
      expression: >-
        request.userInfo.username == "aksService"
    - name: is_storage_provisioner_serviceaccount
      expression: >-
        request.userInfo.username.matches("^system:serviceaccount:[^:]+:.*(csi|provisioner).*$")
    - name: is_persistent_volume_binder
      expression: >-
        request.userInfo.username == "system:serviceaccount:kube-system:persistent-volume-binder"
    - name: is_pvc_protection_controller
      expression: >-
        request.userInfo.username == "system:serviceaccount:kube-system:pvc-protection-controller"
    - name: is_system_controller
      expression: >-
        request.userInfo.username.startsWith("system:controller:")
    - name: is_statefulset_controller
      expression: >-
        request.userInfo.username == "system:controller:statefulset-controller" ||
        request.userInfo.username == "system:serviceaccount:kube-system:statefulset-controller"
    # Some controller managers use dedicated ServiceAccount credentials for the namespace controller.
    - name: is_namespace_controller_serviceaccount
      expression: >-
        request.userInfo.username == "system:serviceaccount:kube-system:namespace-controller"
    # K3s/K3d and some distributions use service accounts for GC instead of system:controller:*
    - name: is_garbage_collector_sa
      expression: >-
        request.userInfo.username in [
          "system:serviceaccount:kube-system:generic-garbage-collector",
          "system:serviceaccount:kube-system:resourcequota-controller",
          "system:serviceaccount:kube-system:statefulset-controller",
          "system:serviceaccount:kube-system:replicaset-controller",
          "system:serviceaccount:kube-system:job-controller",
          "system:serviceaccount:kube-system:cronjob-controller",
          "system:serviceaccount:kube-system:ttl-after-finished-controller"
        ]
    - name: is_kube_system_controller
      expression: >-
        request.userInfo.groups.exists(g, g == "system:serviceaccounts:kube-system") ||
        request.userInfo.username.startsWith("system:serviceaccount:kube-system:")
    - name: is_endpoints_controller_request
      expression: >-
        request.resource.resource in ["endpoints", "endpointslices"]
    - name: is_pod_request
      expression: >-
        request.kind.group == "" && request.kind.kind == "Pod"
    - name: is_job_request
      expression: >-
        request.kind.group == "batch" && request.kind.kind == "Job"
    - name: is_service_request
      expression: >-
        request.kind.group == "" && request.kind.kind == "Service"
    - name: is_pvc_request
      expression: >-
        request.kind.group == "" && request.kind.kind == "PersistentVolumeClaim"
    - name: has_current_owner_uid_annotation
      expression: >-
        object != null &&
        has(object.metadata) &&
        has(object.metadata.annotations) &&
        ("openbao.org/owner-uid" in object.metadata.annotations)
    - name: has_old_owner_uid_annotation
      expression: >-
        oldObject != null &&
        has(oldObject.metadata) &&
        has(oldObject.metadata.annotations) &&
        ("openbao.org/owner-uid" in oldObject.metadata.annotations)
    - name: owner_uid_annotation_allowed
      expression: >-
        variables.is_operator_controller ||
        variables.is_operator_provisioner ||
        variables.is_kube_controller_manager ||
        variables.is_system_controller ||
        variables.is_kube_system_controller
    - name: is_service_monitor_request
      expression: >-
        request.kind.group == "monitoring.coreos.com" && request.kind.kind == "ServiceMonitor"
    - name: current_service_monitor_is_operator_owned
      expression: >-
        object != null &&
        has(object.metadata) &&
        request.namespace != "" &&
        object.metadata.name.endsWith("-metrics") &&
        has(object.metadata.labels) &&
        ("app.kubernetes.io/managed-by" in object.metadata.labels) &&
        object.metadata.labels["app.kubernetes.io/managed-by"] == "openbao-operator" &&
        ("app.kubernetes.io/component" in object.metadata.labels) &&
        object.metadata.labels["app.kubernetes.io/component"] == "metrics" &&
        ("openbao.org/component" in object.metadata.labels) &&
        object.metadata.labels["openbao.org/component"] == "metrics" &&
        ("openbao.org/cluster" in object.metadata.labels) &&
        object.metadata.labels["openbao.org/cluster"] != "" &&
        object.metadata.name == object.metadata.labels["openbao.org/cluster"] + "-metrics" &&
        has(object.metadata.ownerReferences) &&
        object.metadata.ownerReferences.exists(ref,
          ref.apiVersion == "openbao.org/v1alpha1" &&
          ref.kind == "OpenBaoCluster" &&
          ref.name == object.metadata.labels["openbao.org/cluster"] &&
          has(ref.controller) &&
          ref.controller == true)
    - name: old_service_monitor_is_operator_owned
      expression: >-
        oldObject != null &&
        has(oldObject.metadata) &&
        request.namespace != "" &&
        oldObject.metadata.name.endsWith("-metrics") &&
        has(oldObject.metadata.labels) &&
        ("app.kubernetes.io/managed-by" in oldObject.metadata.labels) &&
        oldObject.metadata.labels["app.kubernetes.io/managed-by"] == "openbao-operator" &&
        ("app.kubernetes.io/component" in oldObject.metadata.labels) &&
        oldObject.metadata.labels["app.kubernetes.io/component"] == "metrics" &&
        ("openbao.org/component" in oldObject.metadata.labels) &&
        oldObject.metadata.labels["openbao.org/component"] == "metrics" &&
        ("openbao.org/cluster" in oldObject.metadata.labels) &&
        oldObject.metadata.labels["openbao.org/cluster"] != "" &&
        oldObject.metadata.name == oldObject.metadata.labels["openbao.org/cluster"] + "-metrics" &&
        has(oldObject.metadata.ownerReferences) &&
        oldObject.metadata.ownerReferences.exists(ref,
          ref.apiVersion == "openbao.org/v1alpha1" &&
          ref.kind == "OpenBaoCluster" &&
          ref.name == oldObject.metadata.labels["openbao.org/cluster"] &&
          has(ref.controller) &&
          ref.controller == true)
    - name: is_kubelet_node
      expression: >-
        request.userInfo.username.startsWith("system:node:")
    - name: pod_cluster_name
      expression: >-
        object != null && has(object.metadata) && has(object.metadata.labels) && ("openbao.org/cluster" in object.metadata.labels) ?
          object.metadata.labels["openbao.org/cluster"] :
          (object != null && has(object.metadata) && has(object.metadata.labels) && ("app.kubernetes.io/instance" in object.metadata.labels) ?
            object.metadata.labels["app.kubernetes.io/instance"] : "")
    - name: is_cluster_serviceaccount
      expression: >-
        variables.pod_cluster_name != "" &&
        request.userInfo.username ==
          ("system:serviceaccount:" + request.namespace + ":" + variables.pod_cluster_name + "-serviceaccount")
    - name: is_service_registration_label_update
      expression: >-
        variables.is_pod_request &&
        request.operation == "UPDATE" &&
        variables.is_cluster_serviceaccount &&
        object.spec == oldObject.spec &&
        (has(object.metadata.annotations) == has(oldObject.metadata.annotations) &&
          (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations)) &&
        (has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
          (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences)) &&
        (has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) &&
          (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers)) &&
        has(object.metadata.labels) &&
        has(oldObject.metadata.labels) &&
        (
          (
            object.metadata.labels.all(k, v,
              k in [
                "openbao-active",
                "openbao-initialized",
                "openbao-sealed",
                "openbao-perf-standby",
                "openbao-version"
              ] || (k in oldObject.metadata.labels && oldObject.metadata.labels[k] == v)) &&
            oldObject.metadata.labels.all(k, v,
              k in [
                "openbao-active",
                "openbao-initialized",
                "openbao-sealed",
                "openbao-perf-standby",
                "openbao-version"
              ] || (k in object.metadata.labels && object.metadata.labels[k] == v))
          )
        )
    - name: is_kube_system_pod_finalizer_update
      expression: >-
        variables.is_pod_request &&
        request.operation == "UPDATE" &&
        variables.is_kube_system_controller &&
        object.spec == oldObject.spec &&
        (has(object.metadata.labels) == has(oldObject.metadata.labels) &&
          (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels)) &&
        (has(object.metadata.annotations) == has(oldObject.metadata.annotations) &&
          (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations)) &&
        (has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
          (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences)) &&
        (has(object.metadata.finalizers) || has(oldObject.metadata.finalizers)) &&
        (!has(object.metadata.finalizers) || !has(oldObject.metadata.finalizers) || object.metadata.finalizers != oldObject.metadata.finalizers)
    - name: is_kube_system_job_finalizer_update
      expression: >-
        variables.is_job_request &&
        request.operation == "UPDATE" &&
        (variables.is_kube_controller_manager || variables.is_system_controller || variables.is_kube_system_controller || variables.is_garbage_collector_sa) &&
        has(oldObject.metadata.deletionTimestamp) &&
        object.spec == oldObject.spec &&
        object.status == oldObject.status &&
        (has(object.metadata.labels) == has(oldObject.metadata.labels) &&
          (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels)) &&
        (has(object.metadata.annotations) == has(oldObject.metadata.annotations) &&
          (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations)) &&
        (has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
          (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences)) &&
        (has(object.metadata.finalizers) || has(oldObject.metadata.finalizers)) &&
        (!has(object.metadata.finalizers) || !has(oldObject.metadata.finalizers) || object.metadata.finalizers != oldObject.metadata.finalizers)
    - name: service_new_annotations
      expression: >-
        (object != null && has(object.metadata) && has(object.metadata.annotations)) ? object.metadata.annotations : {}
    - name: service_old_annotations
      expression: >-
        (oldObject != null && has(oldObject.metadata) && has(oldObject.metadata.annotations)) ? oldObject.metadata.annotations : {}
    - name: pvc_new_annotations
      expression: >-
        (object != null && has(object.metadata) && has(object.metadata.annotations)) ? object.metadata.annotations : {}
    - name: pvc_old_annotations
      expression: >-
        (oldObject != null && has(oldObject.metadata) && has(oldObject.metadata.annotations)) ? oldObject.metadata.annotations : {}
    - name: pvc_new_finalizers
      expression: >-
        (object != null && has(object.metadata) && has(object.metadata.finalizers)) ? object.metadata.finalizers : []
    - name: pvc_old_finalizers
      expression: >-
        (oldObject != null && has(oldObject.metadata) && has(oldObject.metadata.finalizers)) ? oldObject.metadata.finalizers : []
    - name: is_kube_system_service_metadata_update
      expression: >-
        variables.is_service_request &&
        request.operation == "UPDATE" &&
        variables.is_kube_system_controller &&
        object.spec == oldObject.spec &&
        (has(object.metadata.labels) == has(oldObject.metadata.labels) &&
          (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels)) &&
        (has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
          (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences)) &&
        variables.service_new_annotations.all(k, v,
          !k.startsWith("openbao.org/") ||
          (k in variables.service_old_annotations && variables.service_old_annotations[k] == v)) &&
        variables.service_old_annotations.all(k, v,
          !k.startsWith("openbao.org/") ||
          (k in variables.service_new_annotations && variables.service_new_annotations[k] == v))
    - name: is_storage_pvc_binding_update
      expression: >-
        variables.is_pvc_request &&
        request.operation == "UPDATE" &&
        (variables.is_kube_scheduler ||
          variables.is_aks_control_plane ||
          variables.is_kube_controller_manager ||
          variables.is_persistent_volume_binder ||
          variables.is_pvc_protection_controller ||
          variables.is_storage_provisioner_serviceaccount) &&
        object != null &&
        oldObject != null &&
        object.metadata.name == oldObject.metadata.name &&
        object.metadata.namespace == oldObject.metadata.namespace &&
        object.status == oldObject.status &&
        (has(object.metadata.labels) == has(oldObject.metadata.labels) &&
          (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels)) &&
        (has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) &&
          (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences)) &&
        variables.pvc_new_finalizers.all(f,
          f in variables.pvc_old_finalizers ||
          f in ["kubernetes.io/pvc-protection", "external-provisioner.volume.kubernetes.io/finalizer"]) &&
        variables.pvc_old_finalizers.all(f,
          f in variables.pvc_new_finalizers ||
          f in ["kubernetes.io/pvc-protection", "external-provisioner.volume.kubernetes.io/finalizer"]) &&
        variables.pvc_new_annotations.all(k, v,
          !k.startsWith("openbao.org/") ||
          (k in variables.pvc_old_annotations && variables.pvc_old_annotations[k] == v)) &&
        variables.pvc_old_annotations.all(k, v,
          !k.startsWith("openbao.org/") ||
          (k in variables.pvc_new_annotations && variables.pvc_new_annotations[k] == v)) &&
        object.spec.accessModes == oldObject.spec.accessModes &&
        object.spec.resources == oldObject.spec.resources &&
        (has(object.spec.storageClassName) == has(oldObject.spec.storageClassName) &&
          (!has(object.spec.storageClassName) || object.spec.storageClassName == oldObject.spec.storageClassName)) &&
        (has(object.spec.volumeMode) == has(oldObject.spec.volumeMode) &&
          (!has(object.spec.volumeMode) || object.spec.volumeMode == oldObject.spec.volumeMode)) &&
        (has(object.spec.selector) == has(oldObject.spec.selector) &&
          (!has(object.spec.selector) || object.spec.selector == oldObject.spec.selector)) &&
        (has(object.spec.dataSource) == has(oldObject.spec.dataSource) &&
          (!has(object.spec.dataSource) || object.spec.dataSource == oldObject.spec.dataSource)) &&
        (has(object.spec.dataSourceRef) == has(oldObject.spec.dataSourceRef) &&
          (!has(object.spec.dataSourceRef) || object.spec.dataSourceRef == oldObject.spec.dataSourceRef)) &&
        (
          (!has(object.spec.volumeName) && !has(oldObject.spec.volumeName)) ||
          (has(object.spec.volumeName) && has(oldObject.spec.volumeName) && object.spec.volumeName == oldObject.spec.volumeName) ||
          (has(object.spec.volumeName) && object.spec.volumeName != "" && (!has(oldObject.spec.volumeName) || oldObject.spec.volumeName == ""))
        )
    - name: maintenance_enabled
      expression: >-
        request.operation == "DELETE" ?
          (oldObject != null &&
            has(oldObject.metadata) &&
            has(oldObject.metadata.annotations) &&
            ("openbao.org/maintenance" in oldObject.metadata.annotations) &&
            oldObject.metadata.annotations["openbao.org/maintenance"] == "true") :
          ((object != null &&
              has(object.metadata) &&
              has(object.metadata.annotations) &&
              ("openbao.org/maintenance" in object.metadata.annotations) &&
              object.metadata.annotations["openbao.org/maintenance"] == "true") ||
            (oldObject != null &&
              has(oldObject.metadata) &&
              has(oldObject.metadata.annotations) &&
              ("openbao.org/maintenance" in oldObject.metadata.annotations) &&
              oldObject.metadata.annotations["openbao.org/maintenance"] == "true"))
    - name: maintenance_current_labels
      expression: >-
        (object != null && has(object.metadata) && has(object.metadata.labels)) ? object.metadata.labels : {}
    - name: maintenance_old_labels
      expression: >-
        (oldObject != null && has(oldObject.metadata) && has(oldObject.metadata.labels)) ? oldObject.metadata.labels : {}
    - name: maintenance_cluster_name
      expression: >-
        request.operation == "CREATE" ?
          ("openbao.org/cluster" in variables.maintenance_current_labels ?
            variables.maintenance_current_labels["openbao.org/cluster"] :
            ("app.kubernetes.io/instance" in variables.maintenance_current_labels ?
              variables.maintenance_current_labels["app.kubernetes.io/instance"] : "")) :
          ("openbao.org/cluster" in variables.maintenance_old_labels ?
            variables.maintenance_old_labels["openbao.org/cluster"] :
            ("app.kubernetes.io/instance" in variables.maintenance_old_labels ?
              variables.maintenance_old_labels["app.kubernetes.io/instance"] : ""))
    - name: maintenance_authorized
      expression: >-
        variables.maintenance_enabled &&
        request.namespace != "" &&
        variables.maintenance_cluster_name != "" &&
        authorizer.group("openbao.org").
          resource("openbaoclusters").
          namespace(request.namespace).
          name(variables.maintenance_cluster_name).
          check("maintenance").
          allowed()
  validations:
    - expression: >-
        request.operation == "DELETE" ||
        variables.owner_uid_annotation_allowed ||
        (
          !variables.has_current_owner_uid_annotation &&
          !variables.has_old_owner_uid_annotation
        ) ||
        (
          request.operation == "UPDATE" &&
          variables.has_current_owner_uid_annotation &&
          variables.has_old_owner_uid_annotation &&
          object.metadata.annotations["openbao.org/owner-uid"] == oldObject.metadata.annotations["openbao.org/owner-uid"]
        )
      message: The openbao.org/owner-uid annotation is reserved for OpenBao Operator managed-resource provenance.
    - expression: >-
        !(variables.is_operator_controller || variables.is_operator_provisioner) ||
        !variables.is_service_monitor_request ||
        (
          (request.operation == "CREATE" && variables.current_service_monitor_is_operator_owned) ||
          (request.operation == "UPDATE" && variables.current_service_monitor_is_operator_owned && variables.old_service_monitor_is_operator_owned) ||
          (request.operation == "DELETE" && variables.old_service_monitor_is_operator_owned)
        )
      message: The operator can only create, update, or delete ServiceMonitors that match the OpenBao metrics ownership shape.
    - expression: >-
        !variables.is_managed ||
        variables.is_operator_controller ||
        variables.is_operator_provisioner ||
        (variables.is_kube_controller_manager && (request.operation == "DELETE" || request.resource.resource == "pods")) ||
        (variables.is_system_controller && request.operation == "DELETE") ||
        (variables.is_namespace_controller_serviceaccount && request.operation == "DELETE") ||
        (variables.is_garbage_collector_sa && (request.operation == "DELETE" || request.operation == "UPDATE")) ||
        (variables.is_system_controller && request.resource.resource == "pods") ||
        (variables.is_system_controller && variables.is_endpoints_controller_request) ||
        (variables.is_kube_system_controller && request.resource.resource == "pods" && (request.operation == "CREATE" || request.operation == "DELETE")) ||
        (variables.is_statefulset_controller && request.resource.resource == "persistentvolumeclaims" && request.operation == "CREATE") ||
        variables.is_storage_pvc_binding_update ||
        (variables.is_kube_system_controller && variables.is_endpoints_controller_request) ||
        variables.is_kube_system_service_metadata_update ||
        (variables.is_pod_request && variables.is_kubelet_node && request.operation == "DELETE") ||
        variables.is_service_registration_label_update ||
        variables.is_kube_system_pod_finalizer_update ||
        variables.is_kube_system_job_finalizer_update ||
        variables.maintenance_authorized
      message: Direct modification of OpenBao-managed resources is prohibited; modify the parent OpenBaoCluster/OpenBaoTenant instead.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "openbao-operator.fullname" . }}-openbao-lock-managed-resource-mutations-binding
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
spec:
