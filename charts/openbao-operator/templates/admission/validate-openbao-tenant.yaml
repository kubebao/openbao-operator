{{- if .Values.admissionPolicies.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "openbao-operator.fullname" . }}-openbao-validate-openbao-tenant
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["openbao.org"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["openbaotenants"]
  variables:
    - name: operator_namespace
      expression: |-
        '{{ .Release.Namespace }}'
  validations:
    # API contract: target namespace is immutable after creation.
    - expression: |-
        oldObject == null || object.spec.targetNamespace == oldObject.spec.targetNamespace
      message: "spec.targetNamespace is immutable."
    # Self-Service Constraint: targetNamespace must match metadata.namespace
    # Exception: Tenants in the operator namespace can target any namespace (admin mode)
    - expression: |-
        object.metadata.namespace == variables.operator_namespace || !has(object.spec.targetNamespace) || object.spec.targetNamespace == '' || object.spec.targetNamespace == object.metadata.namespace
      message: "OpenBaoTenant can only target its own namespace (self-service mode). Create the OpenBaoTenant in the operator namespace for cross-namespace targeting."
    # Self-Service Constraint: quota and limit-range overrides are reserved for
    # centrally managed onboarding from the operator namespace.
    - expression: |-
        object.metadata.namespace == variables.operator_namespace || (
          !has(object.spec.quota) &&
          !has(object.spec.limitRange)
        )
      message: "Self-service OpenBaoTenant requests may not customize spec.quota or spec.limitRange. Create the OpenBaoTenant in the operator namespace for centrally managed tenant guardrail overrides."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "openbao-operator.fullname" . }}-openbao-validate-openbao-tenant-binding
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
spec:
  policyName: {{ include "openbao-operator.fullname" . }}-openbao-validate-openbao-tenant
  validationActions:
    - Deny
{{- end }}
