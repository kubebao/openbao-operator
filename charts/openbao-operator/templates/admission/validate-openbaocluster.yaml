{{- if .Values.admissionPolicies.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "openbao-operator.fullname" . }}-openbao-validate-openbaocluster
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
  annotations:
    openbao.org/admission-policy-fingerprint: sha256:d202fdab5bb9a8bca48895587e2be2053f5c7599c90591a8e826b277e177cb0b
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["openbao.org"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["openbaoclusters"]
  matchConditions:
    - name: skip-garbage-collector-finalization
      expression: >-
        !(request.operation == 'UPDATE' && oldObject != null &&
          has(oldObject.metadata.deletionTimestamp) && object.spec == oldObject.spec &&
          request.userInfo.username in ['system:kube-controller-manager', 'system:serviceaccount:kube-system:generic-garbage-collector'])
  variables:
    - name: has_listener_proxy_authorization
      expression: >-
        has(object.spec.configuration) && has(object.spec.configuration.listener) &&
        has(object.spec.configuration.listener.proxyProtocolBehavior) &&
        object.spec.configuration.listener.proxyProtocolBehavior in ['allow_authorized', 'deny_unauthorized']
    - name: has_listener_tls_policy
      expression: >-
        has(object.spec.configuration) && has(object.spec.configuration.listener) &&
        (has(object.spec.configuration.listener.tlsMinVersion) ||
         has(object.spec.configuration.listener.tlsMaxVersion) ||
         has(object.spec.configuration.listener.tlsKeyExchangePreferences))
    - name: has_listener_key_exchange
      expression: >-
        has(object.spec.configuration) && has(object.spec.configuration.listener) &&
        has(object.spec.configuration.listener.tlsKeyExchangePreferences)
    - name: has_azure_key_vault_auth_method
      expression: >-
        has(object.spec.unseal) && has(object.spec.unseal.azureKeyVault) &&
        has(object.spec.unseal.azureKeyVault.authMethod)
    - name: has_backup
      expression: has(object.spec.backup)
    - name: backup_target_provider
      expression: >-
        variables.has_backup && has(object.spec.backup.target.provider) && object.spec.backup.target.provider.trim() != "" ? object.spec.backup.target.provider.trim().lowerAscii() : "s3"
    - name: backup_target_uses_s3
      expression: variables.backup_target_provider == "s3"
    - name: operator_namespace
      expression: >-
        '{{ .Release.Namespace }}'
    - name: controller_serviceaccount_name
      expression: >-
        '{{ include "openbao-operator.controllerServiceAccountName" . }}'
    - name: controller_principal
      expression: >-
        'system:serviceaccount:' + variables.operator_namespace + ':' + variables.controller_serviceaccount_name
    - name: is_operator_controller
      expression: >-
        request.userInfo.username == variables.controller_principal
    - name: old_static_unseal
      expression: >-
        oldObject != null && (!has(oldObject.spec.unseal) || !has(oldObject.spec.unseal.type) || oldObject.spec.unseal.type == 'static')
    - name: new_static_unseal
      expression: >-
        !has(object.spec.unseal) || !has(object.spec.unseal.type) || object.spec.unseal.type == 'static'
    - name: old_unseal_secret
      expression: >-
        oldObject != null && has(oldObject.spec.unseal) && has(oldObject.spec.unseal.credentialsSecretRef) ?
          oldObject.spec.unseal.credentialsSecretRef.name : ''
    - name: new_unseal_secret
      expression: >-
        has(object.spec.unseal) && has(object.spec.unseal.credentialsSecretRef) ? object.spec.unseal.credentialsSecretRef.name : ''
    - name: restore_test_authorization_required
      expression: >-
        !variables.is_operator_controller && has(object.spec.backup) && has(object.spec.backup.restoreTest) &&
        (oldObject == null || !has(oldObject.spec.backup) || !has(oldObject.spec.backup.restoreTest) ||
         object.spec.backup.restoreTest != oldObject.spec.backup.restoreTest ||
         object.spec.backup.target != oldObject.spec.backup.target ||
         has(object.spec.backup.image) != has(oldObject.spec.backup.image) ||
         (has(object.spec.backup.image) && has(oldObject.spec.backup.image) && object.spec.backup.image != oldObject.spec.backup.image))
    - name: requested_upgrade_strategy
      expression: >-
        has(object.spec.upgrade) && has(object.spec.upgrade.strategy) && object.spec.upgrade.strategy != "" ? object.spec.upgrade.strategy : "RollingUpdate"
    - name: previous_upgrade_strategy
      expression: >-
        oldObject != null && has(oldObject.spec.upgrade) && has(oldObject.spec.upgrade.strategy) && oldObject.spec.upgrade.strategy != "" ? oldObject.spec.upgrade.strategy : "RollingUpdate"
    - name: upgrade_strategy_changed
      expression: >-
        oldObject != null && variables.requested_upgrade_strategy != variables.previous_upgrade_strategy
    - name: upgrade_strategy_status_idle
      expression: >-
        oldObject != null &&
        has(oldObject.status) &&
        has(oldObject.status.initialized) && oldObject.status.initialized == true &&
        has(oldObject.status.phase) && oldObject.status.phase == "Running" &&
        has(oldObject.status.currentVersion) && oldObject.status.currentVersion == oldObject.spec.version &&
        has(oldObject.status.readyReplicas) && oldObject.status.readyReplicas == oldObject.spec.replicas &&
        has(oldObject.status.acceptedUpgradeStrategy) && oldObject.status.acceptedUpgradeStrategy == variables.previous_upgrade_strategy &&
        (!has(oldObject.status.upgrade)) &&
        (!has(oldObject.status.operationLock) || oldObject.status.operationLock == null) &&
        (!has(oldObject.status.breakGlass) || !has(oldObject.status.breakGlass.active) || oldObject.status.breakGlass.active == false) &&
        (!has(oldObject.status.workload) || !has(oldObject.status.workload.lastError)) &&
        has(oldObject.status.conditions) &&
        oldObject.status.conditions.exists(c, c.type == "Available" && c.status == "True") &&
        !oldObject.status.conditions.exists(c, c.type == "Degraded" && c.status == "True") &&
        (!has(oldObject.status.blueGreen) ||
          ((!has(oldObject.status.blueGreen.phase) || oldObject.status.blueGreen.phase == "Idle") &&
           (!has(oldObject.status.blueGreen.greenRevision) || oldObject.status.blueGreen.greenRevision == "") &&
           (!has(oldObject.status.blueGreen.startTime)) &&
           (!has(oldObject.status.blueGreen.rollbackStartTime)) &&
           (!has(oldObject.status.blueGreen.manualPromotionRequired) || oldObject.status.blueGreen.manualPromotionRequired == false) &&
           (!has(oldObject.status.blueGreen.jobFailureCount) || oldObject.status.blueGreen.jobFailureCount == 0) &&
           (!has(oldObject.status.blueGreen.lastJobFailure) || oldObject.status.blueGreen.lastJobFailure == ""))) &&
        (!has(oldObject.spec.readReplicas) || oldObject.spec.readReplicas.replicas == 0 ||
          (has(oldObject.status.readReplicas) && has(oldObject.status.readReplicas.readyReplicas) && oldObject.status.readReplicas.readyReplicas == oldObject.spec.readReplicas.replicas))
    - name: upgrade_requests_handled
      expression: >-
        oldObject == null || !has(object.spec.upgrade) || !has(object.spec.upgrade.requests) ||
        (((!has(object.spec.upgrade.requests.retry) || object.spec.upgrade.requests.retry == "") ||
          (has(oldObject.status.upgradeRequests) && has(oldObject.status.upgradeRequests.lastHandledRetry) && object.spec.upgrade.requests.retry == oldObject.status.upgradeRequests.lastHandledRetry)) &&
         ((!has(object.spec.upgrade.requests.promote) || object.spec.upgrade.requests.promote == "") ||
          (has(oldObject.status.upgradeRequests) && has(oldObject.status.upgradeRequests.lastHandledPromote) && object.spec.upgrade.requests.promote == oldObject.status.upgradeRequests.lastHandledPromote)) &&
         ((!has(object.spec.upgrade.requests.rollback) || object.spec.upgrade.requests.rollback == "") ||
          (has(oldObject.status.upgradeRequests) && has(oldObject.status.upgradeRequests.lastHandledRollback) && object.spec.upgrade.requests.rollback == oldObject.status.upgradeRequests.lastHandledRollback)))
    - name: requested_image
      expression: >-
        has(object.spec.image) ? object.spec.image : ""
    - name: previous_image
      expression: >-
        oldObject != null && has(oldObject.spec.image) ? oldObject.spec.image : ""
    - name: requested_runtime_restart
      expression: >-
        has(object.spec.runtime) && has(object.spec.runtime.restartAt) ? object.spec.runtime.restartAt : ""
    - name: previous_runtime_restart
      expression: >-
        oldObject != null && has(oldObject.spec.runtime) && has(oldObject.spec.runtime.restartAt) ? oldObject.spec.runtime.restartAt : ""
    - name: requested_read_replicas
      expression: >-
        has(object.spec.readReplicas) ? object.spec.readReplicas.replicas : 0
    - name: previous_read_replicas
      expression: >-
        oldObject != null && has(oldObject.spec.readReplicas) ? oldObject.spec.readReplicas.replicas : 0
    - name: has_pre_upgrade_snapshot
      expression: has(object.spec.upgrade) && has(object.spec.upgrade.preUpgradeSnapshot) && object.spec.upgrade.preUpgradeSnapshot == true
    - name: has_bluegreen_pre_upgrade_snapshot
      expression: has(object.spec.upgrade) && has(object.spec.upgrade.blueGreen) && has(object.spec.upgrade.blueGreen.preUpgradeSnapshot) && object.spec.upgrade.blueGreen.preUpgradeSnapshot == true
    - name: backup_endpoint
      expression: >-
        variables.has_backup && has(object.spec.backup.target.endpoint) ? object.spec.backup.target.endpoint.trim() : ""
    - name: backup_endpoint_is_set
      expression: variables.backup_endpoint != ""
    - name: backup_endpoint_is_url
      expression: >-
        !variables.backup_endpoint_is_set || isURL(variables.backup_endpoint)
    - name: backup_endpoint_scheme
      expression: >-
        variables.backup_endpoint_is_set && variables.backup_endpoint_is_url ? url(variables.backup_endpoint).getScheme().lowerAscii() : ""
    - name: backup_endpoint_hostname
      expression: >-
        variables.backup_endpoint_is_set && variables.backup_endpoint_is_url ? url(variables.backup_endpoint).getHostname().lowerAscii() : ""
    - name: backup_endpoint_hostname_normalized
      expression: >-
        variables.backup_endpoint_hostname.endsWith(".") ? variables.backup_endpoint_hostname.substring(0, size(variables.backup_endpoint_hostname) - 1) : variables.backup_endpoint_hostname
    - name: backup_endpoint_host_is_ip
      expression: >-
        variables.backup_endpoint_hostname_normalized != "" && isIP(variables.backup_endpoint_hostname_normalized)
    - name: backup_endpoint_host_is_ambiguous_ip
      expression: >-
        variables.backup_endpoint_hostname_normalized != "" &&
        !variables.backup_endpoint_host_is_ip &&
        (variables.backup_endpoint_hostname_normalized.matches("^(0x[0-9a-f]+|[0-9]+)(\\.(0x[0-9a-f]+|[0-9]+)){0,3}$") ||
          variables.backup_endpoint_hostname_normalized.contains(":"))
    - name: spec_version_normalized
      expression: >-
        object.spec.version.startsWith("v") ? object.spec.version.substring(1) : object.spec.version
    - name: spec_version_build_stripped
      expression: >-
        variables.spec_version_normalized.contains("+") ? variables.spec_version_normalized.substring(0, variables.spec_version_normalized.indexOf("+")) : variables.spec_version_normalized
    - name: spec_version_core
      expression: >-
        variables.spec_version_build_stripped.contains("-") ? variables.spec_version_build_stripped.substring(0, variables.spec_version_build_stripped.indexOf("-")) : variables.spec_version_build_stripped
    - name: spec_version_prerelease
      expression: >-
        variables.spec_version_build_stripped.contains("-") ? variables.spec_version_build_stripped.substring(variables.spec_version_build_stripped.indexOf("-") + 1) : ""
    - name: spec_version_valid
      expression: >-
        variables.spec_version_normalized.matches("^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$")
    - name: spec_version_parts
      expression: >-
        variables.spec_version_core.split(".").map(part, int(part))
    - name: current_version_normalized
      expression: >-
        oldObject != null && has(oldObject.status) && has(oldObject.status.currentVersion) && oldObject.status.currentVersion != "" ? (oldObject.status.currentVersion.startsWith("v") ? oldObject.status.currentVersion.substring(1) : oldObject.status.currentVersion) : ""
    - name: current_version_build_stripped
      expression: >-
        variables.current_version_normalized.contains("+") ? variables.current_version_normalized.substring(0, variables.current_version_normalized.indexOf("+")) : variables.current_version_normalized
    - name: current_version_core
      expression: >-
        variables.current_version_build_stripped.contains("-") ? variables.current_version_build_stripped.substring(0, variables.current_version_build_stripped.indexOf("-")) : variables.current_version_build_stripped
    - name: current_version_prerelease
      expression: >-
        variables.current_version_build_stripped.contains("-") ? variables.current_version_build_stripped.substring(variables.current_version_build_stripped.indexOf("-") + 1) : ""
    - name: current_version_valid
      expression: >-
        variables.current_version_normalized.matches("^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$")
    - name: current_version_parts
      expression: >-
        variables.current_version_core.split(".").map(part, int(part))
    - name: listener_key_exchange_version_supported
      expression: >-
        variables.spec_version_valid &&
        (variables.spec_version_parts[0] > 2 ||
         (variables.spec_version_parts[0] == 2 && variables.spec_version_parts[1] > 7) ||
         (variables.spec_version_parts[0] == 2 && variables.spec_version_parts[1] == 7 &&
          (variables.spec_version_parts[2] > 0 || variables.spec_version_prerelease == "")))
    - name: listener_key_exchange_current_version_supported
      expression: >-
        variables.current_version_normalized == "" ||
        (variables.current_version_valid &&
         (variables.current_version_parts[0] > 2 ||
          (variables.current_version_parts[0] == 2 && variables.current_version_parts[1] > 7) ||
          (variables.current_version_parts[0] == 2 && variables.current_version_parts[1] == 7 &&
           (variables.current_version_parts[2] > 0 || variables.current_version_prerelease == ""))))
    - name: azure_key_vault_auth_method_version_supported
      expression: >-
        variables.spec_version_valid &&
        (variables.spec_version_parts[0] > 2 ||
         (variables.spec_version_parts[0] == 2 && variables.spec_version_parts[1] > 6) ||
         (variables.spec_version_parts[0] == 2 && variables.spec_version_parts[1] == 6 &&
          (variables.spec_version_parts[2] > 0 || variables.spec_version_prerelease == "")))
    - name: azure_key_vault_auth_method_current_version_supported
      expression: >-
        variables.current_version_normalized == "" ||
        (variables.current_version_valid &&
         (variables.current_version_parts[0] > 2 ||
          (variables.current_version_parts[0] == 2 && variables.current_version_parts[1] > 6) ||
          (variables.current_version_parts[0] == 2 && variables.current_version_parts[1] == 6 &&
           (variables.current_version_parts[2] > 0 || variables.current_version_prerelease == ""))))
    - name: rolling_target_version_normalized
      expression: >-
        oldObject != null && has(oldObject.status) && has(oldObject.status.upgrade) && has(oldObject.status.upgrade.targetVersion) && oldObject.status.upgrade.targetVersion != "" ? (oldObject.status.upgrade.targetVersion.startsWith("v") ? oldObject.status.upgrade.targetVersion.substring(1) : oldObject.status.upgrade.targetVersion) : ""
    - name: rolling_target_version_build_stripped
      expression: >-
        variables.rolling_target_version_normalized.contains("+") ? variables.rolling_target_version_normalized.substring(0, variables.rolling_target_version_normalized.indexOf("+")) : variables.rolling_target_version_normalized
    - name: rolling_target_version_core
      expression: >-
        variables.rolling_target_version_build_stripped.contains("-") ? variables.rolling_target_version_build_stripped.substring(0, variables.rolling_target_version_build_stripped.indexOf("-")) : variables.rolling_target_version_build_stripped
    - name: rolling_target_version_prerelease
      expression: >-
        variables.rolling_target_version_build_stripped.contains("-") ? variables.rolling_target_version_build_stripped.substring(variables.rolling_target_version_build_stripped.indexOf("-") + 1) : ""
    - name: rolling_target_version_valid
      expression: >-
        variables.rolling_target_version_normalized.matches("^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$")
    - name: rolling_target_version_parts
      expression: >-
        variables.rolling_target_version_core.split(".").map(part, int(part))
    - name: rolling_upgrade_progress_started
      expression: >-
        oldObject != null && has(oldObject.status) && has(oldObject.status.upgrade) && (oldObject.status.upgrade.currentPartition < oldObject.spec.replicas || (has(oldObject.status.upgrade.completedPods) && size(oldObject.status.upgrade.completedPods) > 0))
    - name: custom_executables_authorized
      expression: >-
        authorizer.group("openbao.org").resource("openbaoclusters").namespace(request.namespace).name(object.metadata.name).check("usecustomexecutables").allowed() ||
        authorizer.group("openbao.org").resource("openbaoclusters").namespace(request.namespace).name(object.metadata.name).check("usehelperimages").allowed()
    - name: image_trust_roots_authorized
      expression: >-
        authorizer.group("openbao.org").resource("openbaoclusters").namespace(request.namespace).name(object.metadata.name).check("useimagetrustroots").allowed()
    - name: cloud_identities_authorized
      expression: >-
        authorizer.group("openbao.org").resource("openbaoclusters").namespace(request.namespace).name(object.metadata.name).check("usecloudidentities").allowed()
    - name: network_publication_authorized
      expression: >-
        authorizer.group("openbao.org").resource("openbaoclusters").namespace(request.namespace).name(object.metadata.name).check("publishnetworking").allowed()
    - name: has_network_publication_controls
      expression: >-
        (
          has(object.spec.service) &&
          (
            (has(object.spec.service.type) && object.spec.service.type != "" && object.spec.service.type != "ClusterIP") ||
            (has(object.spec.service.annotations) && size(object.spec.service.annotations) > 0)
          )
        ) ||
        (
          has(object.spec.readReplicas) &&
          has(object.spec.readReplicas.service) &&
          has(object.spec.readReplicas.service.enabled) &&
          object.spec.readReplicas.service.enabled == true &&
          (
            (has(object.spec.readReplicas.service.type) && object.spec.readReplicas.service.type != "" && object.spec.readReplicas.service.type != "ClusterIP") ||
            (has(object.spec.readReplicas.service.annotations) && size(object.spec.readReplicas.service.annotations) > 0)
          )
        ) ||
        (
          has(object.spec.ingress) &&
          (
            (has(object.spec.ingress.enabled) && object.spec.ingress.enabled == true) ||
            (has(object.spec.ingress.annotations) && size(object.spec.ingress.annotations) > 0)
          )
        ) ||
        (
          has(object.spec.gateway) &&
          (
            (has(object.spec.gateway.enabled) && object.spec.gateway.enabled == true) ||
            (has(object.spec.gateway.annotations) && size(object.spec.gateway.annotations) > 0)
          )
        )
    - name: has_main_workload_cloud_identity_metadata
      expression: >-
        (has(object.spec.serviceAccount) &&
          has(object.spec.serviceAccount.annotations) &&
          size(object.spec.serviceAccount.annotations) > 0) ||
        (has(object.spec.podMetadata) &&
          (
            (has(object.spec.podMetadata.annotations) &&
              object.spec.podMetadata.annotations.exists(key,
                key.startsWith("eks.amazonaws.com/") ||
                key.startsWith("iam.amazonaws.com/") ||
                key.startsWith("iam.gke.io/") ||
                key.startsWith("azure.workload.identity/"))) ||
            (has(object.spec.podMetadata.labels) &&
              object.spec.podMetadata.labels.exists(key,
                key.startsWith("azure.workload.identity/") ||
                key == "aadpodidbinding"))
          ))
    - name: has_backup_cloud_identity_metadata
      expression: >-
        has(object.spec.backup) &&
        (
          (variables.backup_target_uses_s3 &&
            has(object.spec.backup.target.roleArn) &&
            object.spec.backup.target.roleArn.trim() != "") ||
          (has(object.spec.backup.target.workloadIdentity) &&
            (
              (has(object.spec.backup.target.workloadIdentity.serviceAccountAnnotations) &&
                size(object.spec.backup.target.workloadIdentity.serviceAccountAnnotations) > 0) ||
              (has(object.spec.backup.target.workloadIdentity.podLabels) &&
                size(object.spec.backup.target.workloadIdentity.podLabels) > 0)
            ))
        )
    - name: has_cloud_identity_metadata
      expression: >-
        variables.has_main_workload_cloud_identity_metadata ||
        variables.has_backup_cloud_identity_metadata
    - name: has_custom_main_image_trust_roots
      expression: >-
        has(object.spec.imageVerification) &&
        (
          (has(object.spec.imageVerification.publicKey) && object.spec.imageVerification.publicKey.trim() != "") ||
          (has(object.spec.imageVerification.issuer) && object.spec.imageVerification.issuer.trim() != "") ||
          (has(object.spec.imageVerification.subject) && object.spec.imageVerification.subject.trim() != "") ||
          (has(object.spec.imageVerification.issuerRegExp) && object.spec.imageVerification.issuerRegExp.trim() != "") ||
          (has(object.spec.imageVerification.subjectRegExp) && object.spec.imageVerification.subjectRegExp.trim() != "") ||
          (has(object.spec.imageVerification.ignoreTlog) && object.spec.imageVerification.ignoreTlog == true)
        )
    - name: has_custom_operator_image_trust_roots
      expression: >-
        has(object.spec.operatorImageVerification) &&
        (
          (has(object.spec.operatorImageVerification.publicKey) && object.spec.operatorImageVerification.publicKey.trim() != "") ||
          (has(object.spec.operatorImageVerification.issuer) && object.spec.operatorImageVerification.issuer.trim() != "") ||
          (has(object.spec.operatorImageVerification.subject) && object.spec.operatorImageVerification.subject.trim() != "") ||
          (has(object.spec.operatorImageVerification.issuerRegExp) && object.spec.operatorImageVerification.issuerRegExp.trim() != "") ||
          (has(object.spec.operatorImageVerification.subjectRegExp) && object.spec.operatorImageVerification.subjectRegExp.trim() != "") ||
          (has(object.spec.operatorImageVerification.ignoreTlog) && object.spec.operatorImageVerification.ignoreTlog == true)
        )
    - name: requested_below_current_version
      expression: >-
        variables.current_version_valid &&
        variables.spec_version_valid &&
        (
          variables.spec_version_parts[0] < variables.current_version_parts[0] ||
          (variables.spec_version_parts[0] == variables.current_version_parts[0] &&
            (
              variables.spec_version_parts[1] < variables.current_version_parts[1] ||
              (variables.spec_version_parts[1] == variables.current_version_parts[1] &&
                (
                  variables.spec_version_parts[2] < variables.current_version_parts[2] ||
                  (variables.spec_version_parts[2] == variables.current_version_parts[2] &&
                    (
                      (variables.current_version_prerelease == "" && variables.spec_version_prerelease != "") ||
                      (variables.current_version_prerelease != "" &&
                        variables.spec_version_prerelease != "" &&
                        variables.spec_version_prerelease < variables.current_version_prerelease)
                    )
                  )
                )
              )
            )
          )
        )
    - name: requested_below_rolling_target
      expression: >-
        variables.rolling_upgrade_progress_started &&
        variables.rolling_target_version_valid &&
        variables.spec_version_valid &&
        (
          variables.spec_version_parts[0] < variables.rolling_target_version_parts[0] ||
          (variables.spec_version_parts[0] == variables.rolling_target_version_parts[0] &&
            (
              variables.spec_version_parts[1] < variables.rolling_target_version_parts[1] ||
              (variables.spec_version_parts[1] == variables.rolling_target_version_parts[1] &&
                (
                  variables.spec_version_parts[2] < variables.rolling_target_version_parts[2] ||
                  (variables.spec_version_parts[2] == variables.rolling_target_version_parts[2] &&
                    (
                      (variables.rolling_target_version_prerelease == "" && variables.spec_version_prerelease != "") ||
                      (variables.rolling_target_version_prerelease != "" &&
                        variables.spec_version_prerelease != "" &&
                        variables.spec_version_prerelease < variables.rolling_target_version_prerelease)
                    )
                  )
                )
              )
            )
          )
        )
    - name: has_restore_target_cloud_identity_metadata
      expression: >-
        has(object.spec.backup) && has(object.spec.backup.restoreTest) && (
        (has(object.spec.backup.restoreTest.clusterTemplate.serviceAccount) &&
