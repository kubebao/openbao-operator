metadata:
  name: {{ include "openbao-operator.fullname" . }}-openbao-validate-openbaocluster-binding
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
spec:
  policyName: {{ include "openbao-operator.fullname" . }}-openbao-validate-openbaocluster
  validationActions:
    - Deny
{{- end }}
