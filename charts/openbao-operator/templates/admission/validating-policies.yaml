{{- if .Values.admissionPolicies.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "openbao-operator.fullname" . }}-openbao-lock-controller-statefulset-mutations
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
  annotations:
    openbao.org/admission-policy-fingerprint: sha256:f9ea866c4743f4f1c422909ff25c154267e84f645e276fb3bff19c321eed9179
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["statefulsets"]
  variables:
    - name: operator_namespace
      expression: >-
        '{{ .Release.Namespace }}'
    - name: controller_serviceaccount_name
      expression: >-
        '{{ include "openbao-operator.controllerServiceAccountName" . }}'
    - name: controller_principal
      expression: >-
        'system:serviceaccount:' + variables.operator_namespace + ':' + variables.controller_serviceaccount_name
    - name: is_controller
      expression: >-
        request.userInfo.username == variables.controller_principal
    # Bootstrap cleanup can remove only the optional Secret input projection.
    # It cannot add or redirect a dependency, executable, argument, or mount.
    - name: bootstrap_input_cleanup
      expression: >-
        object.metadata.ownerReferences == oldObject.metadata.ownerReferences &&
        oldObject.metadata.ownerReferences.exists(o,
          o.apiVersion == 'openbao.org/v1alpha1' && o.kind == 'OpenBaoCluster' && o.controller) &&
        oldObject.spec.template.spec.volumes.exists(v,
          v.name == 'self-init-inputs' && has(v.projected) &&
          v.projected.sources.all(s, has(s.secret) && has(s.secret.optional) && s.secret.optional)) &&
        object.spec.template.spec.volumes ==
          oldObject.spec.template.spec.volumes.filter(v, v.name != 'self-init-inputs')
    # Resume can add only the normal Kubernetes API projection. This cannot
    # select another Secret, ConfigMap, ServiceAccount, or token audience.
    - name: api_volumes
      expression: object.spec.template.spec.volumes.filter(v, v.name == 'kube-api-access')
    - name: handoff
      expression: >-
        oldObject.spec.replicas == 1 && object.spec.replicas == 1 &&
        object.spec.updateStrategy.type == 'OnDelete' &&
        oldObject.spec.template.spec.enableServiceLinks == false &&
        object.spec.template.spec.automountServiceAccountToken == false &&
        object.spec.template.spec.serviceAccountName == oldObject.spec.template.spec.serviceAccountName &&
        object.metadata.ownerReferences == oldObject.metadata.ownerReferences &&
        oldObject.metadata.ownerReferences.exists(o, o.apiVersion == 'openbao.org/v1alpha1' && o.kind == 'OpenBaoCluster' && o.controller) &&
        oldObject.spec.template.spec.volumes.all(v, v.name != 'kube-api-access') &&
        variables.api_volumes.size() == 1 &&
        variables.api_volumes.all(v,
          has(v.projected) && v.projected.defaultMode == 288 && v.projected.sources.size() == 3 &&
          has(v.projected.sources[0].serviceAccountToken) &&
          v.projected.sources[0].serviceAccountToken.path == 'token' &&
          v.projected.sources[0].serviceAccountToken.expirationSeconds == 3600 &&
          (!has(v.projected.sources[0].serviceAccountToken.audience) || v.projected.sources[0].serviceAccountToken.audience == '') &&
          has(v.projected.sources[1].configMap) && v.projected.sources[1].configMap.name == 'kube-root-ca.crt' &&
          (!has(v.projected.sources[1].configMap.optional) || !v.projected.sources[1].configMap.optional) &&
          v.projected.sources[1].configMap.items.size() == 1 &&
          v.projected.sources[1].configMap.items[0].key == 'ca.crt' &&
          v.projected.sources[1].configMap.items[0].path == 'ca.crt' &&
          !has(v.projected.sources[1].configMap.items[0].mode) &&
          has(v.projected.sources[2].downwardAPI) && v.projected.sources[2].downwardAPI.items.size() == 1 &&
          v.projected.sources[2].downwardAPI.items[0].path == 'namespace' &&
          !has(v.projected.sources[2].downwardAPI.items[0].mode) &&
          has(v.projected.sources[2].downwardAPI.items[0].fieldRef) &&
          v.projected.sources[2].downwardAPI.items[0].fieldRef.apiVersion == 'v1' &&
          v.projected.sources[2].downwardAPI.items[0].fieldRef.fieldPath == 'metadata.namespace')
  validations:
    - expression: >-
        !variables.is_controller ||
        object.spec.template.spec.volumes == oldObject.spec.template.spec.volumes ||
        variables.bootstrap_input_cleanup ||
        (variables.handoff &&
          object.spec.template.spec.volumes.filter(v, v.name != 'kube-api-access') == oldObject.spec.template.spec.volumes)
      message: OpenBao controller cannot modify StatefulSet volumes.
    - expression: >-
        !variables.is_controller ||
        object.spec.template.spec.containers.map(c, {'name': c.name, 'command': c.command, 'args': c.args}) ==
        oldObject.spec.template.spec.containers.map(c, {'name': c.name, 'command': c.command, 'args': c.args})
      message: OpenBao controller cannot modify container commands or args.
    - expression: >-
        !variables.is_controller ||
        (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : [])
          .map(c, {'name': c.name, 'command': c.command, 'args': c.args}) ==
        (has(oldObject.spec.template.spec.initContainers) ? oldObject.spec.template.spec.initContainers : [])
          .map(c, {'name': c.name, 'command': c.command, 'args': c.args}) ||
        (variables.bootstrap_input_cleanup &&
          (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : [])
            .map(c, {'name': c.name, 'command': c.command, 'args': c.args}) ==
          (has(oldObject.spec.template.spec.initContainers) ? oldObject.spec.template.spec.initContainers : [])
            .map(c, {'name': c.name, 'command': c.command,
              'args': dyn(c.name == 'bao-config-init' ?
                c.args.filter(a, !a.startsWith('--self-init-secret-file=/etc/bao/self-init-inputs/')) : c.args)}))
      message: OpenBao controller cannot modify init container commands or args.
    - expression: >-
        !variables.is_controller ||
        (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : [])
          .map(c, {'name': c.name, 'securityContext': c.securityContext, 'volumeMounts': c.volumeMounts}) ==
        (has(oldObject.spec.template.spec.initContainers) ? oldObject.spec.template.spec.initContainers : [])
          .map(c, {'name': c.name, 'securityContext': c.securityContext, 'volumeMounts': c.volumeMounts}) ||
        (variables.bootstrap_input_cleanup &&
          (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : [])
            .map(c, {'name': c.name, 'securityContext': c.securityContext, 'volumeMounts': c.volumeMounts}) ==
          (has(oldObject.spec.template.spec.initContainers) ? oldObject.spec.template.spec.initContainers : [])
            .map(c, {'name': c.name, 'securityContext': c.securityContext,
              'volumeMounts': dyn(c.name == 'bao-config-init' ?
                c.volumeMounts.filter(m, m.name != 'self-init-inputs') : c.volumeMounts)}))
      message: OpenBao controller cannot modify init container securityContext or volumeMounts.
    - expression: >-
        !variables.is_controller ||
        object.spec.template.spec.automountServiceAccountToken ==
          oldObject.spec.template.spec.automountServiceAccountToken
      message: OpenBao controller cannot modify automountServiceAccountToken.
    - expression: >-
        !variables.is_controller ||
        object.spec.template.spec.securityContext == oldObject.spec.template.spec.securityContext
      message: OpenBao controller cannot modify pod securityContext.
    - expression: >-
        !variables.is_controller ||
        object.spec.template.spec.containers.map(c, {'name': c.name, 'securityContext': c.securityContext, 'volumeMounts': c.volumeMounts}) ==
        oldObject.spec.template.spec.containers.map(c, {'name': c.name, 'securityContext': c.securityContext, 'volumeMounts': c.volumeMounts}) ||
        (variables.bootstrap_input_cleanup &&
          object.spec.template.spec.containers.map(c,
            {'name': c.name, 'securityContext': c.securityContext, 'volumeMounts': c.volumeMounts}) ==
          oldObject.spec.template.spec.containers.map(c, {'name': c.name, 'securityContext': c.securityContext,
            'volumeMounts': dyn(c.name == 'openbao' ?
              c.volumeMounts.filter(m, m.name != 'self-init-inputs') : c.volumeMounts)})) ||
        (variables.handoff &&
          object.spec.template.spec.containers.map(c, {'name': c.name, 'securityContext': c.securityContext,
            'volumeMounts': dyn(c.volumeMounts.filter(m, m.name != 'kube-api-access'))}) ==
          oldObject.spec.template.spec.containers.map(c, {'name': c.name, 'securityContext': c.securityContext, 'volumeMounts': c.volumeMounts}) &&
          object.spec.template.spec.containers.all(c,
            c.volumeMounts.filter(m, m.name == 'kube-api-access').all(m,
              c.name == 'openbao' && m.mountPath == '/var/run/secrets/kubernetes.io/serviceaccount' && m.readOnly &&
              (!has(m.subPath) || m.subPath == '') && (!has(m.subPathExpr) || m.subPathExpr == '') &&
              (!has(m.mountPropagation) || m.mountPropagation == 'None') &&
              !has(m.recursiveReadOnly))))
      message: OpenBao controller cannot modify container securityContext or volumeMounts.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "openbao-operator.fullname" . }}-openbao-lock-controller-statefulset-mutations-binding
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
spec:
  policyName: {{ include "openbao-operator.fullname" . }}-openbao-lock-controller-statefulset-mutations
  validationActions:
    - Deny
{{- end }}
