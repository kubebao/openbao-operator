{{- $isOpenShift := or (eq .Values.platform "openshift") (and (eq .Values.platform "auto") (.Capabilities.APIVersions.Has "security.openshift.io/v1")) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openbao-operator.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "openbao-operator.controllerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "openbao-operator.controllerSelectorLabels" . | nindent 8 }}
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      serviceAccountName: {{ include "openbao-operator.controllerServiceAccountName" . }}
      securityContext:
        {{- if $isOpenShift }}
        {{- omit .Values.controller.podSecurityContext "runAsUser" "runAsGroup" "fsGroup" | toYaml | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.controller.podSecurityContext | nindent 8 }}
        {{- end }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: {{ include "openbao-operator.managerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
            - controller
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            - --health-probe-bind-address=:{{ .Values.healthProbes.port }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            - --platform={{ .Values.platform }}
            {{- if not .Values.admissionPolicies.enabled }}
            - --admission-enforcement=warn
            {{- end }}
            {{- with .Values.controller.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if eq .Values.tenancy.mode "single" }}
            - name: WATCH_NAMESPACE
              value: {{ .Values.tenancy.targetNamespace | default .Release.Namespace | quote }}
            {{- end }}
            - name: OPERATOR_NAME_PREFIX
              value: {{ include "openbao-operator.fullname" . }}-
            - name: OPERATOR_SERVICE_ACCOUNT_NAME
              value: {{ include "openbao-operator.controllerServiceAccountName" . }}
            - name: OPERATOR_PROVISIONER_SERVICE_ACCOUNT_NAME
              value: {{ include "openbao-operator.provisionerServiceAccountName" . }}
            - name: OPENBAO_TENANT_NAMESPACE_POD_SECURITY_LABELS_MODE
              value: {{ .Values.tenancy.namespacePodSecurityLabels.mode | quote }}
            - name: OPERATOR_VERSION
              value: {{ include "openbao-operator.operatorVersion" . | quote }}
            {{- if and .Values.helperImages .Values.helperImages.init }}
            - name: OPERATOR_INIT_IMAGE
              value: {{ .Values.helperImages.init | quote }}
            {{- end }}
            {{- if and .Values.helperImages .Values.helperImages.backup }}
            - name: OPERATOR_BACKUP_IMAGE
              value: {{ .Values.helperImages.backup | quote }}
            {{- end }}
            {{- if and .Values.helperImages .Values.helperImages.upgrade }}
            - name: OPERATOR_UPGRADE_IMAGE
              value: {{ .Values.helperImages.upgrade | quote }}
            {{- end }}
            - name: OPENBAO_JWT_AUDIENCE
              value: {{ .Values.serviceAccountToken.openBaoAudience | quote }}
            {{- if not .Values.admissionPolicies.enabled }}
            - name: OPENBAO_UNSAFE_ADMISSION_DISABLED
              value: "true"
            {{- end }}
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.healthProbes.port }}
            initialDelaySeconds: {{ .Values.healthProbes.livenessInitialDelaySeconds }}
            periodSeconds: {{ .Values.healthProbes.livenessPeriodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.healthProbes.port }}
            initialDelaySeconds: {{ .Values.healthProbes.readinessInitialDelaySeconds }}
            periodSeconds: {{ .Values.healthProbes.readinessPeriodSeconds }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- if $isOpenShift }}
            {{- omit .Values.controller.securityContext "runAsUser" "runAsGroup" "fsGroup" | toYaml | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.controller.securityContext | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: openbao-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
      volumes:
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  {{- if .Values.serviceAccountToken.kubernetesAudience }}
                  audience: {{ .Values.serviceAccountToken.kubernetesAudience | quote }}
                  {{- end }}
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
            defaultMode: 292
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  path: openbao-token
                  expirationSeconds: 3600
                  audience: {{ .Values.serviceAccountToken.openBaoAudience | quote }}
            defaultMode: 292
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
