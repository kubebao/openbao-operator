{{- if eq .Values.tenancy.mode "multi" }}
{{- $isOpenShift := or (eq .Values.platform "openshift") (and (eq .Values.platform "auto") (.Capabilities.APIVersions.Has "security.openshift.io/v1")) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openbao-operator.fullname" . }}-provisioner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
spec:
  replicas: {{ .Values.provisioner.replicas }}
  selector:
    matchLabels:
      {{- include "openbao-operator.provisionerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.provisioner.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "openbao-operator.provisionerSelectorLabels" . | nindent 8 }}
        {{- with .Values.provisioner.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      serviceAccountName: {{ include "openbao-operator.provisionerServiceAccountName" . }}
      securityContext:
        {{- if $isOpenShift }}
        {{- omit .Values.provisioner.podSecurityContext "runAsUser" "runAsGroup" "fsGroup" | toYaml | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.provisioner.podSecurityContext | nindent 8 }}
        {{- end }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: {{ include "openbao-operator.managerImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
            - provisioner
          args:
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect
            {{- end }}
            - --health-probe-bind-address=:{{ .Values.healthProbes.port }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            {{- else }}
            - --metrics-bind-address=0
            {{- end }}
            {{- if not .Values.admissionPolicies.enabled }}
            - --admission-enforcement=warn
            {{- end }}
            {{- with .Values.provisioner.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_NAME_PREFIX
              value: {{ include "openbao-operator.fullname" . }}-
            - name: OPERATOR_SERVICE_ACCOUNT_NAME
              value: {{ include "openbao-operator.controllerServiceAccountName" . }}
            - name: OPERATOR_PROVISIONER_SERVICE_ACCOUNT_NAME
              value: {{ include "openbao-operator.provisionerServiceAccountName" . }}
            - name: OPENBAO_ADMISSION_PVC_BINDING_SYNC_CALLERS
              value: {{ include "openbao-operator.pvcBindingSyncCallers" . | replace "$" "\\u0024" | quote }}
            - name: OPENBAO_ADMISSION_POD_METADATA_SYNC_CALLERS
              value: {{ include "openbao-operator.podMetadataSyncCallers" . | replace "$" "\\u0024" | quote }}
            - name: OPERATOR_VERSION
              value: {{ include "openbao-operator.operatorVersion" . | quote }}
            - name: OPENBAO_TENANT_NAMESPACE_POD_SECURITY_LABELS_MODE
              value: {{ .Values.tenancy.namespacePodSecurityLabels.mode | quote }}
            {{- if not .Values.admissionPolicies.enabled }}
            - name: OPENBAO_UNSAFE_ADMISSION_DISABLED
              value: "true"
            {{- end }}
            {{- with .Values.provisioner.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.healthProbes.port }}
            initialDelaySeconds: {{ .Values.healthProbes.livenessInitialDelaySeconds }}
            periodSeconds: {{ .Values.healthProbes.livenessPeriodSeconds }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.healthProbes.port }}
            initialDelaySeconds: {{ .Values.healthProbes.readinessInitialDelaySeconds }}
            periodSeconds: {{ .Values.healthProbes.readinessPeriodSeconds }}
          resources:
            {{- toYaml .Values.provisioner.resources | nindent 12 }}
          securityContext:
            {{- if $isOpenShift }}
            {{- omit .Values.provisioner.securityContext "runAsUser" "runAsGroup" "fsGroup" | toYaml | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.provisioner.securityContext | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  {{- if .Values.serviceAccountToken.kubernetesAudience }}
                  audience: {{ .Values.serviceAccountToken.kubernetesAudience | quote }}
                  {{- end }}
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
            defaultMode: 292
      {{- with .Values.provisioner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.provisioner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.provisioner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
