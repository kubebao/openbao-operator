{{- if eq .Values.tenancy.mode "multi" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "openbao-operator.fullname" . }}-provisioner
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
{{ if eq .Values.tenancy.namespacePodSecurityLabels.mode "enforce" }}
      - update
      - patch
{{ end }}

  - apiGroups:
      - kubebao.org
    resources:
      - openbaotenants
      - openbaotenants/status
      - openbaotenants/finalizers
    verbs:
      - get
      - list
      - watch
      - update
      - patch

  - apiGroups:
      - kubebao.org
    resources:
      - openbaoclusters
      - openbaorestores
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch

  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
    verbs:
      - get

  - apiGroups:
      - ""
    resources:
      - resourcequotas
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - resourcequotas
    resourceNames:
      - openbao-operator-tenant-quota
    verbs:
      - get
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - limitranges
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - limitranges
    resourceNames:
      - openbao-operator-tenant-limits
    verbs:
      - get
      - patch
      - delete

  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - create
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
    resourceNames:
      - openbao-operator-tenant-role
      - openbao-operator-tenant-secrets-reader
      - openbao-operator-tenant-secrets-writer
    verbs:
      - get
      - patch
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    resourceNames:
      - openbao-operator-tenant-rolebinding
      - openbao-operator-tenant-secrets-reader-rolebinding
      - openbao-operator-tenant-secrets-writer-rolebinding
    verbs:
      - get
      - patch
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
    verbs:
      - bind
      - escalate
    resourceNames:
      - openbao-operator-tenant-role
      - openbao-operator-tenant-secrets-reader
      - openbao-operator-tenant-secrets-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "openbao-operator.fullname" . }}-provisioner-metrics-auth
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "openbao-operator.fullname" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "openbao-operator.provisionerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "openbao-operator.fullname" . }}-provisioner
  labels:
    {{- include "openbao-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "openbao-operator.fullname" . }}-provisioner
subjects:
  - kind: ServiceAccount
    name: {{ include "openbao-operator.provisionerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
