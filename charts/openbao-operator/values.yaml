# -- Default values for openbao-operator.
# -- Declare variables to be passed into your templates.

# -- Override the chart name
nameOverride: ""

# -- Override the full name of resources
fullnameOverride: ""

# -- Target platform configuration
# -- Options: "auto" (default), "kubernetes", "openshift"
# -- When set to "auto", the operator auto-detects OpenShift by API discovery.
# -- When set to "openshift", the chart and operator adapt security contexts for SCC compatibility.
platform: "auto"

# -- Operator image configuration
image:
  # -- Image repository for KubeBao builds. Historical releases remain under ghcr.io/dc-tec.
  repository: ghcr.io/kubebao/openbao-operator
  # -- Image tag. Defaults to Chart.appVersion if not set
  tag: ""
  # -- Image digest. If set, takes precedence over tag
  digest: ""
  # -- Image pull policy
  pullPolicy: IfNotPresent

# -- Complete default helper image references. Empty values use repository and operatorVersion defaults.
# -- Edge packages set these references to the candidate digests. Cluster-level image overrides take precedence.
helperImages:
  # -- Config init image reference
  init: ""
  # -- Backup and restore executor image reference
  backup: ""
  # -- Upgrade executor image reference
  upgrade: ""

# -- Image pull secrets for operator images
imagePullSecrets: []
# - name: my-registry-secret

# -- Override operator version reported in status. Defaults to Chart.appVersion
operatorVersion: ""

# -- Tenancy mode configuration.
# -- Controls how the operator manages permissions and namespace access.
tenancy:
  # -- Tenancy mode: "multi" or "single"
  #
  # multi (Multi-Tenant Mode):
  #   - Deploys both Provisioner and Controller
  #   - Uses OpenBaoTenant CRD for namespace onboarding
  #   - Zero-trust RBAC model with namespace-scoped permissions
  #   - Recommended for platform teams providing OpenBao-as-a-Service
  #
  # single (Single-Tenant Mode):
  #   - Deploys only the Controller (no Provisioner)
  #   - Uses namespace-scoped caching for high performance
  #   - Event-driven reconciliation via Owns() watches
  #   - Recommended for individual teams deploying OpenBao for their app
  mode: multi

  # -- Target namespace for single-tenant mode.
  # -- Only used when mode=single.
  # -- If empty, defaults to the release namespace.
  targetNamespace: ""

  # -- Tenant namespace Pod Security label management.
  # -- mode=enforce lets the provisioner apply restricted Pod Security labels
  # -- to tenant namespaces during OpenBaoTenant onboarding.
  # -- mode=external delegates those namespace labels to the platform policy layer
  # -- and prevents the provisioner from mutating Namespace objects.
  namespacePodSecurityLabels:
    mode: enforce

# -- Controller deployment configuration
controller:
  # -- Number of controller replicas
  replicas: 1

  # -- Resource requests and limits for the controller
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

  # -- Additional environment variables for the controller
  extraEnv: []
  # - name: LOG_LEVEL
  #   value: debug

  # -- Additional arguments for the controller manager.
  # Example:
  # extraArgs:
  #   - --admission-enforcement=warn
  #   - --admission-startup-timeout=120s
  extraArgs: []

  # -- Node selector for controller pods
  nodeSelector: {}

  # -- Tolerations for controller pods
  tolerations: []

  # -- Affinity rules for controller pods
  affinity: {}

  # -- Annotations to add to controller pods
  podAnnotations: {}

  # -- Labels to add to controller pods
  podLabels: {}

  # -- Security context for the controller container
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsGroup: 65532
    runAsUser: 65532

  # -- Pod-level security context for the controller
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # -- Service account configuration for the controller
  serviceAccount:
    # -- Annotations to add to the controller service account
    annotations: {}

# -- Provisioner deployment configuration (only used when tenancy.mode=multi)
provisioner:
  # -- Number of provisioner replicas
  replicas: 1

  # -- Resource requests and limits for the provisioner
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  # -- Additional environment variables for the provisioner
  extraEnv: []

  # -- Additional arguments for the provisioner manager.
  # Example:
  # extraArgs:
  #   - --admission-enforcement=warn
  #   - --admission-startup-timeout=120s
  extraArgs: []

  # -- Node selector for provisioner pods
  nodeSelector: {}

  # -- Tolerations for provisioner pods
  tolerations: []

  # -- Affinity rules for provisioner pods
  affinity: {}

  # -- Annotations to add to provisioner pods
  podAnnotations: {}

  # -- Labels to add to provisioner pods
  podLabels: {}

  # -- Security context for the provisioner container
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsGroup: 65532
    runAsUser: 65532

  # -- Pod-level security context for the provisioner
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # -- Service account configuration for the provisioner
  serviceAccount:
    # -- Annotations to add to the provisioner service account
    annotations: {}

# -- Metrics configuration
metrics:
  # -- Enable metrics endpoints
  enabled: true
  # -- Metrics port
  port: 8443
  # -- Optional RBAC to allow external scrapers (Prometheus/vmagent) to GET /metrics
  rbac:
    # -- Create a ClusterRoleBinding to the built-in "metrics-reader" ClusterRole
    enabled: false
    # -- Subjects (ServiceAccounts) that should be allowed to scrape metrics
    # subjects:
    #   - name: prometheus-k8s
    #     namespace: monitoring
    subjects: []
  # -- Prometheus Operator ServiceMonitor configuration
  serviceMonitor:
    # -- Enable ServiceMonitor resources for controller/provisioner metrics
    enabled: false
    # -- Namespace to create ServiceMonitors in (defaults to release namespace if empty)
    namespace: ""
    # -- Scrape interval
    interval: 30s
    # -- Scrape timeout
    scrapeTimeout: 10s
    # -- Additional labels to add to the ServiceMonitor
    labels: {}
    # -- TLS config for scraping the secure metrics endpoint
    tlsConfig:
      # -- Skip TLS verification (useful with self-signed certs). Set to false and configure secrets for strict verification.
      insecureSkipVerify: true
      # -- Optional serverName override, e.g. "openbao-operator-controller-metrics.<ns>.svc"
      serverName: ""
      # -- Optional CA secret reference
      caSecret:
        name: ""
        key: ca.crt
      # -- Optional client cert secret reference
      certSecret:
        name: ""
        key: tls.crt
      # -- Optional client key secret reference
      keySecret:
        name: ""
        key: tls.key
  # -- VictoriaMetrics Operator (VMServiceScrape) configuration
  victoriaMetrics:
    # -- Enable VMServiceScrape resources for controller/provisioner metrics
    enabled: false
    # -- Namespace to create VMServiceScrapes in (defaults to release namespace if empty)
    namespace: ""
    # -- Scrape interval
    interval: 30s
    # -- Scrape timeout
    scrapeTimeout: 10s
    # -- Additional labels to add to the VMServiceScrape
    labels: {}
    # -- TLS config for scraping the secure metrics endpoint
    tlsConfig:
      # -- Skip TLS verification (useful with self-signed certs). Set to false and configure trusted CA in your scraping stack for strict verification.
      insecureSkipVerify: true
      # -- Optional serverName override, e.g. "openbao-operator-controller-metrics.<ns>.svc"
      serverName: ""

# -- Leader election configuration
leaderElection:
  # -- Enable leader election for HA deployments
  enabled: true

# -- Health probe configuration
healthProbes:
  # -- Port for health probes
  port: 8081
  # -- Liveness probe initial delay
  livenessInitialDelaySeconds: 15
  # -- Liveness probe period
  livenessPeriodSeconds: 20
  # -- Readiness probe initial delay
  readinessInitialDelaySeconds: 5
  # -- Readiness probe period
  readinessPeriodSeconds: 10

# -- ValidatingAdmissionPolicy configuration
admissionPolicies:
  # -- Enable ValidatingAdmissionPolicies for resource protection.
  # -- WARNING: Setting this to false is treated as UNSAFE MODE. The chart will set
  # -- `OPENBAO_UNSAFE_ADMISSION_DISABLED=true` so the operator can start without
  # -- admission guardrails. Intended only for development/break-glass scenarios.
  enabled: true
  # Provisioner RBAC policy configuration (multi-tenant mode).
  #
  # These lists are used to deny the Provisioner from creating/updating/deleting
  # tenant RBAC in platform/system namespaces. The release namespace is always
  # denied (where the operator runs).
  #
  # This is defense-in-depth for clusters that have provider-reserved namespaces
  # beyond the standard `kube-*` set.
  provisionerRBAC:
    # -- Exact namespace names to deny.
    deniedNamespaces:
      - openshift
    # -- Namespace prefixes to deny.
    deniedNamespacePrefixes:
      - kube-
      - openshift-
      - gke-
      # Common managed-cluster / addon namespaces (provider-specific; tune as needed).
      - eks-
      - aws-
      - aks-
      - azure-
  # -- Deprecated: no longer used.
  # -- Maintenance authorization is now delegated through Kubernetes RBAC using
  # -- the custom `maintenance` verb on `openbaoclusters.openbao.org`.
  maintenanceBreakGlassGroups:
    - system:masters

# -- Projected ServiceAccount token configuration for operator pods
# The controller/provisioner disable default token automount and instead mount
# explicit projected tokens with a bounded TTL.
serviceAccountToken:
  # -- Audience to use for the projected Kubernetes API ServiceAccount token.
  # Defaults to empty, which lets the API server decide the default audience. This is
  # the most portable (cloud-agnostic) option.
  #
  # If you want to pin the audience explicitly, set this to a value accepted by the
  # API server (`--api-audiences`). An incorrect value typically results in 401s for
  # in-cluster API calls.
  kubernetesAudience: ""
  # -- Audience to use for projected OpenBao auth tokens mounted into the controller
  # -- and executor Jobs. This must match the OpenBao JWT role `bound_audiences`.
  openBaoAudience: "openbao-internal"

# -- NetworkPolicy configuration for operator pods
networkPolicy:
  # -- Enable NetworkPolicies for operator pod isolation
  enabled: true
  # -- Namespace labels required to access metrics endpoint
  metricsAllowedNamespaceLabels:
    metrics: enabled

# -- Gateway API configuration
gatewayAPI:
  # -- Enable Gateway API RBAC permissions (httproutes, tlsroutes, backendtlspolicies)
  # Set to false if your cluster does not use Gateway API
  enabled: true
