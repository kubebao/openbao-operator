# Namespace transformation in this overlay runs after the base's strip patches.
# Admission policies and bindings remain cluster-scoped.
patchesJson6902:
  - target:
      group: admissionregistration.k8s.io
      version: v1
      kind: ValidatingAdmissionPolicy(Binding)?
      name: ".*"
    patch: |-
      - op: remove
        path: /metadata/namespace
