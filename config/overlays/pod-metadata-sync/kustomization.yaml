apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openbao-operator-system
resources:
  - ../../default

# Replace all fields with the platform-approved exact identity, namespaces, and observed annotation keys.
configMapGenerator:
  - name: pod-metadata-sync
    literals:
      - 'callers={"kubernetes-super-admin":{"openbao-demo":["example.com/observed-host-annotation"]}}'

replacements:
  - source:
      kind: ConfigMap
      name: pod-metadata-sync
      fieldPath: data.callers
    targets:
      - select:
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-lock-managed-resource-mutations
        fieldPaths:
          - spec.variables.[name=pod_metadata_sync_callers].expression

# This overlay applies its namespace after the base's strip patches.
patchesJson6902:
  - target:
      group: admissionregistration.k8s.io
      version: v1
      kind: ValidatingAdmissionPolicy(Binding)?
      name: ".*"
    patch: |-
      - op: remove
        path: /metadata/namespace

# A key reference preserves literal usernames without environment expansion.
# The generated ConfigMap name changes with its contents and rolls both managers.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sync-settings
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: OPENBAO_ADMISSION_POD_METADATA_SYNC_CALLERS
                    value: null
                    valueFrom:
                      configMapKeyRef:
                        name: pod-metadata-sync
                        key: callers
