apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openbao-operator-system
resources:
  - ../../default

# Replace all fields with the platform-approved exact identity, namespaces, and observed annotation keys.
configMapGenerator:
  - name: pod-metadata-sync
    literals:
      - 'callers={"kubernetes-super-admin":{"openbao-demo":["example.com/observed-host-annotation"]}}'

replacements:
  - source:
      kind: ConfigMap
      name: pod-metadata-sync
      fieldPath: data.callers
    targets:
      - select:
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-lock-managed-resource-mutations
        fieldPaths:
          - spec.variables.[name=pod_metadata_sync_callers].expression
