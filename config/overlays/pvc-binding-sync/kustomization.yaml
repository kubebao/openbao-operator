apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openbao-operator-system
resources:
  - ../../default

# Replace these exact caller/namespace pairs with the platform-approved scope.
configMapGenerator:
  - name: pvc-binding-sync
    literals:
      - 'callers={"kubernetes-super-admin":["openbao-demo"]}'

replacements:
  - source:
      kind: ConfigMap
      name: pvc-binding-sync
      fieldPath: data.callers
    targets:
      - select:
          kind: ValidatingAdmissionPolicy
          name: openbao-operator-openbao-lock-managed-resource-mutations
        fieldPaths:
          - spec.variables.[name=pvc_binding_sync_callers].expression
