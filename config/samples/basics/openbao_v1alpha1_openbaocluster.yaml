apiVersion: openbao.org/v1alpha1
kind: OpenBaoCluster
metadata:
  labels:
    app.kubernetes.io/name: openbao-operator
    app.kubernetes.io/managed-by: kustomize
  name: openbaocluster-sample
spec:
  version: "2.4.4"
  # image: "openbao/openbao:2.4.4" # Optional: inferred from version
  # Optional: Supply chain security (Cosign image verification + digest pinning).
  # When enabled, verification applies to all operator-managed images for this cluster
  # (StatefulSets, Deployments, and Jobs), including helper images like backup/upgrade executors.
  # imageVerification:
  #   enabled: true
  #   # publicKey: |
  #   #   -----BEGIN PUBLIC KEY-----
  #   #   ...
  #   #   -----END PUBLIC KEY-----
  #   failurePolicy: Block # or Warn
  replicas: 3
  profile: Development
  controllerJWTMode: Target
  selfInit:
    enabled: true
    oidc:
      enabled: true
    requests:
      - name: enable-stdout-audit
        operation: update
        path: sys/audit/stdout
        auditDevice:
          type: file
          fileOptions:
            filePath: stdout
      # This evaluation role can read health. Add administrator access before production.
      # Update bound_subject when applying the sample outside the default namespace.
      - name: create-sample-client-policy
        operation: update
        path: sys/policies/acl/sample-read
        policy:
          policy: 'path "sys/health" { capabilities = ["read"] }'
      - name: bind-sample-client-role
        operation: update
        path: auth/jwt-operator/role/sample-client
        data:
          role_type: jwt
          user_claim: sub
          bound_audiences: [openbao-sample-client]
          bound_subject: system:serviceaccount:default:openbaocluster-sample-client
          token_policies: [sample-read]
          token_ttl: 10m
  tls:
    enabled: true
    rotationPeriod: "720h"
  storage:
    size: "10Gi"
  deletionPolicy: Retain
  # Structured configuration
  configuration:
    # Enable web UI
    ui: true
    # Log level
    logLevel: "info"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbaocluster-sample-client
