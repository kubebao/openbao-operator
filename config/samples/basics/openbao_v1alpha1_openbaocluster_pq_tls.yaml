apiVersion: openbao.org/v1alpha1
kind: OpenBaoCluster
metadata:
  name: openbao-pq-tls
spec:
  version: "2.7.0"
  profile: Development
  controllerJWTMode: Target
  selfInit:
    enabled: true
    oidc:
      enabled: true
    requests:
      - name: enable-stdout-audit
        operation: update
        path: sys/audit/stdout
        auditDevice:
          type: file
          fileOptions:
            filePath: stdout
      # This evaluation role can read health. Add administrator access before production.
      # Update bound_subject when applying the sample outside the default namespace.
      - name: create-sample-client-policy
        operation: update
        path: sys/policies/acl/sample-read
        policy:
          policy: 'path "sys/health" { capabilities = ["read"] }'
      - name: bind-sample-client-role
        operation: update
        path: auth/jwt-operator/role/sample-client
        data:
          role_type: jwt
          user_claim: sub
          bound_audiences: [openbao-sample-client]
          bound_subject: system:serviceaccount:default:openbao-pq-tls-client
          token_policies: [sample-read]
          token_ttl: 10m
  replicas: 3
  tls:
    enabled: true
    mode: OperatorManaged
    rotationPeriod: "720h"
  storage:
    size: "10Gi"
  deletionPolicy: Retain
  configuration:
    listener:
      tlsMinVersion: tls13
      tlsMaxVersion: tls13
      tlsKeyExchangePreferences:
        - X25519MLKEM768
        - SecP256r1MLKEM768
        - SecP384r1MLKEM1024

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-pq-tls-client
