# OpenBaoCluster with Self-Initialization
#
# This example demonstrates OpenBao's self-initialization feature, which allows
# declarative cluster bootstrapping. When enabled:
# - OpenBao initializes itself automatically on first start
# - The root token is automatically revoked after initialization (not stored)
# - Initial configuration (audit devices, auth methods, etc.) is applied during init
#
# Requires OpenBao v2.4.0 or later.
# See: https://openbao.org/docs/configuration/self-init/
apiVersion: openbao.org/v1alpha1
kind: OpenBaoCluster
metadata:
  labels:
    app.kubernetes.io/name: openbao-operator
    app.kubernetes.io/managed-by: kustomize
  name: openbaocluster-selfinit
spec:
  controllerJWTMode: Target
  version: "2.4.4"
  replicas: 3
  profile: Development
  tls:
    enabled: true
    rotationPeriod: "720h"
  storage:
    size: "10Gi"
  deletionPolicy: Retain
  # Structured configuration
  configuration:
    logLevel: "info"
    ui: true
    logging:
      format: "json"
  # Self-initialization configuration
  selfInit:
    enabled: true
    oidc:
      enabled: true
    requests:
      # Create a narrow policy for the sample client.
      - name: create-sample-read-policy
        operation: update
        path: sys/policies/acl/sample-read
        policy:
          policy: |
            path "sys/health" {
              capabilities = ["read"]
            }
      # Bind a dedicated ServiceAccount to the JWT mount created by selfInit.oidc.
      # Change bound_subject if you apply this sample in another namespace.
      - name: bind-sample-client-role
        operation: update
        path: auth/jwt-operator/role/openbao-sample-client
        data:
          role_type: jwt
          bound_audiences:
            - openbao-internal
          bound_subject: system:serviceaccount:default:openbao-sample-client
          user_claim: sub
          token_policies:
            - sample-read
          token_no_default_policy: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-sample-client
