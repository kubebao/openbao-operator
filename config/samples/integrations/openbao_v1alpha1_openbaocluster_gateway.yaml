apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bao-gateway-selfsigned-issuer
  namespace: default
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bao-gateway-cert
  namespace: default
spec:
  # This secret is referenced by the Traefik Gateway HTTPS listener in
  # test/cluster/traefik-gateway-values.yaml (certificateRefs.name: bao-tls).
  secretName: bao-tls
  dnsNames:
    - bao.adfinis.localhost
  issuerRef:
    kind: Issuer
    name: bao-gateway-selfsigned-issuer
---
# OpenBaoCluster with Gateway API
#
# This example demonstrates using Kubernetes Gateway API for external access
# instead of Ingress. Gateway API provides a more expressive, portable, and
# role-oriented model for traffic management.
#
# Prerequisites:
# - A Gateway controller must be installed (e.g., Envoy Gateway, Istio, Contour)
# - A Gateway resource must exist (see example below)
# - Gateway API CRDs must be installed in the cluster
#
# The Operator creates an HTTPRoute that routes traffic from the Gateway
# to the OpenBao Service. The Gateway hostname is automatically added to
# the TLS SANs.
apiVersion: openbao.org/v1alpha1
kind: OpenBaoCluster
metadata:
  labels:
    app.kubernetes.io/name: openbao-operator
    app.kubernetes.io/managed-by: kustomize
  name: openbaocluster-gateway
spec:
  version: "2.4.4"
  replicas: 3
  profile: Development
  controllerJWTMode: Target
  selfInit:
    enabled: true
    oidc:
      enabled: true
    requests:
      - name: enable-stdout-audit
        operation: update
        path: sys/audit/stdout
        auditDevice:
          type: file
          fileOptions:
            filePath: stdout
      # This evaluation role can read health. Add administrator access before production.
      # Update bound_subject when applying the sample outside the default namespace.
      - name: create-sample-client-policy
        operation: update
        path: sys/policies/acl/sample-read
        policy:
          policy: 'path "sys/health" { capabilities = ["read"] }'
      - name: bind-sample-client-role
        operation: update
        path: auth/jwt-operator/role/sample-client
        data:
          role_type: jwt
          user_claim: sub
          bound_audiences: [openbao-sample-client]
          bound_subject: system:serviceaccount:default:bao-gateway-selfsigned-issuer-client
          token_policies: [sample-read]
          token_ttl: 10m
  initContainer:
    enabled: true
    # For k3d clusters, use the k3d registry path: k3d-registry.localhost:5000/openbao-init:dev
    # For other environments, use a fully qualified image reference
    # Custom helper images require `usecustomexecutables` on this OpenBaoCluster.
    image: "k3d-registry.localhost:5000/openbao-init:dev-0.0.1"
  tls:
    enabled: true
    rotationPeriod: "720h"
  storage:
    size: "10Gi"
  deletionPolicy: Retain
  # Structured configuration
  configuration:
    logLevel: "info"
    ui: true
    logging:
      format: "json"
  # Gateway API configuration
  gateway:
    enabled: true
    gatewayRef:
      # Reference to an existing Gateway resource
      # The Gateway must be created separately by the platform team
      name: traefik-gateway
      namespace: default
    # Hostname for routing traffic to this OpenBao cluster
    # This will be automatically added to the server certificate SANs
    hostname: bao.adfinis.localhost
    # Optional path prefix (defaults to "/")
    path: /
    # Optional annotations for the HTTPRoute
    annotations:
      gateway.example.com/backend-protocol: HTTPS
---
# Example Gateway resource (to be deployed by platform team)
# This is provided for reference only - the actual Gateway configuration
# depends on your Gateway controller implementation.
#
# apiVersion: gateway.networking.k8s.io/v1
# kind: Gateway
# metadata:
#   name: main-gateway
#   namespace: gateway-system
# spec:
#   gatewayClassName: envoy
#   listeners:
#     - name: https
#       port: 443
#       protocol: HTTPS
#       hostname: "*.example.com"
#       tls:
#         mode: Terminate
#         certificateRefs:
#           - name: wildcard-tls-secret
#             namespace: gateway-system

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bao-gateway-selfsigned-issuer-client
