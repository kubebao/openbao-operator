apiVersion: openbao.org/v1alpha1
kind: OpenBaoCluster
metadata:
  labels:
    app.kubernetes.io/name: openbao-operator
    app.kubernetes.io/managed-by: kustomize
  name: openbaocluster-external
spec:
  version: "2.4.4"
  replicas: 3
  profile: Development
  controllerJWTMode: Target
  selfInit:
    enabled: true
    oidc:
      enabled: true
    requests:
      - name: enable-stdout-audit
        operation: update
        path: sys/audit/stdout
        auditDevice:
          type: file
          fileOptions:
            filePath: stdout
      # This evaluation role can read health. Add administrator access before production.
      # Update bound_subject when applying the sample outside the default namespace.
      - name: create-sample-client-policy
        operation: update
        path: sys/policies/acl/sample-read
        policy:
          policy: 'path "sys/health" { capabilities = ["read"] }'
      - name: bind-sample-client-role
        operation: update
        path: auth/jwt-operator/role/sample-client
        data:
          role_type: jwt
          user_claim: sub
          bound_audiences: [openbao-sample-client]
          bound_subject: system:serviceaccount:default:openbaocluster-external-client
          token_policies: [sample-read]
          token_ttl: 10m
  tls:
    enabled: true
    rotationPeriod: "720h"
    extraSANs:
      - "bao.localhost"
  storage:
    size: "10Gi"
  service:
    type: ClusterIP
    annotations:
      # For Traefik v3: instruct Traefik to use HTTPS when communicating with OpenBao backend
      traefik.ingress.kubernetes.io/service.serversscheme: https
      # Reference a ServersTransport that trusts the OpenBaoCluster CA certificate
      # Format: <namespace>-<name>@kubernetescrd (required even for same namespace in some Traefik versions)
      # See website/content/docs/configure/expose.md (Traefik v3 section)
      traefik.ingress.kubernetes.io/service.serverstransport: openbao-operator-system-openbao-tls-transport@kubernetescrd
  ingress:
    enabled: true
    className: "traefik"
    host: "bao.localhost"
    path: "/"
    annotations:
      # Use the websecure entrypoint (HTTPS) for TLS termination at Traefik
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
  network:
    trustedIngressPeers:
      # Change this selector when Traefik runs in another namespace.
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik
  deletionPolicy: Retain
  # Structured configuration
  configuration:
    logLevel: "info"
    ui: true
    logging:
      format: "json"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbaocluster-external-client
