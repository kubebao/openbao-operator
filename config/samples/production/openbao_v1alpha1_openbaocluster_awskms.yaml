# OpenBaoCluster with AWS KMS Auto-Unseal
#
# This example demonstrates using AWS KMS for auto-unseal instead of storing
# the unseal key in Kubernetes Secrets. This provides enhanced security by
# shifting the root of trust to AWS KMS.
#
# Prerequisites:
# - AWS KMS key created
# - IAM permissions for the pod to access KMS (via IRSA, another workload identity integration, or credentials Secret)
# - If not using IRSA (IAM Roles for Service Accounts), create a credentials Secret
#
# See: website/content/docs/configure/unseal.md
apiVersion: openbao.org/v1alpha1
kind: OpenBaoCluster
metadata:
  labels:
    app.kubernetes.io/name: openbao-operator
    app.kubernetes.io/managed-by: kustomize
  name: openbaocluster-awskms
spec:
  profile: Hardened
  controllerJWTMode: Target
  version: "2.4.4"
  replicas: 3
  tls:
    enabled: true
    mode: External
  storage:
    size: "10Gi"
  deletionPolicy: Retain
  # Structured configuration
  configuration:
    logLevel: "info"
    ui: true
    logging:
      format: "json"
  # Optional: annotate the OpenBao ServiceAccount for IAM-based workload identity
  # serviceAccount:
  #   annotations:
  #     eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/openbao-awskms"
  # External KMS auto-unseal (AWS KMS)
  # No static unseal key Secret is created - the root of trust is AWS KMS
  unseal:
    type: awskms
    awskms:
      region: us-east-1
      # Use KMS key ARN or alias
      kmsKeyID: alias/openbao-unseal
      # Alternative: Use full ARN
      # kmsKeyID: "arn:aws:kms:us-east-1:123456789012:key/abcd1234-5678-90ab-cdef-1234567890ab"
      # Optional: Custom KMS endpoint (for VPC endpoints)
      # endpoint: "https://kms.us-east-1.amazonaws.com"
    # Optional: If not using IRSA (IAM Roles for Service Accounts)
    # credentialsSecretRef:
    #   name: aws-kms-credentials
  selfInit:
    enabled: true
    oidc:
      enabled: true
    requests:
      # Replace the example issuer and audience with values tested against your identity provider.
      - name: enable-human-jwt-auth
        operation: update
        path: sys/auth/jwt
        authMethod:
          type: jwt
      - name: configure-human-jwt-auth
        operation: update
        path: auth/jwt/config
        data:
          jwks_url: "https://idp.example.com/.well-known/jwks.json"
          bound_issuer: "https://idp.example.com/"
      - name: create-platform-operator-policy
        operation: update
        path: sys/policies/acl/platform-operator
        policy:
          policy: |
            path "*" {
              capabilities = ["create", "read", "update", "delete", "list", "sudo"]
            }
      - name: bind-platform-operator-role
        operation: update
        path: auth/jwt/role/platform-operator
        data:
          role_type: jwt
          bound_audiences:
            - openbao
          bound_claims:
            groups: platform-operators
          user_claim: sub
          token_policies:
            - platform-operator
---
# Example: Create AWS KMS credentials Secret (only if not using IRSA)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: aws-kms-credentials
#   namespace: openbaocluster-awskms
# type: Opaque
# stringData:
#   AWS_ACCESS_KEY_ID: "YOUR_ACCESS_KEY_ID"
#   AWS_SECRET_ACCESS_KEY: "YOUR_SECRET_ACCESS_KEY"
#   # Optional: AWS session token (for temporary credentials)
#   # AWS_SESSION_TOKEN: "YOUR_SESSION_TOKEN"
