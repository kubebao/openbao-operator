#   namespace: default
# spec:
#   secretName: openbaocluster-external-tls-tls-server
#   dnsNames:
#     # Client access (Gateway/Ingress hostname)
#     - openbao.example.com
#     # Raft join verification (required; used as retry_join leader_tls_servername)
#     - openbao-cluster-openbaocluster-external-tls.local
#     - openbaocluster-external-tls.default.svc
#     - *.openbaocluster-external-tls.default.svc
#     - openbaocluster-external-tls-public.default.svc
#   issuerRef:
