# metadata:
#   name: openbaocluster-external-tls-ca
#   namespace: default
# spec:
#   secretName: openbaocluster-external-tls-tls-ca
#   issuerRef:
#     kind: ClusterIssuer
#     name: corporate-ca-issuer
#   commonName: openbaocluster-external-tls-ca
# ---
# apiVersion: cert-manager.io/v1
# kind: Certificate
# metadata:
