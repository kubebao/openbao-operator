# OpenBaoCluster with KMIP Auto-Unseal
#
# This example demonstrates using a KMIP (Key Management Interoperability Protocol)
# server for auto-unseal. KMIP is a standard protocol for key management operations.
#
# Prerequisites:
# - KMIP server accessible from the cluster
# - Client certificate and key for authenticating to the KMIP server
# - CA certificate for verifying the KMIP server's TLS certificate
#
# See: https://openbao.org/docs/configuration/seal/kmip/
apiVersion: openbao.org/v1alpha1
kind: OpenBaoCluster
metadata:
  labels:
    app.kubernetes.io/name: openbao-operator
    app.kubernetes.io/managed-by: kustomize
  name: openbaocluster-kmip
spec:
  profile: Hardened
  controllerJWTMode: Target
  version: "2.4.4"
  replicas: 3
  tls:
    enabled: true
    mode: External
  storage:
    size: "10Gi"
  deletionPolicy: Retain
  # Structured configuration
  configuration:
    logLevel: "info"
    ui: true
    logging:
      format: "json"
  # KMIP seal configuration
  unseal:
    type: kmip
    kmip:
      # Endpoint and wrapping-key identifier in the KMIP server
      endpoint: "kmip.example.com:5696"
      kmsKeyID: "1"
      # Path to client certificate for KMIP communication
      clientCert: "/etc/bao/seal-creds/client.crt"
      # Path to private key for KMIP communication
      clientKey: "/etc/bao/seal-creds/client.key"
      # Path to CA certificate for KMIP communication
      caCert: "/etc/bao/seal-creds/ca.crt"
      # Optional: SNI server name for TLS
      serverName: "kmip.example.com"
    # Optional: Reference to Secret containing KMIP certificates
    # credentialsSecretRef:
    #   name: kmip-certificates
  # Self-initialization (required for Hardened profile)
  selfInit:
    enabled: true
    oidc:
      enabled: true
    requests:
      # Replace the example issuer and audience with values tested against your identity provider.
      - name: enable-human-jwt-auth
        operation: update
        path: sys/auth/jwt
        authMethod:
          type: jwt
      - name: configure-human-jwt-auth
        operation: update
        path: auth/jwt/config
        data:
          jwks_url: "https://idp.example.com/.well-known/jwks.json"
          bound_issuer: "https://idp.example.com/"
      - name: create-platform-operator-policy
        operation: update
        path: sys/policies/acl/platform-operator
        policy:
          policy: |
            path "*" {
              capabilities = ["create", "read", "update", "delete", "list", "sudo"]
            }
      - name: bind-platform-operator-role
        operation: update
        path: auth/jwt/role/platform-operator
        data:
          role_type: jwt
          bound_audiences:
            - openbao
          bound_claims:
            groups: platform-operators
          user_claim: sub
          token_policies:
            - platform-operator
---
# Example: Create KMIP certificates Secret
# The Secret should contain the client certificate, key, and CA certificate
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: kmip-certificates
#   namespace: openbaocluster-kmip
# type: Opaque
# stringData:
#   client.crt: |
#     -----BEGIN CERTIFICATE-----
#     ...
#     -----END CERTIFICATE-----
#   client.key: |
#     -----BEGIN PRIVATE KEY-----
#     ...
#     -----END PRIVATE KEY-----
#   ca.pem: |
#     -----BEGIN CERTIFICATE-----
#     ...
#     -----END CERTIFICATE-----
