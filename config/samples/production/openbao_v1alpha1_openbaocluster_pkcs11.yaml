# OpenBaoCluster with PKCS#11 Auto-Unseal (HSM)
#
# This example demonstrates using a Hardware Security Module (HSM) via PKCS#11
# for auto-unseal. This provides the highest level of security by using dedicated
# hardware for key management.
#
# Prerequisites:
# - HSM device accessible from the cluster
# - PKCS#11 library provided by the HSM vendor
# - HSM slot configured with appropriate keys
# - PIN for accessing the HSM (stored securely)
#
# See: https://openbao.org/docs/configuration/seal/pkcs11/
apiVersion: openbao.org/v1alpha1
kind: OpenBaoCluster
metadata:
  labels:
    app.kubernetes.io/name: openbao-operator
    app.kubernetes.io/managed-by: kustomize
  name: openbaocluster-pkcs11
spec:
  profile: Hardened
  controllerJWTMode: Target
  version: "2.4.4"
  replicas: 3
  tls:
    enabled: true
    mode: External
  storage:
    size: "10Gi"
  deletionPolicy: Retain
  # Structured configuration
  configuration:
    logLevel: "info"
    ui: true
    logging:
      format: "json"
  # PKCS#11 seal configuration
  unseal:
    type: pkcs11
    pkcs11:
      # Path to the PKCS#11 library provided by the HSM vendor
      lib: "/usr/lib/libpkcs11.so"
      # Select one HSM slot by number or tokenLabel.
      slot: "0"
      # Optional: PIN for accessing the HSM token (STRONGLY recommended to use CredentialsSecretRef)
      # pin: "your-hsm-pin"
      # Label for the encryption key used by OpenBao
      keyLabel: "vault-key"
      # Optional: Disable the software encryption fallback.
      # disableSoftwareEncryption: true
      # Optional: Hash algorithm for RSA with OAEP padding (sha1, sha224, sha256, sha384, sha512)
      # rsaOAEPHash: "sha256"
    # Optional: Reference to Secret containing HSM PIN
    # credentialsSecretRef:
    #   name: pkcs11-pin
  # Self-initialization (required for Hardened profile)
  selfInit:
    enabled: true
    oidc:
      enabled: true
    requests:
      # Replace the example issuer and audience with values tested against your identity provider.
      - name: enable-human-jwt-auth
        operation: update
        path: sys/auth/jwt
        authMethod:
          type: jwt
      - name: configure-human-jwt-auth
        operation: update
        path: auth/jwt/config
        data:
          jwks_url: "https://idp.example.com/.well-known/jwks.json"
          bound_issuer: "https://idp.example.com/"
      - name: create-platform-operator-policy
        operation: update
        path: sys/policies/acl/platform-operator
        policy:
          policy: |
            path "*" {
              capabilities = ["create", "read", "update", "delete", "list", "sudo"]
            }
      - name: bind-platform-operator-role
        operation: update
        path: auth/jwt/role/platform-operator
        data:
          role_type: jwt
          bound_audiences:
            - openbao
          bound_claims:
            groups: platform-operators
          user_claim: sub
          token_policies:
            - platform-operator
---
# Example: Create PKCS#11 PIN Secret
