apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: openbaoclusters.openbao.org
spec:
  group: openbao.org
  names:
    kind: OpenBaoCluster
    listKind: OpenBaoClusterList
    plural: openbaoclusters
    shortNames:
    - bao
    - baoc
    singular: openbaocluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OpenBaoCluster is the Schema for the openbaoclusters API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of OpenBaoCluster.
            properties:
              audit:
                description: |-
                  Audit configures declarative audit devices for the OpenBao cluster.
                  See: https://openbao.org/docs/configuration/audit/
                items:
                  description: |-
                    AuditDevice defines a declarative audit device configuration.
                    See: https://openbao.org/docs/configuration/audit/
                  properties:
                    description:
                      description: Description is an optional description for the
                        audit device.
                      type: string
                    fileOptions:
                      description: |-
                        FileOptions configures options for file audit devices.
                        Only used when Type is "file".
                      properties:
                        filePath:
                          description: |-
                            FilePath is the path to where the audit log will be written.
                            Special keywords: "stdout" writes to standard output, "discard" discards output.
                          minLength: 1
                          type: string
                        mode:
                          description: |-
                            Mode is a string containing an octal number representing the bit pattern for the file mode.
                            Defaults to "0600" if not specified. Set to "0000" to prevent OpenBao from modifying the file mode.
                          type: string
                      required:
                      - filePath
                      type: object
                    httpOptions:
                      description: |-
                        HTTPOptions configures options for HTTP audit devices.
                        Only used when Type is "http".
                      properties:
                        headers:
                          description: |-
                            Headers is a JSON object describing headers. Must take the shape map[string][]string,
                            i.e., an object of headers, with each having one or more values.
                            Headers without values will be ignored. The operator renders this object as OpenBao's
                            expected JSON-encoded options.headers string.
                          x-kubernetes-preserve-unknown-fields: true
                        uri:
                          description: URI is the URI of the remote server where the
                            audit logs will be written.
                          minLength: 1
                          type: string
                      required:
                      - uri
                      type: object
                    options:
                      description: |-
                        Options contains device-specific configuration options as a string map.
                        This is a fallback for backward compatibility and advanced use cases.
                        If structured options (FileOptions, HTTPOptions, etc.) are provided, they take precedence.
                        OpenBao audit options are string-to-string; scalar JSON values are rendered as strings,
                        while nested objects and arrays are rejected. For HTTP headers, prefer httpOptions.headers.
                      x-kubernetes-preserve-unknown-fields: true
                    path:
                      description: Path is the path of the audit device in the root
                        namespace.
                      minLength: 1
                      type: string
                    socketOptions:
                      description: |-
                        SocketOptions configures options for socket audit devices.
                        Only used when Type is "socket".
                      properties:
                        address:
                          description: |-
                            Address is the socket server address to use.
                            Example: "127.0.0.1:9090" or "/tmp/audit.sock".
                          type: string
                        socketType:
                          description: |-
                            SocketType is the socket type to use, any type compatible with net.Dial is acceptable.
                            Defaults to "tcp" if not specified.
                          type: string
                        writeTimeout:
                          description: |-
                            WriteTimeout is the (deadline) time in seconds to allow writes to be completed over the socket.
                            A zero value means that write attempts will not time out.
                            Defaults to "2s" if not specified.
                          type: string
                      type: object
                    syslogOptions:
                      description: |-
                        SyslogOptions configures options for syslog audit devices.
                        Only used when Type is "syslog".
                      properties:
                        facility:
                          description: |-
                            Facility is the syslog facility to use.
                            Defaults to "AUTH" if not specified.
                          type: string
                        tag:
                          description: |-
                            Tag is the syslog tag to use.
                            Defaults to "openbao" if not specified.
                          type: string
                      type: object
                    type:
                      description: Type is the type of audit device (e.g., "file",
                        "syslog", "socket", "http").
                      enum:
                      - file
                      - syslog
                      - socket
                      - http
                      minLength: 1
                      type: string
                  required:
                  - path
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: fileOptions is only supported when type is file
                    rule: self.type == 'file' || !has(self.fileOptions)
                  - message: httpOptions is only supported when type is http
                    rule: self.type == 'http' || !has(self.httpOptions)
                  - message: syslogOptions is only supported when type is syslog
                    rule: self.type == 'syslog' || !has(self.syslogOptions)
                  - message: socketOptions is only supported when type is socket
                    rule: self.type == 'socket' || !has(self.socketOptions)
                type: array
                x-kubernetes-list-map-keys:
                - path
                x-kubernetes-list-type: map
              auditFileStorage:
                description: |-
                  AuditFileStorage configures a shared filesystem integration point for file audit devices.
                  When configured, file audit device paths must be under auditFileStorage.mountPath.
                properties:
                  existingClaimName:
                    description: |-
                      ExistingClaimName is the name of a pre-created RWX PVC in the same namespace.
                      Required when Mode is ExistingPVC.
                    minLength: 1
                    type: string
                  mode:
                    description: Mode selects whether the operator creates a dedicated
                      RWX PVC or mounts an existing one.
                    enum:
                    - ManagedPVC
                    - ExistingPVC
                    type: string
                  mountPath:
                    default: /openbao/audit
                    description: |-
                      MountPath is where the audit file storage PVC is mounted in OpenBao Pods.
                      File audit device paths must be under this path when auditFileStorage is configured.
                    type: string
                  size:
                    description: |-
                      Size is the requested capacity for the managed audit file storage PVC.
                      Required when Mode is ManagedPVC.
                    minLength: 1
                    type: string
                  storageClassName:
                    description: StorageClassName is an optional StorageClass for
                      the managed audit file storage PVC.
                    type: string
                required:
                - mode
                type: object
                x-kubernetes-validations:
                - message: auditFileStorage.existingClaimName is only supported when
                    mode is ExistingPVC
                  rule: self.mode != 'ManagedPVC' || !has(self.existingClaimName)
                    || size(self.existingClaimName) == 0
                - message: auditFileStorage.existingClaimName is required when mode
                    is ExistingPVC
                  rule: self.mode != 'ExistingPVC' || size(self.existingClaimName)
                    > 0
                - message: auditFileStorage.size is only supported when mode is ManagedPVC
                  rule: self.mode != 'ExistingPVC' || !has(self.size) || size(self.size)
                    == 0
                - message: auditFileStorage.storageClassName is only supported when
                    mode is ManagedPVC
                  rule: self.mode != 'ExistingPVC' || !has(self.storageClassName)
                    || size(self.storageClassName) == 0
                - message: auditFileStorage.size is required when mode is ManagedPVC
                  rule: self.mode != 'ManagedPVC' || size(self.size) > 0
                - message: auditFileStorage.mountPath must be an absolute path and
                    must not be /
                  rule: '!has(self.mountPath) || (self.mountPath.startsWith(''/'')
                    && self.mountPath != ''/'')'
              backup:
                description: Backup configures scheduled backups for the cluster.
                properties:
                  image:
                    description: |-
                      Image is the container image to use for backup operations.
                      If not specified, OPERATOR_BACKUP_IMAGE can supply a complete image reference, including a digest.
                      Otherwise, defaults to "<repo>:X.Y.Z" where <repo> is derived from OPERATOR_BACKUP_IMAGE_REPOSITORY
                      (default: "ghcr.io/kubebao/openbao-backup") and the tag matches OPERATOR_VERSION.
                      This allows users to override the image for air-gapped environments or custom registries.
                    type: string
                  jwtAuthRole:
                    description: |-
                      JWTAuthRole is the name of the JWT Auth role configured in OpenBao
                      for backup operations. When set, the backup executor will use JWT Auth
                      (projected ServiceAccount token) instead of a static token. This is the preferred authentication
                      method as tokens are automatically rotated by Kubernetes.

                      The role must be configured in OpenBao and must grant the "read" capability on
                      sys/storage/raft/snapshot. The role must bind to the backup ServiceAccount
                      (<cluster-name>-backup-serviceaccount) in the cluster namespace.

                      If OIDC is enabled in SelfInit and this field is empty, a default role
                      named "openbao-operator-backup" will be assumed/created.
                    type: string
                  restoreTest:
                    description: RestoreTest periodically restores the latest successful
                      snapshot into a disposable target.
                    properties:
                      cleanupAfterSeconds:
                        description: CleanupAfterSeconds delays deletion after snapshot
                          application to permit inspection.
                        format: int32
                        maximum: 86400
                        minimum: 0
                        type: integer
                      clusterTemplate:
                        description: |-
                          RestoreClusterTemplate is the supported fresh recovery target profile.
                          Administrators must prepare the destination namespace network boundary.
                        properties:
                          image:
                            description: Image defaults to the version-derived image.
                            type: string
                          imagePullSecrets:
                            items:
                              description: |-
                                LocalObjectReference contains enough information to let you locate the
                                referenced object inside the same namespace.
                              properties:
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                              type: object
                              x-kubernetes-map-type: atomic
                            maxItems: 2
                            type: array
                          initContainer:
                            description: |-
                              InitContainerConfig configures the init container used to render OpenBao configuration.
                              The init container is responsible for rendering the final config.hcl from a template
                              using environment variables such as HOSTNAME and POD_IP.

                              The operator relies on this init container to render config.hcl at runtime. Disabling
                              the init container is not supported and will be rejected by validation.
                            properties:
                              enabled:
                                default: true
                                description: |-
                                  Enabled controls whether the init container is used to render the configuration.
                                  The operator requires the init container; disabling it is not supported.
                                type: boolean
                              image:
                                description: |-
                                  Image is the container image to use for the init container.
                                  If not specified, OPERATOR_INIT_IMAGE can supply a complete image reference, including a digest.
                                  Otherwise, defaults to "<repo>:X.Y.Z" where <repo> is derived from OPERATOR_INIT_IMAGE_REPOSITORY
                                  (default: "ghcr.io/kubebao/openbao-init") and the tag matches OPERATOR_VERSION.
                                type: string
                            type: object
                          plugins:
                            description: |-
                              Plugins declares KMS seal plugins required by Unseal. OpenBao 2.7 requires
                              plugins for AWS, Azure, GCP, OCI, and PKCS#11 seals.
                            items:
                              description: |-
                                Plugin defines a declarative plugin configuration.
                                See: https://openbao.org/docs/configuration/plugins/
                              properties:
                                args:
                                  description: |-
                                    Args are arguments to pass to the running plugin.
                                    Only used if plugin_auto_register=true is set.
                                  items:
                                    type: string
                                  type: array
                                binaryName:
                                  description: |-
                                    BinaryName is the name of the plugin binary file within the OCI image.
                                    OpenBao 2.7 and later can infer it from the image ENTRYPOINT or CMD.
                                  minLength: 1
                                  type: string
                                command:
                                  description: |-
                                    Command is the command name of a manually downloaded plugin.
                                    Required if Image is not set. Conflicts with Image.
                                  type: string
                                env:
                                  description: |-
                                    Env are environment variables to pass to the running plugin.
                                    Only used if plugin_auto_register=true is set.
                                  items:
                                    type: string
                                  type: array
                                image:
                                  description: |-
                                    Image is the OCI image URL including registry and repository.
                                    Required if Command is not set. Conflicts with Command.
                                  type: string
                                name:
                                  description: Name is the name of the plugin.
                                  minLength: 1
                                  type: string
                                sha256sum:
                                  description: |-
                                    SHA256Sum is the expected SHA256 checksum of the plugin binary.
                                    Must be a 64-character hexadecimal string.
                                    OpenBao 2.7 and later allow omission for digest-pinned OCI images and
                                    command-based plugins. Earlier versions require this field.
                                  maxLength: 64
                                  minLength: 64
                                  pattern: ^[0-9a-fA-F]{64}$
                                  type: string
                                type:
                                  description: Type is the plugin type (e.g., "secret",
                                    "auth").
                                  minLength: 1
                                  type: string
                                version:
                                  description: |-
                                    Version is the plugin version and, when Image has no tag, the image tag.
                                    OpenBao 2.7 and later can infer it from the image tag. Command-based KMS
                                    plugins on OpenBao 2.7 and later do not require a version.
                                  minLength: 1
                                  type: string
                              required:
                              - name
                              - type
                              type: object
                            type: array
                          podMetadata:
                            description: PodMetadata supplies provider-specific workload
                              identity metadata.
                            properties:
                              annotations:
                                additionalProperties:
                                  type: string
                                description: |-
                                  Annotations are merged into the generated OpenBao Pod template annotations.
                                  Operator-managed annotations take precedence if the same key is specified here.
                                type: object
                              labels:
                                additionalProperties:
                                  type: string
                                description: |-
                                  Labels are merged into the generated OpenBao Pod template labels.
                                  Operator-managed labels take precedence if the same key is specified here.
                                type: object
                            type: object
                          resources:
                            description: ResourceRequirements describes the compute
                              resource requirements.
                            properties:
                              claims:
                                description: |-
                                  Claims lists the names of resources, defined in spec.resourceClaims,
                                  that are used by this container.

                                  This field depends on the
                                  DynamicResourceAllocation feature gate.

                                  This field is immutable. It can only be set for containers.
                                items:
                                  description: ResourceClaim references one entry
                                    in PodSpec.ResourceClaims.
                                  properties:
                                    name:
                                      description: |-
                                        Name must match the name of one entry in pod.spec.resourceClaims of
                                        the Pod where this field is used. It makes that resource available
                                        inside a container.
                                      type: string
                                    request:
                                      description: |-
                                        Request is the name chosen for a request in the referenced claim.
                                        If empty, everything from the claim is made available, otherwise
                                        only the result of this request.
                                      type: string
                                  required:
                                  - name
                                  type: object
                                type: array
                                x-kubernetes-list-map-keys:
                                - name
                                x-kubernetes-list-type: map
                              limits:
                                additionalProperties:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                description: |-
                                  Limits describes the maximum amount of compute resources allowed.
                                  More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                                type: object
                              requests:
                                additionalProperties:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                description: |-
                                  Requests describes the minimum amount of compute resources required.
                                  If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                                  otherwise to an implementation-defined value. Requests cannot exceed Limits.
                                  More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                                type: object
                            type: object
                          serviceAccount:
                            description: ServiceAccount configures credentials supplied
                              through workload identity.
                            properties:
                              annotations:
                                additionalProperties:
                                  type: string
                                description: |-
                                  Annotations to add to the ServiceAccount.
                                  Useful for cloud provider Workload Identity (e.g. eks.amazonaws.com/role-arn).
                                type: object
                              name:
                                description: |-
                                  Name overrides the generated ServiceAccount name.
                                  If not specified, defaults to "<cluster-name>-serviceaccount".
                                type: string
                            type: object
                          storage:
                            description: StorageConfig captures storage-related configuration
                              for the StatefulSet.
                            properties:
                              size:
                                description: Size is the requested persistent volume
                                  size, for example "10Gi".
                                minLength: 1
                                type: string
                              storageClassName:
                                description: StorageClassName is an optional StorageClass
                                  for the PVCs.
                                type: string
                            required:
                            - size
                            type: object
                          tls:
                            description: TLSConfig captures TLS configuration for
                              an OpenBaoCluster.
                            properties:
                              acme:
                                description: ACME configures settings when Mode is
                                  'ACME'.
                                properties:
                                  directoryURL:
                                    description: DirectoryURL is the ACME directory
                                      URL (e.g., "https://acme-v02.api.letsencrypt.org/directory").
                                    minLength: 1
                                    type: string
                                  domains:
                                    description: |-
                                      Domains is the list of domain names for which to obtain the certificate.
                                      This maps to OpenBao's listener `tls_acme_domains` field.

                                      When empty, the operator will default to an internal Service name suitable for
                                      private ACME CAs running inside the cluster (e.g., "<cluster>-acme.<namespace>.svc").
                                    items:
                                      type: string
                                    minItems: 1
                                    type: array
                                  email:
                                    description: Email is the email address to use
                                      for ACME registration.
                                    type: string
                                  sharedCache:
                                    description: |-
                                      SharedCache configures a filesystem cache shared across OpenBao replicas for ACME account
                                      and certificate state. This is required for HA ACME topologies where more than one Pod
                                      can serve the same hostname concurrently.
                                    properties:
                                      existingClaimName:
                                        description: |-
                                          ExistingClaimName is the name of a pre-created RWX PVC in the same namespace.
                                          Required when Mode is ExistingPVC.
                                        minLength: 1
                                        type: string
                                      mode:
                                        description: Mode selects whether the operator
                                          creates a dedicated RWX PVC or mounts an
                                          existing one.
                                        enum:
                                        - ManagedPVC
                                        - ExistingPVC
                                        type: string
                                      size:
                                        description: |-
                                          Size is the requested capacity for the managed ACME cache PVC.
                                          Required when Mode is ManagedPVC.
                                        minLength: 1
                                        type: string
                                      storageClassName:
                                        description: StorageClassName is an optional
                                          StorageClass for the managed ACME cache
                                          PVC.
                                        type: string
                                    required:
                                    - mode
                                    type: object
                                    x-kubernetes-validations:
                                    - message: tls.acme.sharedCache.existingClaimName
                                        is only supported when mode is ExistingPVC
                                      rule: self.mode != 'ManagedPVC' || !has(self.existingClaimName)
                                        || size(self.existingClaimName) == 0
                                    - message: tls.acme.sharedCache.existingClaimName
                                        is required when mode is ExistingPVC
                                      rule: self.mode != 'ExistingPVC' || size(self.existingClaimName)
                                        > 0
                                    - message: tls.acme.sharedCache.size is only supported
                                        when mode is ManagedPVC
                                      rule: self.mode != 'ExistingPVC' || !has(self.size)
                                        || size(self.size) == 0
                                    - message: tls.acme.sharedCache.storageClassName
                                        is only supported when mode is ManagedPVC
                                      rule: self.mode != 'ExistingPVC' || !has(self.storageClassName)
                                        || size(self.storageClassName) == 0
                                    - message: tls.acme.sharedCache.size is required
                                        when mode is ManagedPVC
                                      rule: self.mode != 'ManagedPVC' || size(self.size)
                                        > 0
                                required:
                                - directoryURL
                                type: object
                              enabled:
                                description: Enabled controls whether TLS is enabled
                                  for the cluster.
                                type: boolean
                              extraSANs:
                                description: |-
                                  ExtraSANs lists additional subject alternative names for server certificates.
                                  In OperatorManaged mode, the operator includes these names when issuing the certificate.
                                  In External mode, the operator requires the supplied certificate to contain them.
                                  Values that parse as IP addresses are treated as IP SANs; all other values are DNS SANs.
                                items:
                                  type: string
                                type: array
                              mode:
                                allOf:
                                - enum:
                                  - OperatorManaged
                                  - External
                                  - ACME
                                - enum:
                                  - OperatorManaged
                                  - External
                                  - ACME
                                default: OperatorManaged
                                description: Mode controls who manages the certificate
                                  lifecycle.
                                type: string
                              rotationPeriod:
                                description: |-
                                  RotationPeriod is a duration string (for example, "720h") controlling certificate rotation.
                                  Only used when Mode is OperatorManaged.
                                minLength: 1
                                type: string
                            required:
                            - enabled
                            type: object
                          unseal:
                            description: |-
                              Unseal uses the same provider configuration as OpenBaoCluster. The target
                              must be able to decrypt the snapshot with the original seal key material.
                            properties:
                              awskms:
                                description: |-
                                  AWSKMS configures the AWS KMS seal type.
                                  Required when Type is "awskms".
                                properties:
                                  accessKey:
                                    description: |-
                                      AccessKey is the AWS access key ID to use.
                                      Note: It is strongly recommended to use CredentialsSecretRef or Workload Identity (IRSA) instead.
                                    type: string
                                  endpoint:
                                    description: |-
                                      Endpoint is the KMS API endpoint to be used for AWS KMS requests.
                                      Useful when connecting to KMS over a VPC Endpoint.
                                    type: string
                                  kmsKeyID:
                                    description: |-
                                      KMSKeyID is the AWS KMS key ID or ARN to use for encryption and decryption.
                                      An alias in the format "alias/key-alias-name" may also be used.
                                    minLength: 1
                                    type: string
                                  region:
                                    description: Region is the AWS region where the
                                      encryption key lives.
                                    minLength: 1
                                    type: string
                                  secretKey:
                                    description: |-
                                      SecretKey is the AWS secret access key to use.
                                      Note: It is strongly recommended to use CredentialsSecretRef or Workload Identity (IRSA) instead.
                                    type: string
                                  sessionToken:
                                    description: SessionToken specifies the AWS session
                                      token.
                                    type: string
                                required:
                                - kmsKeyID
                                - region
                                type: object
                              azureKeyVault:
                                description: |-
                                  AzureKeyVault configures the Azure Key Vault seal type.
                                  Required when Type is "azurekeyvault".
                                properties:
                                  authMethod:
                                    description: |-
                                      AuthMethod selects how the seal authenticates to Azure, rendered as the
                                      seal's auth_method. When empty, OpenBao chooses: a client ID without a
                                      client secret selects managed_identity, which uses the instance metadata
                                      service. Set workload_identity for Azure Workload Identity, where the
                                      workload identity webhook also injects AZURE_CLIENT_ID.
                                    enum:
                                    - workload_identity
                                    - managed_identity
                                    - client_secret
                                    - environment
                                    - default
                                    type: string
                                  clientID:
                                    description: ClientID is the Azure client ID.
                                    type: string
                                  clientSecret:
                                    description: |-
                                      ClientSecret is the Azure client secret.
                                      Note: It is strongly recommended to use CredentialsSecretRef or Managed Service Identity instead.
                                    type: string
                                  environment:
                                    description: Environment is the Azure environment
                                      (e.g., "AzurePublicCloud", "AzureUSGovernmentCloud").
                                    type: string
                                  keyName:
                                    description: KeyName is the name of the key in
                                      the Azure Key Vault.
                                    minLength: 1
                                    type: string
                                  resource:
                                    description: |-
                                      Resource is the Azure AD resource endpoint.
                                      For Managed HSM, this should usually be "managedhsm.azure.net".
                                    type: string
                                  tenantID:
                                    description: TenantID is the Azure tenant ID.
                                    type: string
                                  vaultName:
                                    description: VaultName is the name of the Azure
                                      Key Vault.
                                    minLength: 1
                                    type: string
                                required:
                                - keyName
                                - vaultName
                                type: object
                              credentialsSecretRef:
                                description: |-
                                  CredentialsSecretRef references a Secret containing provider credentials
