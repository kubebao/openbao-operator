version: 1
versions:
  openbao:
    defaultImage: "ghcr.io/openbao/openbao:2.6.4"
  storageEmulators:
    rustfsImage: "docker.io/rustfs/rustfs@sha256:3c2d55977829620284ece8593901bf776bcfc0fc9972784352de4dcffdb92416"
    fakeGCSImage: "docker.io/fsouza/fake-gcs-server@sha256:3730da0e31f7e5186a90ec4899dc2c336104e7599df400411392ef17e684c31f"
    azuriteImage: "mcr.microsoft.com/azure-storage/azurite@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37"
  kubernetes:
    primary: "1.36.1"
    compatibility:
      - "1.34.3"
      - "1.35.1"
    releaseGate:
      - "1.34.3"
      - "1.35.1"
      - "1.36.1"
    # Kubernetes 1.37.0 is the next candidate once controller-runtime,
    # k8s.io dependencies, Kind images, and release-gate coverage are ready.
    nextCandidate: "1.37.0"

parallelism:
  defaultNodes: 1
  maxNodes: 4

ciLanes:
  - id: core
    name: "Core Lifecycle & Manager"
    labelFilter: "(((lifecycle && !controller-jwt && !tls && !hsm && !pkcs11) || manager) && !openshift)"
    prLabelFilter: "(((lifecycle && !controller-jwt && !tls && !hsm && !pkcs11) || (manager && (smoke || e2e-anchor))) && !openshift)"
    prScope: always
    timeoutMinutes: 45
    e2eTimeout: 40m
    parallelNodes: 2
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    installCSIHostPath: true
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: false
    preloadUpgradeImages: false
    preloadHardenedAssets: false
    preloadStorageEmulators: []

  - id: controller-jwt
    name: "Controller JWT Lifecycle"
    labelFilter: "(case:controller-jwt-renewal-migration-recovery && !openshift)"
    prScope: always
    timeoutMinutes: 45
    e2eTimeout: 40m
    parallelNodes: 1
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    installCSIHostPath: false
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: false
    preloadUpgradeImages: false
    preloadHardenedAssets: false
    preloadStorageEmulators: []

  - id: security
    name: "Security & Tenants"
    labelFilter: "(((security || tenancy || tls || (tenant && !lifecycle)) && !profile-hardened && !(tls && slow)) && !openshift)"
    prScope: always
    timeoutMinutes: 45
    e2eTimeout: 40m
    excludePentestOnDefaultPR: true
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: false
    preloadUpgradeImages: false
    preloadHardenedAssets: false
    preloadStorageEmulators: []

  - id: backup-restore
    name: "Backup & Restore"
    labelFilter: "(storage-providers && !openshift)"
    prScope: backup
    timeoutMinutes: 45
    e2eTimeout: 40m
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: true
    loadUpgradeExecutorImage: false
    preloadUpgradeImages: false
    preloadHardenedAssets: false
    preloadStorageEmulators:
      - rustfs
      - fake-gcs
      - azurite

  - id: restore-tests
    name: "Restore Tests"
    # Keep the full confirmation timeout separate from storage-provider coverage.
    # Cross-cluster qualification requires a manually provisioned environment.
    labelFilter: "(restore-minimal && !openshift)"
    prScope: backup
    timeoutMinutes: 45
    e2eTimeout: 40m
    parallelNodes: 2
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: true
    loadUpgradeExecutorImage: false
    preloadUpgradeImages: false
    preloadHardenedAssets: false
    preloadStorageEmulators:
      - rustfs

  - id: upgrade-rolling
    name: "Upgrade Rolling"
    # The idle strategy-switch scenario belongs to upgrade-bluegreen-core.
    labelFilter: "((upgrade && (rolling || snapshot || recovery || operation-lock) && !hardened) && !openshift && !case:idle-upgrade-strategy-switch)"
    prLabelFilter: "((upgrade && e2e-anchor && (rolling || operation-lock) && !hardened) && !openshift)"
    prScope: upgrade
    timeoutMinutes: 45
    parallelNodes: 2
    e2eTimeout: 40m
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: true
    loadUpgradeExecutorImage: true
    preloadUpgradeImages: true
    preloadHardenedAssets: false
    preloadStorageEmulators:
      - rustfs

  - id: upgrade-bluegreen-core
    name: "Upgrade Blue/Green Core"
    labelFilter: "((upgrade && bluegreen && !verification && !failure && !rollback && !chaos && !gateway && !hardened) && !openshift)"
    prLabelFilter: "((upgrade && e2e-anchor && bluegreen && !verification && !failure && !rollback && !chaos && !gateway && !hardened) && !openshift)"
    prScope: upgrade
    timeoutMinutes: 30
    parallelNodes: 2
    e2eTimeout: 25m
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: true
    loadUpgradeExecutorImage: true
    preloadUpgradeImages: true
    preloadHardenedAssets: false
    preloadStorageEmulators:
      - rustfs

  - id: upgrade-bluegreen-verification
    name: "Upgrade Blue/Green Verification"
    labelFilter: "((upgrade && bluegreen && verification && !hardened) && !openshift)"
    prScope: upgrade
    timeoutMinutes: 30
    e2eTimeout: 25m
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: true
    preloadUpgradeImages: true
    preloadHardenedAssets: false
    preloadStorageEmulators: []

  - id: upgrade-bluegreen-recovery
    name: "Upgrade Blue/Green Recovery"
    labelFilter: "((upgrade && bluegreen && (failure || rollback || chaos) && !verification && !hardened) && !openshift)"
    prLabelFilter: "((upgrade && e2e-anchor && bluegreen && failure && !verification && !hardened) && !openshift)"
    prScope: upgrade
    timeoutMinutes: 30
    e2eTimeout: 25m
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: true
    preloadUpgradeImages: true
    preloadHardenedAssets: false
    preloadStorageEmulators: []

  - id: upgrade-gateway
    name: "Upgrade Gateway"
    labelFilter: "((upgrade && gateway && !hardened) && !openshift)"
    prLabelFilter: "((upgrade && e2e-anchor && gateway && !hardened) && !openshift)"
    prScope: upgrade
    timeoutMinutes: 25
    e2eTimeout: 20m
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: true
    preloadUpgradeImages: true
    preloadHardenedAssets: false
    preloadStorageEmulators: []

  - id: hardened
    name: "Hardened (Signed)"
    labelFilter: "((profile-hardened || (tls && slow)) && !openshift)"
    prScope: hardened
    timeoutMinutes: 45
    e2eTimeout: 40m
    excludePentestOnDefaultPR: false
    hardenedSigned: true
    # Signed helpers from the verified KubeBao edge publication at 93cb468ad1ad.
    hardenedInitImage: "ghcr.io/kubebao/openbao-init@sha256:e26ca8fb159dc8d15fe0408482e2219557a79bebaad314127cf1bd920523afe1"
    hardenedUpgradeExecutorImage: "ghcr.io/kubebao/openbao-upgrade@sha256:c97b8c1aa4e7f15ebcaff501abda9309510126bc932b435ddc85ddc9796dd98b"
    loadBackupExecutorImage: true
    loadUpgradeExecutorImage: true
    preloadUpgradeImages: true
    preloadHardenedAssets: true
    preloadStorageEmulators: []

  - id: hsm
    name: "HSM / KMIP / PKCS#11"
    labelFilter: "((hsm || kmip || pkcs11) && !openshift)"
    prScope: seal
    timeoutMinutes: 45
    e2eTimeout: 40m
    parallelNodes: 1
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    openbaoImage: "openbao-softhsm:dev"
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: false
    preloadUpgradeImages: false
    preloadHardenedAssets: false
    preloadStorageEmulators: []

  - id: networking
    name: "Networking"
    networkProfile: ipv6
    labelFilter: "networking"
    prScope: always
    timeoutMinutes: 20
    e2eTimeout: 15m
    parallelNodes: 1
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    installCSIHostPath: false
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: false
    preloadUpgradeImages: false
    preloadHardenedAssets: false
    preloadStorageEmulators: []

  - id: platform-openshift
    name: "OpenShift Platform"
    labelFilter: "(openshift && platform)"
    prScope: manual
    timeoutMinutes: 45
    e2eTimeout: 40m
    includeInPRMatrix: false
    excludePentestOnDefaultPR: false
    hardenedSigned: false
    hardenedInitImage: ""
    hardenedUpgradeExecutorImage: ""
    loadBackupExecutorImage: false
    loadUpgradeExecutorImage: false
    preloadUpgradeImages: false
    preloadHardenedAssets: false
    preloadStorageEmulators: []

nightly:
  profiles:
    - id: daily
      description: "Full primary-version coverage plus compatibility smoke coverage."
      laneSets:
        - coverage: full
          kubernetes:
            - "@primary"
          lanes:
            - core
            - controller-jwt
            - security
            - backup-restore
            - restore-tests
            - upgrade-rolling
            - upgrade-bluegreen-core
            - upgrade-bluegreen-verification
            - upgrade-bluegreen-recovery
            - upgrade-gateway
            - hardened
            - networking
      rows:
        - lane: core
          kubernetes: "@compatibility"
          coverage: compatibility-smoke
          labelFilter: "(((lifecycle && smoke) || (manager && smoke)) && !openshift)"
          timeoutMinutes: 45
          e2eTimeout: 40m
        - lane: security
          kubernetes: "@compatibility"
          coverage: compatibility-smoke
          labelFilter: "(((security || tenancy || (tenant && !lifecycle)) && critical && !pentest) && !openshift)"
          timeoutMinutes: 45
          e2eTimeout: 40m

    - id: weekly-full
      description: "Full primary coverage plus alternating full compatibility coverage."
      laneSets:
        - coverage: full
          kubernetes:
            - "@primary"
            - "@compatibility"
          rotateCompatibility: true
          lanes:
            - core
            - controller-jwt
            - security
            - backup-restore
            - restore-tests
            - upgrade-rolling
            - upgrade-bluegreen-core
            - upgrade-bluegreen-verification
            - upgrade-bluegreen-recovery
            - upgrade-gateway
            - hardened
            - networking
      rows:
        - lane: core
          kubernetes: "@primary"
          coverage: network-ipv6
          networkProfile: ipv6
          labelFilter: "(lifecycle && scaling) || case:cluster-restart-at-rolls-pod"
          installCSIHostPath: false
        - lane: backup-restore
          kubernetes: "@primary"
          coverage: network-ipv6
          networkProfile: ipv6
          labelFilter: >-
            case:dr-s3-restorable-backup || case:dr-s3-restore-cr || case:dr-gcs-provider-backup-smoke ||
            case:dr-azure-provider-backup-smoke || case:backup-restore-restores-from-azure-backup-using-openbaorestore-b3ea354a
        - lane: restore-tests
          kubernetes: "@primary"
          coverage: network-ipv6
          networkProfile: ipv6
          labelFilter: "case:restore-minimal-scheduled || case:restore-minimal-retain"
          installCSIHostPath: false
        - lane: restore-tests
          kubernetes: "@primary"
          coverage: network-dual-ipv4
          networkProfile: dual-ipv4
          labelFilter: "case:restore-minimal-scheduled || case:restore-minimal-retain"
          installCSIHostPath: false
        - lane: restore-tests
          kubernetes: "@primary"
          coverage: network-dual-ipv6
          networkProfile: dual-ipv6
          labelFilter: "case:restore-minimal-scheduled || case:restore-minimal-retain"
          installCSIHostPath: false
        - lane: upgrade-rolling
          kubernetes: "@primary"
          coverage: network-ipv6
          networkProfile: ipv6
          labelFilter: "case:upgrade-rolling-happy-path"
        - lane: networking
          kubernetes: "@primary"
          coverage: network-ipv4
          networkProfile: ipv4
        - lane: networking
          kubernetes: "@primary"
          coverage: network-dual-ipv4
          networkProfile: dual-ipv4
        - lane: networking
          kubernetes: "@primary"
          coverage: network-dual-ipv6
          networkProfile: dual-ipv6

    - id: release-gate
      description: "Manual full compatibility gate before release promotion."
      laneSets:
        - coverage: release-gate
          kubernetes:
            - "@releaseGate"
          lanes:
            - core
            - controller-jwt
            - security
            - backup-restore
            - restore-tests
            - upgrade-rolling
            - upgrade-bluegreen-core
            - upgrade-bluegreen-verification
            - upgrade-bluegreen-recovery
            - upgrade-gateway
            - hardened
            - networking

      rows:
        - lane: core
          kubernetes: "@primary"
          coverage: network-ipv6
          networkProfile: ipv6
          labelFilter: "(lifecycle && scaling) || case:cluster-restart-at-rolls-pod"
          installCSIHostPath: false
        - lane: backup-restore
          kubernetes: "@primary"
          coverage: network-ipv6
          networkProfile: ipv6
          labelFilter: >-
            case:dr-s3-restorable-backup || case:dr-s3-restore-cr || case:dr-gcs-provider-backup-smoke ||
            case:dr-azure-provider-backup-smoke || case:backup-restore-restores-from-azure-backup-using-openbaorestore-b3ea354a
        - lane: restore-tests
          kubernetes: "@primary"
          coverage: network-ipv6
          networkProfile: ipv6
          labelFilter: "case:restore-minimal-scheduled || case:restore-minimal-retain"
          installCSIHostPath: false
        - lane: restore-tests
          kubernetes: "@primary"
          coverage: network-dual-ipv4
          networkProfile: dual-ipv4
          labelFilter: "case:restore-minimal-scheduled || case:restore-minimal-retain"
          installCSIHostPath: false
        - lane: restore-tests
          kubernetes: "@primary"
          coverage: network-dual-ipv6
          networkProfile: dual-ipv6
          labelFilter: "case:restore-minimal-scheduled || case:restore-minimal-retain"
          installCSIHostPath: false
        - lane: upgrade-rolling
          kubernetes: "@primary"
          coverage: network-ipv6
          networkProfile: ipv6
          labelFilter: "case:upgrade-rolling-happy-path"
        - lane: networking
          kubernetes: "@primary"
          coverage: network-ipv4
          networkProfile: ipv4
        - lane: networking
          kubernetes: "@primary"
          coverage: network-dual-ipv4
          networkProfile: dual-ipv4
        - lane: networking
          kubernetes: "@primary"
          coverage: network-dual-ipv6
          networkProfile: dual-ipv6

